<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My EMI - Tamilanda Wallet</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/style.css">

  <meta name="theme-color" content="#09070d">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="app-header">

    <div>
      <h1>My EMI</h1>
      <p>Track your loans, EMIs & payments</p>
    </div>

    <button
      class="icon-button"
      onclick="goBack()"
    >
      ←
    </button>

  </header>


  <!-- =========================
       SUMMARY
  ========================== -->

  <section class="summary-grid">

    <div class="summary-card">
      <span>Total EMI</span>
      <strong id="totalEmis">0</strong>
    </div>

    <div class="summary-card">
      <span>Monthly EMI</span>
      <strong id="monthlyEmi">₹0.00</strong>
    </div>

    <div class="summary-card">
      <span>Remaining</span>
      <strong id="totalRemaining">₹0.00</strong>
    </div>

    <div class="summary-card">
      <span>Due Soon</span>
      <strong id="dueSoon">0</strong>
    </div>

  </section>


  <!-- =========================
       ADD EMI
  ========================== -->

  <section class="page-actions">

    <button
      class="primary-button"
      onclick="openEmiForm()"
    >
      + Add EMI
    </button>

  </section>


  <!-- =========================
       SEARCH / FILTER
  ========================== -->

  <section class="card">

    <input
      type="search"
      id="searchInput"
      class="input"
      placeholder="🔎 Search EMI, bank, phone, bike..."
      oninput="renderEmis()"
    >

    <select
      id="statusFilter"
      class="input"
      onchange="renderEmis()"
    >

      <option value="all">All EMIs</option>
      <option value="active">Active</option>
      <option value="completed">Completed</option>
      <option value="overdue">Overdue</option>

    </select>

  </section>


  <!-- =========================
       EMI FORM
  ========================== -->

  <section
    class="card"
    id="emiFormCard"
    style="display:none;"
  >

    <div class="section-title">

      <h2 id="formTitle">
        Add EMI
      </h2>

      <button
        class="secondary-button"
        onclick="closeEmiForm()"
      >
        Cancel
      </button>

    </div>


    <input
      type="hidden"
      id="editingEmiId"
    >


    <label>EMI / Loan Name</label>

    <input
      type="text"
      id="emiName"
      class="input"
      placeholder="Example: Bike EMI, Phone EMI, Bank Loan"
    >


    <label>Lender / Bank</label>

    <input
      type="text"
      id="lenderName"
      class="input"
      placeholder="Example: HDFC, SBI, Bajaj..."
    >


    <label>Account / Loan Number</label>

    <input
      type="text"
      id="loanNumber"
      class="input"
      placeholder="Optional"
    >


    <label>Total EMI / Loan Amount</label>

    <input
      type="number"
      id="emiTotalAmount"
      class="input"
      placeholder="₹ Total amount"
      min="0"
      step="0.01"
      oninput="updateEmiPreview()"
    >


    <label>Already Paid</label>

    <input
      type="number"
      id="emiAlreadyPaid"
      class="input"
      placeholder="₹ Amount already paid"
      min="0"
      step="0.01"
      oninput="updateEmiPreview()"
    >


    <div class="info-box">

      <div>
        <span>Remaining Loan</span>

        <strong id="emiRemainingPreview">
          ₹0.00
        </strong>
      </div>

    </div>


    <label>Monthly EMI Amount</label>

    <input
      type="number"
      id="monthlyPayment"
      class="input"
      placeholder="₹ Monthly payment"
      min="0"
      step="0.01"
    >


    <label>Total EMI Months</label>

    <input
      type="number"
      id="totalMonths"
      class="input"
      placeholder="Example: 12"
      min="1"
      step="1"
    >


    <label>Next Due Date</label>

    <input
      type="date"
      id="emiDueDate"
      class="input"
    >


    <label>Payment Account</label>

    <select
      id="emiAccount"
      class="input"
    >

      <option value="">
        Select account
      </option>

    </select>


    <label>Notes</label>

    <textarea
      id="emiNotes"
      class="input"
      rows="3"
      placeholder="Optional notes..."
    ></textarea>


    <button
      class="primary-button"
      onclick="saveEmi()"
    >
      Save EMI
    </button>

  </section>


  <!-- =========================
       EMI LIST
  ========================== -->

  <section>

    <div class="section-heading">
      <h2>My EMI List</h2>
    </div>

    <div id="emiList"></div>

  </section>


  <!-- =========================
       PAYMENT MODAL
  ========================== -->

  <div
    id="emiPaymentModal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-content">

      <div class="section-title">

        <div>

          <h2>Pay EMI</h2>

          <p id="paymentEmiName">
            EMI
          </p>

        </div>

        <button
          class="icon-button"
          onclick="closeEmiPaymentModal()"
        >
          ×
        </button>

      </div>


      <div class="payment-summary-box">

        <div>
          <span>Remaining</span>

          <strong id="paymentEmiRemaining">
            ₹0.00
          </strong>
        </div>

        <div>
          <span>Monthly EMI</span>

          <strong id="paymentMonthlyEmi">
            ₹0.00
          </strong>
        </div>

      </div>


      <input
        type="hidden"
        id="paymentEmiId"
      >


      <label>Amount Paid</label>

      <input
        type="number"
        id="emiPaymentAmount"
        class="input"
        placeholder="₹ EMI amount"
        min="0"
        step="0.01"
      >


      <label>Paid From</label>

      <select
        id="emiPaymentAccount"
        class="input"
      >

        <option value="">
          Select account
        </option>

      </select>


      <label>Payment Date</label>

      <input
        type="date"
        id="emiPaymentDate"
        class="input"
      >


      <label>Note</label>

      <textarea
        id="emiPaymentNote"
        class="input"
        rows="3"
        placeholder="Optional payment note..."
      ></textarea>


      <button
        class="primary-button"
        onclick="saveEmiPayment()"
      >
        + Record EMI Payment
      </button>

    </div>

  </div>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button onclick="goToPage('home')">
      🏠
      <span>Home</span>
    </button>

    <button onclick="goToPage('transactions')">
      📋
      <span>Transactions</span>
    </button>

    <button onclick="goToPage('buyers')">
      👤
      <span>Buyers</span>
    </button>

    <button onclick="goToPage('accounts')">
      🏦
      <span>Accounts</span>
    </button>

    <button onclick="goToPage('more')">
      ☰
      <span>More</span>
    </button>

  </nav>


  <!-- =========================
       APP JS
  ========================== -->

  <script src="../js/app.js"></script>


  <script>

    let walletData;
    let editingEmiId = null;


    /* =========================
       HELPERS
    ========================== */

    function money(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatMoney ===
        "function"
      ) {

        return window.TamilandaWallet.formatMoney(
          Number(value) || 0
        );

      }

      return "₹" +
        (Number(value) || 0).toLocaleString(
          "en-IN",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

    }


    function today() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.todayString ===
        "function"
      ) {

        return window.TamilandaWallet.todayString();

      }

      const d = new Date();

      return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
      );

    }


    function generateId() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.generateId ===
        "function"
      ) {

        return window.TamilandaWallet.generateId();

      }

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .substring(2, 8)
      );

    }


    function saveData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.save ===
        "function"
      ) {

        window.TamilandaWallet.save();

      }

    }


    function escapeHtml(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.escapeHtml ===
        "function"
      ) {

        return window.TamilandaWallet.escapeHtml(
          value
        );

      }

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(dateString) {

      if (!dateString) {
        return "-";
      }

      const parts =
        dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
      );

    }


    function getAccountName(accountId) {

      const account =
        (walletData.accounts || [])
          .find(
            a =>
              a.id === accountId
          );

      return account
        ? account.name
        : "Unknown Account";

    }


    /* =========================
       GET REMAINING
    ========================== */

    function getRemaining(emi) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.getEmiRemaining ===
        "function"
      ) {

        return Number(
          window.TamilandaWallet.getEmiRemaining(
            emi.id
          )
        ) || 0;

      }


      const payments =
        (walletData.emiPayments || [])
          .filter(
            payment =>
              payment.emiId === emi.id
          )
          .reduce(
            (sum, payment) =>
              sum +
              Number(payment.amount || 0),
            0
          );


      return Math.max(
        0,
        Number(
          emi.totalAmount ||
          emi.amount ||
          0
        ) -
        Number(
          emi.alreadyPaid ||
          0
        ) -
        payments
      );

    }


    function getPaid(emi) {

      const total =
        Number(
          emi.totalAmount ||
          emi.amount ||
          0
        );


      const remaining =
        getRemaining(emi);


      return Math.max(
        0,
        total - remaining
      );

    }


    function isOverdue(emi) {

      const remaining =
        getRemaining(emi);


      if (
        remaining <= 0 ||
        !emi.dueDate
      ) {

        return false;

      }


      return (
        emi.dueDate < today()
      );

    }


    function daysUntil(dateString) {

      if (!dateString) {
        return null;
      }


      const todayDate =
        new Date(
          today() + "T00:00:00"
        );


      const dueDate =
        new Date(
          dateString + "T00:00:00"
        );


      return Math.ceil(
        (
          dueDate -
          todayDate
        ) /
        (1000 * 60 * 60 * 24)
      );

    }


    /* =========================
       INIT
    ========================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        walletData =
          window.TamilandaWallet.getData();


        document.getElementById(
          "emiDueDate"
        ).value = today();


        document.getElementById(
          "emiPaymentDate"
        ).value = today();


        populateAccounts();

        renderSummary();

        renderEmis();

      }
    );


    /* =========================
       ACCOUNT SELECTS
    ========================== */

    function populateAccounts() {

      const formSelect =
        document.getElementById(
          "emiAccount"
        );


      const paymentSelect =
        document.getElementById(
          "emiPaymentAccount"
        );


      formSelect.innerHTML =
        `<option value="">
          Select account
        </option>`;


      paymentSelect.innerHTML =
        `<option value="">
          Select account
        </option>`;


      (walletData.accounts || [])
        .forEach(account => {

          const option1 =
            document.createElement(
              "option"
            );


          option1.value =
            account.id;


          option1.textContent =
            account.name +
            " — " +
            money(account.balance);


          formSelect.appendChild(
            option1
          );


          const option2 =
            document.createElement(
              "option"
            );


          option2.value =
            account.id;


          option2.textContent =
            account.name +
            " — " +
            money(account.balance);


          paymentSelect.appendChild(
            option2
          );

        });

    }


    /* =========================
       SUMMARY
    ========================== */

    function renderSummary() {

      const emis =
        walletData.myEmis || [];


      let monthly =
        0;

      let remaining =
        0;

      let dueSoon =
        0;


      emis.forEach(emi => {

        const emiRemaining =
          getRemaining(emi);


        remaining +=
          emiRemaining;


        monthly +=
          Number(
            emi.monthlyPayment ||
            emi.emiAmount ||
            0
          );


        if (
          emiRemaining > 0 &&
          emi.dueDate
        ) {

          const days =
            daysUntil(
              emi.dueDate
            );


          if (
            days !== null &&
            days >= 0 &&
            days <= 7
          ) {

            dueSoon++;

          }

        }

      });


      document.getElementById(
        "totalEmis"
      ).textContent =
        emis.length;


      document.getElementById(
        "monthlyEmi"
      ).textContent =
        money(monthly);


      document.getElementById(
        "totalRemaining"
      ).textContent =
        money(remaining);


      document.getElementById(
        "dueSoon"
      ).textContent =
        dueSoon;

    }


    /* =========================
       FORM
    ========================== */

    function openEmiForm() {

      editingEmiId =
        null;


      document.getElementById(
        "formTitle"
      ).textContent =
        "Add EMI";


      document.getElementById(
        "emiFormCard"
      ).style.display =
        "block";


      clearEmiForm();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function closeEmiForm() {

      document.getElementById(
        "emiFormCard"
      ).style.display =
        "none";


      editingEmiId =
        null;


      clearEmiForm();

    }


    function clearEmiForm() {

      document.getElementById(
        "editingEmiId"
      ).value = "";


      document.getElementById(
        "emiName"
      ).value = "";


      document.getElementById(
        "lenderName"
      ).value = "";


      document.getElementById(
        "loanNumber"
      ).value = "";


      document.getElementById(
        "emiTotalAmount"
      ).value = "";


      document.getElementById(
        "emiAlreadyPaid"
      ).value = "";


      document.getElementById(
        "monthlyPayment"
      ).value = "";


      document.getElementById(
        "totalMonths"
      ).value = "";


      document.getElementById(
        "emiDueDate"
      ).value = today();


      document.getElementById(
        "emiAccount"
      ).value = "";


      document.getElementById(
        "emiNotes"
      ).value = "";


      document.getElementById(
        "emiRemainingPreview"
      ).textContent =
        money(0);

    }


    function updateEmiPreview() {

      const total =
        Number(
          document.getElementById(
            "emiTotalAmount"
          ).value
        ) || 0;


      const paid =
        Number(
          document.getElementById(
            "emiAlreadyPaid"
          ).value
        ) || 0;


      const remaining =
        Math.max(
          0,
          total - paid
        );


      document.getElementById(
        "emiRemainingPreview"
      ).textContent =
        money(remaining);

    }


    /* =========================
       SAVE EMI
    ========================== */

    function saveEmi() {

      const name =
        document.getElementById(
          "emiName"
        ).value.trim();


      const lender =
        document.getElementById(
          "lenderName"
        ).value.trim();


      const loanNumber =
        document.getElementById(
          "loanNumber"
        ).value.trim();


      const total =
        Number(
          document.getElementById(
            "emiTotalAmount"
          ).value
        ) || 0;


      const alreadyPaid =
        Number(
          document.getElementById(
            "emiAlreadyPaid"
          ).value
        ) || 0;


      const monthlyPayment =
        Number(
          document.getElementById(
            "monthlyPayment"
          ).value
        ) || 0;


      const totalMonths =
        Number(
          document.getElementById(
            "totalMonths"
          ).value
        ) || 0;


      const dueDate =
        document.getElementById(
          "emiDueDate"
        ).value;


      const accountId =
        document.getElementById(
          "emiAccount"
        ).value;


      const notes =
        document.getElementById(
          "emiNotes"
        ).value.trim();


      if (!name) {

        alert(
          "Please enter EMI name."
        );

        return;

      }


      if (total <= 0) {

        alert(
          "Please enter a valid total amount."
        );

        return;

      }


      if (alreadyPaid < 0) {

        alert(
          "Already paid cannot be negative."
        );

        return;

      }


      if (alreadyPaid > total) {

        alert(
          "Already paid cannot be greater than total amount."
        );

        return;

      }


      if (monthlyPayment <= 0) {

        alert(
          "Please enter monthly EMI amount."
        );

        return;

      }


      if (totalMonths <= 0) {

        alert(
          "Please enter total EMI months."
        );

        return;

      }


      if (!dueDate) {

        alert(
          "Please select next due date."
        );

        return;

      }


      if (!walletData.myEmis) {

        walletData.myEmis = [];

      }


      /* =========================
         EDIT
      ========================== */

      if (editingEmiId) {

        const emi =
          walletData.myEmis.find(
            item =>
              item.id ===
              editingEmiId
          );


        if (!emi) {

          alert(
            "EMI record not found."
          );

          return;

        }


        const hasPayments =
          (walletData.emiPayments || [])
            .some(
              payment =>
                payment.emiId ===
                emi.id
            );


        emi.name =
          name;

        emi.emiName =
          name;

        emi.lender =
          lender;

        emi.lenderName =
          lender;

        emi.loanNumber =
          loanNumber;

        emi.dueDate =
          dueDate;

        emi.notes =
          notes;


        /*
          Financial base values are protected
          after payment history exists.
        */

        if (!hasPayments) {

          emi.totalAmount =
            total;

          emi.amount =
            total;

          emi.alreadyPaid =
            alreadyPaid;

          emi.monthlyPayment =
            monthlyPayment;

          emi.emiAmount =
            monthlyPayment;

          emi.totalMonths =
            totalMonths;

          emi.accountId =
            accountId;

        }


        saveData();

        walletData =
          window.TamilandaWallet.getData();


        closeEmiForm();

        renderSummary();
        renderEmis();

        alert(
          "EMI updated successfully. ✅"
        );

        return;

      }


      /* =========================
         NEW EMI
      ========================== */

      const emi = {

        id:
          generateId(),

        name:
          name,

        emiName:
          name,

        lender:
          lender,

        lenderName:
          lender,

        loanNumber:
          loanNumber,

        totalAmount:
          total,

        amount:
          total,

        alreadyPaid:
          alreadyPaid,

        monthlyPayment:
          monthlyPayment,

        emiAmount:
          monthlyPayment,

        totalMonths:
          totalMonths,

        dueDate:
          dueDate,

        accountId:
          accountId,

        notes:
          notes,

        createdAt:
          new Date().toISOString()

      };


      walletData.myEmis.push(
        emi
      );


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      closeEmiForm();

      renderSummary();
      renderEmis();

      alert(
        "EMI added successfully. 🎉"
      );

    }


    /* =========================
       EDIT EMI
    ========================== */

    function editEmi(id) {

      const emi =
        walletData.myEmis
          .find(
            item =>
              item.id === id
          );


      if (!emi) {
        return;
      }


      editingEmiId =
        id;


      document.getElementById(
        "formTitle"
      ).textContent =
        "Edit EMI";


      document.getElementById(
        "emiName"
      ).value =
        emi.name ||
        emi.emiName ||
        "";


      document.getElementById(
        "lenderName"
      ).value =
        emi.lender ||
        emi.lenderName ||
        "";


      document.getElementById(
        "loanNumber"
      ).value =
        emi.loanNumber ||
        "";


      document.getElementById(
        "emiTotalAmount"
      ).value =
        emi.totalAmount ||
        emi.amount ||
        "";


      document.getElementById(
        "emiAlreadyPaid"
      ).value =
        emi.alreadyPaid ||
        "";


      document.getElementById(
        "monthlyPayment"
      ).value =
        emi.monthlyPayment ||
        emi.emiAmount ||
        "";


      document.getElementById(
        "totalMonths"
      ).value =
        emi.totalMonths ||
        "";


      document.getElementById(
        "emiDueDate"
      ).value =
        emi.dueDate ||
        today();


      document.getElementById(
        "emiAccount"
      ).value =
        emi.accountId ||
        "";


      document.getElementById(
        "emiNotes"
      ).value =
        emi.notes ||
        "";


      updateEmiPreview();


      document.getElementById(
        "emiFormCard"
      ).style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       PAYMENT MODAL
    ========================== */

    function openEmiPaymentModal(id) {

      const emi =
        walletData.myEmis
          .find(
            item =>
              item.id === id
          );


      if (!emi) {
        return;
      }


      const remaining =
        getRemaining(emi);


      if (remaining <= 0) {

        alert(
          "This EMI is already completed. ✅"
        );

        return;

      }


      const monthly =
        Number(
          emi.monthlyPayment ||
          emi.emiAmount ||
          0
        );


      document.getElementById(
        "paymentEmiId"
      ).value =
        id;


      document.getElementById(
        "paymentEmiName"
      ).textContent =
        emi.name ||
        emi.emiName ||
        "EMI";


      document.getElementById(
        "paymentEmiRemaining"
      ).textContent =
        money(remaining);


      document.getElementById(
        "paymentMonthlyEmi"
      ).textContent =
        money(monthly);


      document.getElementById(
        "emiPaymentAmount"
      ).value =
        Math.min(
          monthly || remaining,
          remaining
        );


      document.getElementById(
        "emiPaymentAccount"
      ).value =
        emi.accountId ||
        "";


      document.getElementById(
        "emiPaymentDate"
      ).value =
        today();


      document.getElementById(
        "emiPaymentNote"
      ).value =
        "";


      document.getElementById(
        "emiPaymentModal"
      ).style.display =
        "flex";

    }


    function closeEmiPaymentModal() {

      document.getElementById(
        "emiPaymentModal"
      ).style.display =
        "none";

    }


    /* =========================
       SAVE EMI PAYMENT
    ========================== */

    function saveEmiPayment() {

      const emiId =
        document.getElementById(
          "paymentEmiId"
        ).value;


      const amount =
        Number(
          document.getElementById(
            "emiPaymentAmount"
          ).value
        ) || 0;


      const accountId =
        document.getElementById(
          "emiPaymentAccount"
        ).value;


      const date =
        document.getElementById(
          "emiPaymentDate"
        ).value ||
        today();


      const note =
        document.getElementById(
          "emiPaymentNote"
        ).value.trim();


      const emi =
        walletData.myEmis
          .find(
            item =>
              item.id === emiId
          );


      if (!emi) {

        alert(
          "EMI record not found."
        );

        return;

      }


      if (amount <= 0) {

        alert(
          "Please enter a valid payment amount."
        );

        return;

      }


      const remaining =
        getRemaining(emi);


      if (amount > remaining) {

        alert(
          "Maximum payment allowed is " +
          money(remaining) +
          "."
        );

        return;

      }


      if (!accountId) {

        alert(
          "Please select the account used for EMI payment."
        );

        return;

      }


      const account =
        walletData.accounts
          .find(
            item =>
              item.id === accountId
          );


      if (!account) {

        alert(
          "Selected account not found."
        );

        return;

      }


      if (
        Number(account.balance || 0) <
        amount
      ) {

        alert(
          "Insufficient balance in selected account."
        );

        return;

      }


      /*
        Reduce actual account balance.
      */

      account.balance =
        Number(
          account.balance || 0
        ) -
        amount;


      if (!walletData.emiPayments) {

        walletData.emiPayments =
          [];

      }


      walletData.emiPayments.push({

        id:
          generateId(),

        emiId:
          emiId,

        amount:
          amount,

        accountId:
          accountId,

        date:
          date,

        note:
          note,

        createdAt:
          new Date().toISOString()

      });


      /*
        EMI payment is an expense.
      */

      walletData.transactions.push({

        id:
          generateId(),

        type:
          "expense",

        category:
          "EMI",

        amount:
          amount,

        accountId:
          accountId,

        date:
          date,

        description:
          `EMI Payment - ${emi.name || emi.emiName}`,

        note:
          note,

        source:
          "emi_payment",

        emiId:
          emiId,

        createdAt:
          new Date().toISOString()

      });


      /*
        Automatically move the next due date
        forward by roughly one month.
      */

      if (
        emi.dueDate
      ) {

        const due =
          new Date(
            emi.dueDate +
            "T00:00:00"
          );


        due.setMonth(
          due.getMonth() + 1
        );


        emi.dueDate =
          due.getFullYear() +
          "-" +
          String(
            due.getMonth() + 1
          ).padStart(2, "0") +
          "-" +
          String(
            due.getDate()
          ).padStart(2, "0");

      }


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      const newRemaining =
        getRemaining(emi);


      closeEmiPaymentModal();

      populateAccounts();

      renderSummary();
      renderEmis();


      if (newRemaining <= 0) {

        alert(
          "EMI fully completed! 🎉"
        );

      } else {

        alert(
          "EMI payment recorded. Remaining: " +
          money(newRemaining)
        );

      }

    }


    /* =========================
       PAYMENT HISTORY
    ========================== */

    function getEmiPayments(id) {

      return (
        walletData.emiPayments || []
      )
        .filter(
          payment =>
            payment.emiId === id
        )
        .sort(
          (a, b) =>
            new Date(
              b.date ||
              b.createdAt
            ) -
            new Date(
              a.date ||
              a.createdAt
            )
        );

    }


    function toggleHistory(id) {

      const element =
        document.getElementById(
          "emi-history-" + id
        );


      if (!element) {
        return;
      }


      element.style.display =
        element.style.display === "none"
          ? "block"
          : "none";

    }


    /* =========================
       DELETE EMI
    ========================== */

    function deleteEmi(id) {

      const emi =
        walletData.myEmis
          .find(
            item =>
              item.id === id
          );


      if (!emi) {
        return;
      }


      const payments =
        getEmiPayments(id);


      if (payments.length > 0) {

        alert(
          "This EMI has payment history. Please keep it for accounting history. You can edit the EMI instead."
        );

        return;

      }


      const remaining =
        getRemaining(emi);


      let message =
        `Move ${emi.name || "this EMI"} to Trash?`;


      if (remaining > 0) {

        message +=
          `\n\nRemaining: ${money(remaining)}`;

      }


      if (!confirm(message)) {
        return;
      }


      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.moveToTrash ===
        "function"
      ) {

        window.TamilandaWallet.moveToTrash(
          "myEmis",
          emi
        );

      } else {

        walletData.trash =
          walletData.trash ||
          [];

        walletData.trash.push({

          id:
            generateId(),

          type:
            "myEmis",

          originalCollection:
            "myEmis",

          data:
            emi,

          deletedAt:
            new Date().toISOString()

        });

      }


      const index =
        walletData.myEmis
          .findIndex(
            item =>
              item.id === id
          );


      if (index !== -1) {

        walletData.myEmis.splice(
          index,
          1
        );

      }


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      renderSummary();
      renderEmis();

      alert(
        "EMI moved to Trash. 🗑️"
      );

    }


    /* =========================
       RENDER
    ========================== */

    function renderEmis() {

      const container =
        document.getElementById(
          "emiList"
        );


      const search =
        document.getElementById(
          "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


      const filter =
        document.getElementById(
          "statusFilter"
        ).value;


      let list =
        [
          ...(walletData.myEmis || [])
        ];


      list =
        list.filter(emi => {

          const remaining =
            getRemaining(emi);


          const completed =
            remaining <= 0;


          const overdue =
            isOverdue(emi);


          if (
            filter === "completed" &&
            !completed
          ) {
            return false;
          }


          if (
            filter === "active" &&
            (
              completed ||
              overdue
            )
          ) {
            return false;
          }


          if (
            filter === "overdue" &&
            !overdue
          ) {
            return false;
          }


          if (!search) {
            return true;
          }


          const searchable =
            [
              emi.name,
              emi.emiName,
              emi.lender,
              emi.lenderName,
              emi.loanNumber,
              emi.notes
            ]
            .join(" ")
            .toLowerCase();


          return searchable.includes(
            search
          );

        });


      list.sort(
        (a, b) => {

          const aRemaining =
            getRemaining(a);

          const bRemaining =
            getRemaining(b);


          if (
            aRemaining <= 0 &&
            bRemaining > 0
          ) {
            return 1;
          }


          if (
            aRemaining > 0 &&
            bRemaining <= 0
          ) {
            return -1;
          }


          if (
            a.dueDate &&
            b.dueDate
          ) {

            return (
              new Date(a.dueDate) -
              new Date(b.dueDate)
            );

          }


          return (
            new Date(
              b.createdAt || 0
            ) -
            new Date(
              a.createdAt || 0
            )
          );

        }
      );


      if (list.length === 0) {

        container.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              💳
            </div>

            <h3>
              No EMI Found
            </h3>

            <p>
              Add your bank, phone, bike, loan or other EMI.
            </p>

            <button
              class="primary-button"
              onclick="openEmiForm()"
            >
              + Add EMI
            </button>

          </div>

        `;

        return;

      }


      container.innerHTML =
        list
          .map(
            renderEmiCard
          )
          .join("");

    }


    /* =========================
       EMI CARD
    ========================== */

    function renderEmiCard(emi) {

      const total =
        Number(
          emi.totalAmount ||
          emi.amount ||
          0
        );


      const remaining =
        getRemaining(emi);


      const paid =
        getPaid(emi);


      const monthly =
        Number(
          emi.monthlyPayment ||
          emi.emiAmount ||
          0
        );


      const progress =
        total > 0
          ? Math.min(
              100,
              Math.round(
                (paid / total) * 100
              )
            )
          : 0;


      const completed =
        remaining <= 0;


      const overdue =
        isOverdue(emi);


      const days =
        daysUntil(
          emi.dueDate
        );


      let statusClass =
        "status-warning";


      let statusText =
        "ACTIVE";


      if (completed) {

        statusClass =
          "status-success";

        statusText =
          "COMPLETED";

      } else if (overdue) {

        statusClass =
          "status-danger";

        statusText =
          "OVERDUE";

      }


      let dueText =
        "";


      if (emi.dueDate) {

        if (overdue) {

          dueText =
            "Overdue";

        } else if (
          days === 0
        ) {

          dueText =
            "Due Today";

        } else if (
          days === 1
        ) {

          dueText =
            "Due Tomorrow";

        } else {

          dueText =
            `Due in ${days} days`;

        }

      }


      const payments =
        getEmiPayments(
          emi.id
        );


      let historyHtml =
        "";


      if (
        payments.length === 0
      ) {

        historyHtml = `

          <div class="muted-text">
            No payment history yet.
          </div>

        `;

      } else {

        historyHtml =
          payments
            .map(
              payment => `

                <div class="payment-history-item">

                  <div>

                    <strong>
                      ${money(
                        payment.amount
                      )}
                    </strong>

                    <small>
                      ${formatDate(
                        payment.date
                      )}
                    </small>

                  </div>

                  <div>

                    <small>
                      Paid from:
                      ${escapeHtml(
                        getAccountName(
                          payment.accountId
                        )
                      )}
                    </small>

                    ${
                      payment.note
                        ? `
                          <small>
                            ${escapeHtml(
                              payment.note
                            )}
                          </small>
                        `
                        : ""
                    }

                  </div>

                </div>

              `
            )
            .join("");

      }


      return `

        <article class="card emi-card">

          <!-- HEADER -->

          <div class="emi-header">

            <div>

              <div class="emi-title">

                <h3>
                  ${escapeHtml(
                    emi.name ||
                    emi.emiName ||
                    "Unnamed EMI"
                  )}
                </h3>

                <span class="${statusClass}">
                  ${statusText}
                </span>

              </div>


              ${
                emi.lender ||
                emi.lenderName
                  ? `
                    <p>
                      🏦
                      ${escapeHtml(
                        emi.lender ||
                        emi.lenderName
                      )}
                    </p>
                  `
                  : ""
              }


              ${
                emi.loanNumber
                  ? `
                    <p>
                      🔢
                      ${escapeHtml(
                        emi.loanNumber
                      )}
                    </p>
                  `
                  : ""
              }

            </div>


            <div class="emi-menu">

              <button
                class="icon-button"
                onclick="editEmi('${emi.id}')"
                title="Edit"
              >
                ✏️
              </button>

              <button
                class="icon-button"
                onclick="deleteEmi('${emi.id}')"
                title="Delete"
              >
                🗑️
              </button>

            </div>

          </div>


          <!-- PROGRESS -->

          <div class="progress-section">

            <div class="progress-label">

              <span>
                Payment Progress
              </span>

              <strong>
                ${progress}%
              </strong>

            </div>


            <div class="progress-bar">

              <div
                class="progress-fill"
                style="width:${progress}%"
              ></div>

            </div>

          </div>


          <!-- MONEY -->

          <div class="money-grid">

            <div>

              <span>
                Total
              </span>

              <strong>
                ${money(total)}
              </strong>

            </div>


            <div>

              <span>
                Paid
              </span>

              <strong>
                ${money(paid)}
              </strong>

            </div>


            <div>

              <span>
                Remaining
              </span>

              <strong>
                ${money(remaining)}
              </strong>

            </div>


            <div>

              <span>
                Monthly EMI
              </span>

              <strong>
                ${money(monthly)}
              </strong>

            </div>

          </div>


          <!-- DUE -->

          ${
            emi.dueDate
              ? `
                <div class="info-box">

                  <div>

                    <span>
                      Next Due Date
                    </span>

                    <strong>
                      ${formatDate(
                        emi.dueDate
                      )}
                    </strong>

                  </div>

                  <div>

                    <span>
                      Status
                    </span>

                    <strong>
                      ${dueText}
                    </strong>

                  </div>

                </div>
              `
              : ""
          }


          ${
            emi.totalMonths
              ? `
                <div class="small-info">
                  📆 Total Tenure:
                  ${emi.totalMonths} months
                </div>
              `
              : ""
          }


          ${
            emi.notes
              ? `
                <div class="note-box">
                  📝
                  ${escapeHtml(
                    emi.notes
                  )}
                </div>
              `
              : ""
          }


          <!-- ACTIONS -->

          <div class="emi-actions">

            ${
              !completed
                ? `
                  <button
                    class="primary-button"
                    onclick="openEmiPaymentModal('${emi.id}')"
                  >
                    💳 Pay EMI
                  </button>
                `
                : `
                  <button
                    class="secondary-button"
                    disabled
                  >
                    ✓ EMI Completed
                  </button>
                `
            }


            <button
              class="secondary-button"
              onclick="toggleHistory('${emi.id}')"
            >
              🧾 History (${payments.length})
            </button>

          </div>


          <!-- HISTORY -->

          <div
            id="emi-history-${emi.id}"
            class="payment-history"
            style="display:none;"
          >

            <h4>
              EMI Payment History
            </h4>

            ${historyHtml}

          </div>

        </article>

      `;

    }


    /* =========================
       NAVIGATION
    ========================== */

    function goBack() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        goToPage("home");

      }

    }


    function goToPage(page) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.goToPage ===
        "function"
      ) {

        window.TamilandaWallet.goToPage(
          page
        );

        return;

      }


      const pages = {

        home:
          "../index.html",

        transactions:
          "transactions.html",

        buyers:
          "buyers.html",

        accounts:
          "accounts.html",

        more:
          "more.html"

      };


      if (pages[page]) {

        window.location.href =
          pages[page];

      }

    }


    /* =========================
       OUTSIDE MODAL CLICK
    ========================== */

    document.addEventListener(
      "click",
      function(event) {

        const modal =
          document.getElementById(
            "emiPaymentModal"
          );


        if (
          event.target === modal
        ) {

          closeEmiPaymentModal();

        }

      }
    );

  </script>
