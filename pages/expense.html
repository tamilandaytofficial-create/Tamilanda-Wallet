<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expenses - Tamilanda Wallet</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">

  <meta name="theme-color" content="#09070d">
</head>

<body>

  <div class="app-container">

    <!-- HEADER -->
    <header class="page-header">
      <div>
        <h1>Expenses</h1>
        <p>Track your spending</p>
      </div>

      <button class="primary-btn" onclick="openExpenseModal()">
        + Add Expense
      </button>
    </header>


    <!-- SUMMARY -->
    <section class="summary-grid">

      <div class="summary-card">
        <span class="summary-label">Total Expenses</span>
        <strong id="totalExpense">₹0.00</strong>
      </div>

      <div class="summary-card">
        <span class="summary-label">This Month</span>
        <strong id="monthExpense">₹0.00</strong>
      </div>

      <div class="summary-card">
        <span class="summary-label">Today</span>
        <strong id="todayExpense">₹0.00</strong>
      </div>

    </section>


    <!-- FILTERS -->
    <section class="card">

      <div class="form-grid">

        <div class="form-group">
          <label>Search</label>
          <input
            type="text"
            id="searchExpense"
            placeholder="Search expense..."
            oninput="renderExpenses()"
          >
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="filterCategory" onchange="renderExpenses()">
            <option value="">All Categories</option>
          </select>
        </div>

        <div class="form-group">
          <label>Account</label>
          <select id="filterAccount" onchange="renderExpenses()">
            <option value="">All Accounts</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input
            type="date"
            id="filterDate"
            onchange="renderExpenses()"
          >
        </div>

      </div>

      <button class="secondary-btn" onclick="clearExpenseFilters()">
        Clear Filters
      </button>

    </section>


    <!-- EXPENSE LIST -->
    <section class="card">

      <div class="section-header">
        <div>
          <h2>Expense History</h2>
          <p id="expenseCount">0 expenses</p>
        </div>
      </div>

      <div id="expenseList"></div>

    </section>

  </div>


  <!-- ADD / EDIT EXPENSE MODAL -->
  <div id="expenseModal" class="modal-overlay">

    <div class="modal">

      <div class="modal-header">

        <div>
          <h2 id="expenseModalTitle">Add Expense</h2>
          <p>Enter your expense details</p>
        </div>

        <button class="close-btn" onclick="closeExpenseModal()">
          ×
        </button>

      </div>


      <form id="expenseForm" onsubmit="saveExpense(event)">

        <input type="hidden" id="expenseId">


        <div class="form-group">
          <label>Description *</label>

          <input
            type="text"
            id="expenseDescription"
            placeholder="Example: Petrol, Food, Shopping"
            required
          >
        </div>


        <div class="form-grid">

          <div class="form-group">
            <label>Amount *</label>

            <input
              type="number"
              id="expenseAmount"
              min="0.01"
              step="0.01"
              placeholder="0.00"
              required
            >
          </div>


          <div class="form-group">
            <label>Date *</label>

            <input
              type="date"
              id="expenseDate"
              required
            >
          </div>

        </div>


        <div class="form-grid">

          <div class="form-group">

            <label>Category *</label>

            <select id="expenseCategory" required>
              <option value="">Select Category</option>
            </select>

          </div>


          <div class="form-group">

            <label>Account *</label>

            <select id="expenseAccount" required>
              <option value="">Select Account</option>
            </select>

          </div>

        </div>


        <div class="form-group">

          <label>Note</label>

          <textarea
            id="expenseNote"
            rows="3"
            placeholder="Optional note..."
          ></textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="secondary-btn"
            onclick="closeExpenseModal()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="primary-btn"
          >
            Save Expense
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="../js/app.js"></script>


  <script>

    let editingExpenseId = null;


    /* ================================
       HELPERS
    ================================= */

    function getWalletData() {
      return window.TamilandaWallet?.data || {};
    }


    function getTransactions() {
      return getWalletData().transactions || [];
    }


    function getAccounts() {
      return getWalletData().accounts || [];
    }


    function getCategories() {

      const data = getWalletData();

      if (Array.isArray(data.categories)) {
        return data.categories;
      }

      return [
        "Food",
        "Travel",
        "Shopping",
        "Bills",
        "Fuel",
        "Medical",
        "Entertainment",
        "Education",
        "Other"
      ];

    }


    function todayStringLocal() {

      const d = new Date();

      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    function formatMoney(value) {

      const amount = Number(value) || 0;

      if (window.TamilandaWallet?.formatMoney) {
        return window.TamilandaWallet.formatMoney(amount);
      }

      return "₹" + amount.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    }


    function escapeHtml(value) {

      if (window.TamilandaWallet?.escapeHtml) {
        return window.TamilandaWallet.escapeHtml(value);
      }

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getAccountName(accountId) {

      const account = getAccounts().find(
        a => String(a.id) === String(accountId)
      );

      return account ? account.name : "Unknown Account";

    }


    function formatDate(dateString) {

      if (!dateString) return "-";

      const date = new Date(dateString + "T00:00:00");

      if (Number.isNaN(date.getTime())) {
        return dateString;
      }

      return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });

    }


    function isExpenseTransaction(transaction) {

      if (!transaction) return false;

      return [
        "expense",
        "recurring_payment",
        "emi_payment",
        "money_to_give_payment"
      ].includes(transaction.type);

    }


    /* ================================
       LOAD FILTERS
    ================================= */

    function loadExpenseFilters() {

      const categorySelect =
        document.getElementById("filterCategory");

      const accountSelect =
        document.getElementById("filterAccount");

      const expenseCategory =
        document.getElementById("expenseCategory");

      const expenseAccount =
        document.getElementById("expenseAccount");


      const categories = getCategories();

      categorySelect.innerHTML =
        `<option value="">All Categories</option>`;

      expenseCategory.innerHTML =
        `<option value="">Select Category</option>`;


      categories.forEach(category => {

        const name =
          typeof category === "string"
            ? category
            : category.name || category.title || "Other";

        categorySelect.innerHTML +=
          `<option value="${escapeHtml(name)}">
            ${escapeHtml(name)}
          </option>`;

        expenseCategory.innerHTML +=
          `<option value="${escapeHtml(name)}">
            ${escapeHtml(name)}
          </option>`;

      });


      accountSelect.innerHTML =
        `<option value="">All Accounts</option>`;

      expenseAccount.innerHTML =
        `<option value="">Select Account</option>`;


      getAccounts().forEach(account => {

        accountSelect.innerHTML +=
          `<option value="${escapeHtml(account.id)}">
            ${escapeHtml(account.name)}
          </option>`;

        expenseAccount.innerHTML +=
          `<option value="${escapeHtml(account.id)}">
            ${escapeHtml(account.name)}
          </option>`;

      });

    }


    /* ================================
       SUMMARY
    ================================= */

    function updateExpenseSummary() {

      const transactions = getTransactions()
        .filter(isExpenseTransaction);


      const total =
        transactions.reduce(
          (sum, item) => sum + Number(item.amount || 0),
          0
        );


      const now = new Date();

      const currentYear =
        now.getFullYear();

      const currentMonth =
        now.getMonth();


      const monthTotal =
        transactions
          .filter(item => {

            const date =
              new Date(
                String(item.date || "") + "T00:00:00"
              );

            return (
              date.getFullYear() === currentYear &&
              date.getMonth() === currentMonth
            );

          })
          .reduce(
            (sum, item) =>
              sum + Number(item.amount || 0),
            0
          );


      const today =
        todayStringLocal();


      const todayTotal =
        transactions
          .filter(
            item => String(item.date) === today
          )
          .reduce(
            (sum, item) =>
              sum + Number(item.amount || 0),
            0
          );


      document.getElementById("totalExpense")
        .textContent = formatMoney(total);

      document.getElementById("monthExpense")
        .textContent = formatMoney(monthTotal);

      document.getElementById("todayExpense")
        .textContent = formatMoney(todayTotal);

    }


    /* ================================
       RENDER EXPENSES
    ================================= */

    function renderExpenses() {

      const list =
        document.getElementById("expenseList");


      const search =
        document.getElementById("searchExpense")
          .value
          .trim()
          .toLowerCase();


      const category =
        document.getElementById("filterCategory")
          .value;


      const accountId =
        document.getElementById("filterAccount")
          .value;


      const selectedDate =
        document.getElementById("filterDate")
          .value;


      let expenses =
        getTransactions()
          .filter(isExpenseTransaction);


      expenses = expenses.filter(item => {

        const description =
          String(
            item.description ||
            item.title ||
            item.name ||
            ""
          ).toLowerCase();


        const note =
          String(
            item.note ||
            item.notes ||
            ""
          ).toLowerCase();


        const itemCategory =
          String(
            item.category ||
            ""
          );


        const itemAccount =
          String(
            item.accountId ||
            ""
          );


        const matchesSearch =
          !search ||
          description.includes(search) ||
          note.includes(search) ||
          itemCategory.toLowerCase().includes(search);


        const matchesCategory =
          !category ||
          itemCategory === category;


        const matchesAccount =
          !accountId ||
          itemAccount === accountId;


        const matchesDate =
          !selectedDate ||
          String(item.date) === selectedDate;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesAccount &&
          matchesDate
        );

      });


      expenses.sort((a, b) => {

        const dateA =
          new Date(
            String(a.date || "") + "T00:00:00"
          ).getTime() || 0;

        const dateB =
          new Date(
            String(b.date || "") + "T00:00:00"
          ).getTime() || 0;

        if (dateB !== dateA) {
          return dateB - dateA;
        }

        return Number(b.createdAt || 0) -
               Number(a.createdAt || 0);

      });


      document.getElementById("expenseCount")
        .textContent =
        `${expenses.length} expense${expenses.length === 1 ? "" : "s"}`;


      if (!expenses.length) {

        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">💸</div>
            <h3>No expenses found</h3>
            <p>Add an expense or change your filters.</p>
          </div>
        `;

        updateExpenseSummary();

        return;

      }


      list.innerHTML =
        expenses.map(renderExpenseCard).join("");


      updateExpenseSummary();

    }


    /* ================================
       EXPENSE CARD
    ================================= */

    function renderExpenseCard(item) {

      const description =
        item.description ||
        item.title ||
        item.name ||
        "Expense";


      const category =
        item.category ||
        "Other";


      const accountName =
        getAccountName(item.accountId);


      const note =
        item.note ||
        item.notes ||
        "";


      let sourceText = "";


      if (item.type === "emi_payment") {
        sourceText = "EMI Payment";
      } else if (item.type === "recurring_payment") {
        sourceText = "Recurring Payment";
      } else if (item.type === "money_to_give_payment") {
        sourceText = "Money To Give";
      } else {
        sourceText = "Expense";
      }


      return `
        <div class="transaction-card">

          <div class="transaction-main">

            <div class="transaction-icon expense-icon">
              💸
            </div>

            <div class="transaction-info">

              <h3>
                ${escapeHtml(description)}
              </h3>

              <div class="transaction-meta">

                <span>
                  ${escapeHtml(category)}
                </span>

                <span>•</span>

                <span>
                  ${escapeHtml(accountName)}
                </span>

                <span>•</span>

                <span>
                  ${escapeHtml(formatDate(item.date))}
                </span>

              </div>

              ${
                note
                  ? `<p class="transaction-note">
                       ${escapeHtml(note)}
                     </p>`
                  : ""
              }

              ${
                item.type !== "expense"
                  ? `<small class="transaction-source">
                       ${escapeHtml(sourceText)}
                     </small>`
                  : ""
              }

            </div>

          </div>


          <div class="transaction-right">

            <strong class="expense-amount">
              -${formatMoney(item.amount)}
            </strong>


            ${
              item.type === "expense"
                ? `
                  <div class="transaction-actions">

                    <button
                      class="small-btn"
                      onclick="editExpense('${item.id}')"
                    >
                      Edit
                    </button>

                    <button
                      class="small-btn danger-btn"
                      onclick="deleteExpense('${item.id}')"
                    >
                      Delete
                    </button>

                  </div>
                `
                : `
                  <div class="transaction-actions">

                    <button
                      class="small-btn"
                      onclick="openSourcePage('${item.type}')"
                    >
                      View
                    </button>

                  </div>
                `
            }

          </div>

        </div>
      `;

    }


    /* ================================
       OPEN MODAL
    ================================= */

    function openExpenseModal() {

      editingExpenseId = null;

      document.getElementById("expenseModalTitle")
        .textContent = "Add Expense";


      document.getElementById("expenseForm")
        .reset();


      document.getElementById("expenseId")
        .value = "";


      document.getElementById("expenseDate")
        .value = todayStringLocal();


      document.getElementById("expenseModal")
        .classList.add("show");

    }


    function closeExpenseModal() {

      document.getElementById("expenseModal")
        .classList.remove("show");

      editingExpenseId = null;

    }


    /* ================================
       SAVE EXPENSE
    ================================= */

    function saveExpense(event) {

      event.preventDefault();


      const description =
        document.getElementById("expenseDescription")
          .value
          .trim();


      const amount =
        Number(
          document.getElementById("expenseAmount")
            .value
        );


      const date =
        document.getElementById("expenseDate")
          .value;


      const category =
        document.getElementById("expenseCategory")
          .value;


      const accountId =
        document.getElementById("expenseAccount")
          .value;


      const note =
        document.getElementById("expenseNote")
          .value
          .trim();


      if (!description) {
        alert("Please enter expense description.");
        return;
      }


      if (!amount || amount <= 0) {
        alert("Please enter a valid amount.");
        return;
      }


      if (!date) {
        alert("Please select a date.");
        return;
      }


      if (!category) {
        alert("Please select a category.");
        return;
      }


      if (!accountId) {
        alert("Please select an account.");
        return;
      }


      const data =
        getWalletData();


      const account =
        getAccounts().find(
          a => String(a.id) === String(accountId)
        );


      if (!account) {
        alert("Selected account was not found.");
        return;
      }


      /* ============================
         EDIT EXISTING EXPENSE
      ============================ */

      if (editingExpenseId) {

        const transaction =
          getTransactions().find(
            t => String(t.id) === String(editingExpenseId)
          );


        if (!transaction) {
          alert("Expense not found.");
          return;
        }


        if (transaction.type !== "expense") {
          alert("This transaction cannot be edited here.");
          return;
        }


        const oldAmount =
          Number(transaction.amount || 0);


        const oldAccountId =
          transaction.accountId;


        const oldAccount =
          getAccounts().find(
            a => String(a.id) === String(oldAccountId)
          );


        if (!oldAccount) {
          alert("Original account was not found.");
          return;
        }


        /*
          Restore old expense first.
          Then apply new expense.
        */

        oldAccount.balance =
          Number(oldAccount.balance || 0) +
          oldAmount;


        if (
          String(oldAccountId) !==
          String(accountId)
        ) {

          if (
            Number(account.balance || 0) <
            amount
          ) {

            oldAccount.balance =
              Number(oldAccount.balance || 0) -
              oldAmount;

            alert(
              "Insufficient balance in the selected account."
            );

            return;

          }

        } else {

          if (
            Number(oldAccount.balance || 0) <
            amount
          ) {

            oldAccount.balance =
              Number(oldAccount.balance || 0) -
              oldAmount;

            alert(
              "Insufficient balance for this expense."
            );

            return;

          }

        }


        /*
          Apply new expense.
        */

        account.balance =
          Number(account.balance || 0) -
          amount;


        transaction.description =
          description;

        transaction.amount =
          amount;

        transaction.date =
          date;

        transaction.category =
          category;

        transaction.accountId =
          accountId;

        transaction.note =
          note;

        transaction.updatedAt =
          Date.now();


        if (window.TamilandaWallet?.save) {
          window.TamilandaWallet.save();
        } else {
          localStorage.setItem(
            "tamilanda_wallet_data",
            JSON.stringify(data)
          );
        }


        closeExpenseModal();

        loadExpenseFilters();
        renderExpenses();

        return;

      }


      /* ============================
         ADD NEW EXPENSE
      ============================ */

      if (
        Number(account.balance || 0) <
        amount
      ) {

        alert(
          "Insufficient balance in the selected account."
        );

        return;

      }


      /*
        Prefer centralized app.js helper.
      */

      if (
        typeof window.TamilandaWallet?.addTransaction ===
        "function"
      ) {

        try {

          const result =
            window.TamilandaWallet.addTransaction({
              type: "expense",
              description: description,
              amount: amount,
              date: date,
              category: category,
              accountId: accountId,
              note: note,
              source: "expense"
            });


          if (result === false) {
            alert("Could not save expense.");
            return;
          }


          closeExpenseModal();

          loadExpenseFilters();
          renderExpenses();

          return;

        } catch (error) {

          console.error(
            "addTransaction error:",
            error
          );

        }

      }


      /*
        Fallback if app.js helper is unavailable.
      */

      account.balance =
        Number(account.balance || 0) -
        amount;


      if (!Array.isArray(data.transactions)) {
        data.transactions = [];
      }


      data.transactions.push({

        id:
          "txn_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2, 8),

        type: "expense",

        description:
          description,

        amount:
          amount,

        date:
          date,

        category:
          category,

        accountId:
          accountId,

        note:
          note,

        source:
          "expense",

        createdAt:
          Date.now()

      });


      localStorage.setItem(
        "tamilanda_wallet_data",
        JSON.stringify(data)
      );


      closeExpenseModal();

      loadExpenseFilters();
      renderExpenses();

    }


    /* ================================
       EDIT EXPENSE
    ================================= */

    function editExpense(id) {

      const transaction =
        getTransactions().find(
          t => String(t.id) === String(id)
        );


      if (!transaction) {
        alert("Expense not found.");
        return;
      }


      if (transaction.type !== "expense") {
        alert(
          "This payment is linked to another module. Please edit it from its original page."
        );
        return;
      }


      editingExpenseId =
        transaction.id;


      document.getElementById("expenseModalTitle")
        .textContent = "Edit Expense";


      document.getElementById("expenseId")
        .value = transaction.id;


      document.getElementById("expenseDescription")
        .value =
        transaction.description ||
        transaction.title ||
        transaction.name ||
        "";


      document.getElementById("expenseAmount")
        .value =
        Number(transaction.amount || 0);


      document.getElementById("expenseDate")
        .value =
        transaction.date ||
        todayStringLocal();


      document.getElementById("expenseCategory")
        .value =
        transaction.category ||
        "";


      document.getElementById("expenseAccount")
        .value =
        transaction.accountId ||
        "";


      document.getElementById("expenseNote")
        .value =
        transaction.note ||
        transaction.notes ||
        "";


      document.getElementById("expenseModal")
        .classList.add("show");

    }


    /* ================================
       DELETE EXPENSE
    ================================= */

    function deleteExpense(id) {

      const transaction =
        getTransactions().find(
          t => String(t.id) === String(id)
        );


      if (!transaction) {
        alert("Expense not found.");
        return;
      }


      if (transaction.type !== "expense") {
        alert(
          "This payment cannot be deleted from Expenses. Please delete it from its original module."
        );
        return;
      }


      const amount =
        Number(transaction.amount || 0);


      const accountId =
        transaction.accountId;


      const account =
        getAccounts().find(
          a => String(a.id) === String(accountId)
        );


      if (!account) {
        alert(
          "The account linked to this expense was not found."
        );
        return;
      }


      const confirmed =
        confirm(
          `Delete this expense of ${formatMoney(amount)}?\n\nThe amount will be added back to the account balance.`
        );


      if (!confirmed) {
        return;
      }


      /*
        IMPORTANT:
        app.js is NOT being changed here.

        We reverse the expense balance once,
        then move the transaction to Trash.
      */

      const oldBalance =
        Number(account.balance || 0);


      try {

        /*
          Reverse expense.
        */

        account.balance =
          oldBalance + amount;


        /*
          Use existing moveToTrash helper
          if available.
        */

        if (
          typeof window.TamilandaWallet?.moveToTrash ===
          "function"
        ) {

          const moved =
            window.TamilandaWallet.moveToTrash(
              "transactions",
              transaction.id
            );


          if (moved === false) {

            account.balance =
              oldBalance;

            alert(
              "Could not move expense to Trash."
            );

            return;

          }


          /*
            moveToTrash may save internally.
            Save once more to ensure account
            balance is persisted.
          */

          if (window.TamilandaWallet?.save) {
            window.TamilandaWallet.save();
          }


          renderExpenses();

          return;

        }


        /*
          Fallback:
          manually move to trash.
        */

        const data =
          getWalletData();


        if (!Array.isArray(data.trash)) {
          data.trash = [];
        }


        if (!Array.isArray(data.transactions)) {
          data.transactions = [];
        }


        const index =
          data.transactions.findIndex(
            t =>
              String(t.id) ===
              String(transaction.id)
          );


        if (index === -1) {

          account.balance =
            oldBalance;

          alert(
            "Expense could not be found."
          );

          return;

        }


        const removed =
          data.transactions.splice(
            index,
            1
          )[0];


        data.trash.push({

          id:
            "trash_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .slice(2, 8),

          collection:
            "transactions",

          recordId:
            removed.id,

          data:
            removed,

          deletedAt:
            Date.now()

        });


        localStorage.setItem(
          "tamilanda_wallet_data",
          JSON.stringify(data)
        );


        renderExpenses();


      } catch (error) {

        console.error(
          "Delete expense error:",
          error
        );


        /*
          Roll back balance if anything fails.
        */

        account.balance =
          oldBalance;


        if (window.TamilandaWallet?.save) {
          window.TamilandaWallet.save();
        }


        alert(
          "Could not delete this expense. Nothing was changed."
        );

      }

    }


    /* ================================
       CLEAR FILTERS
    ================================= */

    function clearExpenseFilters() {

      document.getElementById("searchExpense")
        .value = "";

      document.getElementById("filterCategory")
        .value = "";

      document.getElementById("filterAccount")
        .value = "";

      document.getElementById("filterDate")
        .value = "";


      renderExpenses();

    }


    /* ================================
       OPEN SOURCE PAGE
    ================================= */

    function openSourcePage(type) {

      if (type === "emi_payment") {
        window.location.href = "emi.html";
        return;
      }


      if (type === "recurring_payment") {
        window.location.href = "recurring.html";
        return;
      }


      if (type === "money_to_give_payment") {
        window.location.href = "give-money.html";
        return;
      }


      window.location.href = "transactions.html";

    }


    /* ================================
       INITIALIZE
    ================================= */

    function initializeExpensePage() {

      loadExpenseFilters();

      renderExpenses();

    }


    document.addEventListener(
      "DOMContentLoaded",
      initializeExpensePage
    );


    /*
      Refresh page when another tab/page
      changes wallet data.
    */

    window.addEventListener(
      "storage",
      function(event) {

        if (
          event.key ===
          "tamilanda_wallet_data"
        ) {

          loadExpenseFilters();
          renderExpenses();

        }

      }
    );


    /*
      Close modal when clicking outside.
    */

    document.getElementById("expenseModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {
            closeExpenseModal();
          }

        }
      );

  </script>

</body>
</html>
