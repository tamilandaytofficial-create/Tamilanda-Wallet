<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#09070d">

  <title>Expenses - Tamilanda Wallet</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09070d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 600px;
      margin: auto;
      padding: 18px 15px 105px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title-box h1 {
      margin: 0;
      font-size: 23px;
    }

    .title-box p {
      margin: 5px 0 0;
      color: #96939d;
      font-size: 13px;
    }

    .add-btn {
      border: 0;
      border-radius: 13px;
      padding: 11px 14px;
      background: #7b4dff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .summary {
      background: linear-gradient(
        145deg,
        rgba(255, 85, 85, 0.12),
        rgba(255,255,255,0.035)
      );
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 19px;
      margin-bottom: 16px;
    }

    .summary-label {
      color: #9b98a2;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
    }

    .summary-bottom {
      display: flex;
      gap: 10px;
      margin-top: 17px;
    }

    .mini {
      flex: 1;
      padding: 11px;
      border-radius: 13px;
      background: rgba(255,255,255,0.045);
    }

    .mini span {
      display: block;
      color: #8f8c96;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .mini strong {
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 9px;
      margin-bottom: 16px;
    }

    .search {
      flex: 1;
    }

    .filter {
      width: 135px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #111017;
      color: #fff;
      outline: none;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(123,77,255,0.7);
    }

    select option {
      background: #111017;
      color: #fff;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 2px 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 16px;
    }

    .section-title span {
      color: #88858f;
      font-size: 12px;
    }

    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .expense-card {
      background: #111017;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 15px;
    }

    .expense-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .expense-info {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .expense-icon {
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: rgba(255, 82, 82, 0.10);
      border: 1px solid rgba(255, 82, 82, 0.17);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .expense-title {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    .expense-category {
      color: #898690;
      font-size: 11px;
      margin-top: 4px;
    }

    .expense-amount {
      color: #ff8d8d;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .expense-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .tag {
      padding: 6px 9px;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      color: #96939c;
      font-size: 10px;
    }

    .expense-note {
      color: #817e88;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .action-btn {
      flex: 1;
      padding: 9px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.035);
      color: #d2cfd7;
      font-size: 12px;
      cursor: pointer;
    }

    .action-btn.delete {
      color: #ff9898;
    }

    .empty {
      text-align: center;
      padding: 38px 15px;
      border-radius: 18px;
      background: #111017;
      border: 1px solid rgba(255,255,255,0.06);
      color: #8d8994;
    }

    .empty-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .empty strong {
      display: block;
      color: #d6d3da;
      margin-bottom: 6px;
    }

    .empty p {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.73);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow-y: auto;
      background: #111017;
      border-radius: 24px 24px 0 0;
      padding: 20px 17px 28px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 11px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      color: #c7c4cc;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .error {
      display: none;
      padding: 11px;
      border-radius: 12px;
      background: rgba(255,70,70,0.08);
      border: 1px solid rgba(255,70,70,0.17);
      color: #ff9c9c;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 13px;
    }

    .account-preview {
      display: none;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 11px;
      background: rgba(255,255,255,0.035);
      color: #98959e;
      font-size: 11px;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: #7b4dff;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .cancel-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: transparent;
      color: #aaa7b0;
      font-weight: 600;
      margin-top: 9px;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-around;
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      background: rgba(9,7,13,0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.07);
      z-index: 1000;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      color: #8f8b96;
      text-decoration: none;
      font-size: 11px;
      padding: 5px 0;
    }

    .nav-icon {
      display: block;
      font-size: 19px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #bca4ff;
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .summary-bottom {
        flex-direction: column;
      }

      .filter {
        width: 115px;
      }

      .expense-amount {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- TOP BAR -->
    <div class="top-bar">

      <div class="title-box">
        <h1>Expenses</h1>
        <p>Track where your money goes</p>
      </div>

      <button
        type="button"
        class="add-btn"
        id="addExpenseBtn"
      >
        + Add
      </button>

    </div>


    <!-- SUMMARY -->
    <section class="summary">

      <div class="summary-label">
        Total Expenses
      </div>

      <div
        class="summary-value"
        id="totalExpense"
      >
        ₹0.00
      </div>

      <div class="summary-bottom">

        <div class="mini">
          <span>Today</span>
          <strong id="todayExpense">
            ₹0.00
          </strong>
        </div>

        <div class="mini">
          <span>Entries</span>
          <strong id="expenseCount">
            0
          </strong>
        </div>

      </div>

    </section>


    <!-- SEARCH / FILTER -->
    <div class="toolbar">

      <div class="search">

        <input
          type="search"
          id="searchInput"
          placeholder="Search expenses..."
          autocomplete="off"
        >

      </div>

      <div class="filter">

        <select id="categoryFilter">

          <option value="all">
            All Categories
          </option>

        </select>

      </div>

    </div>


    <!-- LIST TITLE -->
    <div class="section-title">

      <h2>Expense History</h2>

      <span id="visibleCount">
        0 entries
      </span>

    </div>


    <!-- LIST -->
    <div
      class="expense-list"
      id="expenseList"
    ></div>

  </main>


  <!-- ADD / EDIT MODAL -->
  <div
    class="modal"
    id="expenseModal"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="modalTitle">
          Add Expense
        </h2>

        <button
          type="button"
          class="close-btn"
          id="closeModalBtn"
        >
          ×
        </button>

      </div>


      <div
        class="error"
        id="formError"
      ></div>


      <form id="expenseForm">

        <!-- AMOUNT -->

        <div class="field">

          <label for="expenseAmount">
            Amount
          </label>

          <input
            type="number"
            id="expenseAmount"
            min="0.01"
            step="0.01"
            inputmode="decimal"
            placeholder="Enter amount"
            required
          >

        </div>


        <!-- CATEGORY -->

        <div class="field">

          <label for="expenseCategory">
            Category
          </label>

          <select
            id="expenseCategory"
            required
          ></select>

        </div>


        <!-- ACCOUNT -->

        <div class="field">

          <label for="expenseAccount">
            Paid From
          </label>

          <select
            id="expenseAccount"
            required
          >
            <option value="">
              Select account
            </option>
          </select>

          <div
            class="account-preview"
            id="accountPreview"
          ></div>

        </div>


        <!-- DATE -->

        <div class="field">

          <label for="expenseDate">
            Date
          </label>

          <input
            type="date"
            id="expenseDate"
            required
          >

        </div>


        <!-- DESCRIPTION -->

        <div class="field">

          <label for="expenseDescription">
            Description
          </label>

          <input
            type="text"
            id="expenseDescription"
            maxlength="120"
            placeholder="Example: Petrol"
          >

        </div>


        <!-- NOTE -->

        <div class="field">

          <label for="expenseNote">
            Note
          </label>

          <textarea
            id="expenseNote"
            maxlength="300"
            placeholder="Optional note"
          ></textarea>

        </div>


        <button
          type="submit"
          class="save-btn"
          id="saveExpenseBtn"
        >
          Save Expense
        </button>


        <button
          type="button"
          class="cancel-btn"
          id="cancelModalBtn"
        >
          Cancel
        </button>

      </form>

    </div>

  </div>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a
      href="../index.html"
      class="nav-item"
    >
      <span class="nav-icon">⌂</span>
      Home
    </a>

    <a
      href="transactions.html"
      class="nav-item"
    >
      <span class="nav-icon">▤</span>
      Transactions
    </a>

    <a
      href="buyers.html"
      class="nav-item"
    >
      <span class="nav-icon">👥</span>
      Buyers
    </a>

    <a
      href="accounts.html"
      class="nav-item"
    >
      <span class="nav-icon">🏦</span>
      Accounts
    </a>

    <a
      href="more.html"
      class="nav-item"
    >
      <span class="nav-icon">☰</span>
      More
    </a>

  </nav>


  <script src="../js/app.js"></script>


  <script>
    "use strict";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const expenseList =
      document.getElementById(
        "expenseList"
      );

    const totalExpense =
      document.getElementById(
        "totalExpense"
      );

    const todayExpense =
      document.getElementById(
        "todayExpense"
      );

    const expenseCount =
      document.getElementById(
        "expenseCount"
      );

    const visibleCount =
      document.getElementById(
        "visibleCount"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const categoryFilter =
      document.getElementById(
        "categoryFilter"
      );

    const modal =
      document.getElementById(
        "expenseModal"
      );

    const modalTitle =
      document.getElementById(
        "modalTitle"
      );

    const expenseForm =
      document.getElementById(
        "expenseForm"
      );

    const expenseAmount =
      document.getElementById(
        "expenseAmount"
      );

    const expenseCategory =
      document.getElementById(
        "expenseCategory"
      );

    const expenseAccount =
      document.getElementById(
        "expenseAccount"
      );

    const expenseDate =
      document.getElementById(
        "expenseDate"
      );

    const expenseDescription =
      document.getElementById(
        "expenseDescription"
      );

    const expenseNote =
      document.getElementById(
        "expenseNote"
      );

    const accountPreview =
      document.getElementById(
        "accountPreview"
      );

    const formError =
      document.getElementById(
        "formError"
      );


    let walletData = null;

    let editingExpenseId = null;


    /* =====================================================
       DATA HELPERS
       ===================================================== */

    function getData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.getData ===
          "function"
      ) {

        return window.TamilandaWallet.getData();

      }


      try {

        return JSON.parse(
          localStorage.getItem(
            "tamilanda_wallet_data"
          )
        ) || {
          accounts: [],
          transactions: [],
          categories: {
            expense: []
          }
        };

      } catch (error) {

        return {
          accounts: [],
          transactions: [],
          categories: {
            expense: []
          }
        };

      }

    }


    function saveData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.save ===
          "function"
      ) {

        return window.TamilandaWallet.save();

      }


      localStorage.setItem(
        "tamilanda_wallet_data",
        JSON.stringify(walletData)
      );

      return true;

    }


    function money(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatMoney ===
          "function"
      ) {

        return window.TamilandaWallet.formatMoney(
          Number(value || 0)
        );

      }


      return (
        "₹" +
        Number(value || 0)
          .toLocaleString(
            "en-IN",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          )
      );

    }


    function todayString() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.todayString ===
          "function"
      ) {

        return window.TamilandaWallet.todayString();

      }


      const date = new Date();

      return (
        date.getFullYear() +
        "-" +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          date.getDate()
        ).padStart(2, "0")
      );

    }


    function displayDate(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatDisplayDate ===
          "function"
      ) {

        return window.TamilandaWallet.formatDisplayDate(
          value
        );

      }


      if (!value) {
        return "—";
      }


      const date =
        new Date(
          value + "T00:00:00"
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date.toLocaleDateString(
        "en-IN",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );

    }


    function escapeHtml(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.escapeHtml ===
          "function"
      ) {

        return window.TamilandaWallet.escapeHtml(
          value
        );

      }


      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function getAccount(accountId) {

      return (
        walletData.accounts || []
      ).find(
        account =>
          String(account.id) ===
          String(accountId)
      );

    }


    function getAccountName(account) {

      if (!account) {
        return "Unknown Account";
      }

      return (
        account.name ||
        account.accountName ||
        account.title ||
        "Unnamed Account"
      );

    }


    function getBalance(account) {

      if (!account) {
        return 0;
      }

      return Number(
        account.balance ??
        account.currentBalance ??
        0
      );

    }


    /* =====================================================
       EXPENSE TRANSACTIONS
       ===================================================== */

    function getExpenseTransactions() {

      return (
        walletData.transactions || []
      ).filter(
        transaction =>
          transaction.type ===
          "expense"
      );

    }


    /* =====================================================
       CATEGORIES
       ===================================================== */

    function loadCategories() {

      walletData = getData();


      const categories =
        Array.isArray(
          walletData.categories?.expense
        )
          ? walletData.categories.expense
          : [
              "Food",
              "Petrol",
              "Shopping",
              "Business",
              "Bills",
              "Vehicle",
              "EMI",
              "Other Expense"
            ];


      expenseCategory.innerHTML =
        "";


      categories.forEach(
        category => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            category;

          option.textContent =
            category;

          expenseCategory.appendChild(
            option
          );

        }
      );


      categoryFilter.innerHTML =
        `<option value="all">
          All Categories
        </option>`;


      categories.forEach(
        category => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            category;

          option.textContent =
            category;

          categoryFilter.appendChild(
            option
          );

        }
      );

    }


    /* =====================================================
       ACCOUNTS
       ===================================================== */

    function loadAccounts(
      selectedId = ""
    ) {

      walletData = getData();


      const accounts =
        Array.isArray(
          walletData.accounts
        )
          ? walletData.accounts
          : [];


      expenseAccount.innerHTML =
        `<option value="">
          Select account
        </option>`;


      accounts.forEach(
        account => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            account.id;

          option.textContent =
            `${getAccountName(account)} — ${money(getBalance(account))}`;


          if (
            String(account.id) ===
            String(selectedId)
          ) {

            option.selected =
              true;

          }


          expenseAccount.appendChild(
            option
          );

        }
      );


      updateAccountPreview();

    }


    function updateAccountPreview() {

      const account =
        getAccount(
          expenseAccount.value
        );


      if (!account) {

        accountPreview.style.display =
          "none";

        accountPreview.textContent =
          "";

        return;

      }


      accountPreview.style.display =
        "block";

      accountPreview.textContent =
        `Current balance: ${money(
          getBalance(account)
        )}`;

    }


    /* =====================================================
       SUMMARY
       ===================================================== */

    function renderSummary() {

      const expenses =
        getExpenseTransactions();


      const total =
        expenses.reduce(
          (sum, transaction) =>
            sum +
            Number(
              transaction.amount || 0
            ),
          0
        );


      const today =
        todayString();


      const todayTotal =
        expenses
          .filter(
            transaction =>
              transaction.date ===
              today
          )
          .reduce(
            (sum, transaction) =>
              sum +
              Number(
                transaction.amount || 0
              ),
            0
          );


      totalExpense.textContent =
        money(total);

      todayExpense.textContent =
        money(todayTotal);

      expenseCount.textContent =
        expenses.length;

    }


    /* =====================================================
       FILTER
       ===================================================== */

    function getFilteredExpenses() {

      walletData =
        getData();


      const expenses =
        getExpenseTransactions();


      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const category =
        categoryFilter.value;


      return expenses.filter(
        transaction => {

          const account =
            getAccount(
              transaction.accountId
            );


          const accountName =
            getAccountName(
              account
            ).toLowerCase();


          const title =
            String(
              transaction.description ||
              ""
            ).toLowerCase();


          const note =
            String(
              transaction.note ||
              ""
            ).toLowerCase();


          const transactionCategory =
            String(
              transaction.category ||
              ""
            );


          const matchesSearch =
            !search ||
            title.includes(search) ||
            note.includes(search) ||
            accountName.includes(search) ||
            transactionCategory
              .toLowerCase()
              .includes(search);


          const matchesCategory =
            category === "all" ||
            transactionCategory ===
              category;


          return (
            matchesSearch &&
            matchesCategory
          );

        }
      );

    }


    /* =====================================================
       RENDER
       ===================================================== */

    function renderExpenses() {

      walletData =
        getData();


      const allExpenses =
        getExpenseTransactions();


      const filtered =
        getFilteredExpenses();


      renderSummary();


      visibleCount.textContent =
        `${filtered.length} ${
          filtered.length === 1
            ? "entry"
            : "entries"
        }`;


      if (
        allExpenses.length === 0
      ) {

        expenseList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              💸
            </div>

            <strong>
              No expenses yet
            </strong>

            <p>
              Add your first expense
              to start tracking spending.
            </p>

          </div>
        `;

        return;

      }


      if (
        filtered.length === 0
      ) {

        expenseList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              🔎
            </div>

            <strong>
              No matching expenses
            </strong>

            <p>
              Try another search or category.
            </p>

          </div>
        `;

        return;

      }


      expenseList.innerHTML =
        filtered
          .map(
            transaction => {

              const account =
                getAccount(
                  transaction.accountId
                );


              const accountName =
                getAccountName(
                  account
                );


              const category =
                transaction.category ||
                "Expense";


              const title =
                transaction.description ||
                category ||
                "Expense";


              const note =
                transaction.note ||
                "";


              return `
                <div
                  class="expense-card"
                  data-id="${escapeHtml(
                    transaction.id
                  )}"
                >

                  <div class="expense-top">

                    <div class="expense-info">

                      <div class="expense-icon">
                        💸
                      </div>

                      <div>

                        <div class="expense-title">
                          ${escapeHtml(title)}
                        </div>

                        <div class="expense-category">
                          ${escapeHtml(category)}
                        </div>

                      </div>

                    </div>


                    <div class="expense-amount">
                      -${escapeHtml(
                        money(
                          transaction.amount
                        )
                      )}
                    </div>

                  </div>


                  <div class="expense-meta">

                    <span class="tag">
                      📅 ${escapeHtml(
                        displayDate(
                          transaction.date
                        )
                      )}
                    </span>

                    <span class="tag">
                      🏦 ${escapeHtml(
                        accountName
                      )}
                    </span>

                  </div>


                  ${
                    note
                      ? `
                        <div class="expense-note">
                          ${escapeHtml(note)}
                        </div>
                      `
                      : ""
                  }


                  <div class="actions">

                    <button
                      type="button"
                      class="action-btn"
                      data-action="edit"
                      data-id="${escapeHtml(
                        transaction.id
                      )}"
                    >
                      ✎ Edit
                    </button>

                    <button
                      type="button"
                      class="action-btn delete"
                      data-action="delete"
                      data-id="${escapeHtml(
                        transaction.id
                      )}"
                    >
                      🗑 Delete
                    </button>

                  </div>

                </div>
              `;

            }
          )
          .join("");

    }


    /* =====================================================
       MODAL
       ===================================================== */

    function openAddModal() {

      editingExpenseId =
        null;


      modalTitle.textContent =
        "Add Expense";


      expenseForm.reset();


      expenseDate.value =
        todayString();


      loadCategories();

      loadAccounts();


      formError.style.display =
        "none";


      modal.classList.add(
        "show"
      );


      setTimeout(
        () =>
          expenseAmount.focus(),
        100
      );

    }


    function openEditModal(
      transaction
    ) {

      if (!transaction) {
        return;
      }


      editingExpenseId =
        String(transaction.id);


      modalTitle.textContent =
        "Edit Expense";


      expenseAmount.value =
        Number(
          transaction.amount || 0
        );


      loadCategories();


      loadAccounts(
        transaction.accountId
      );


      expenseCategory.value =
        transaction.category ||
        expenseCategory.options[0]?.value ||
        "";


      expenseDate.value =
        transaction.date ||
        todayString();


      expenseDescription.value =
        transaction.description ||
        "";


      expenseNote.value =
        transaction.note ||
        "";


      formError.style.display =
        "none";


      modal.classList.add(
        "show"
      );

    }


    function closeModal() {

      modal.classList.remove(
        "show"
      );

      editingExpenseId =
        null;

    }


    function showError(message) {

      formError.textContent =
        message;

      formError.style.display =
        "block";

    }


    /* =====================================================
       SAVE EXPENSE
       ===================================================== */

    expenseForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        walletData =
          getData();


        const amount =
          Number(
            expenseAmount.value
          );


        const category =
          expenseCategory.value;


        const accountId =
          expenseAccount.value;


        const date =
          expenseDate.value;


        const description =
          expenseDescription.value
            .trim();


        const note =
          expenseNote.value
            .trim();


        if (
          !Number.isFinite(amount) ||
          amount <= 0
        ) {

          showError(
            "Please enter a valid expense amount."
          );

          return;

        }


        if (!category) {

          showError(
            "Please select an expense category."
          );

          return;

        }


        if (!accountId) {

          showError(
            "Please select the account used for this expense."
          );

          return;

        }


        if (!date) {

          showError(
            "Please select an expense date."
          );

          return;

        }


        const account =
          getAccount(
            accountId
          );


        if (!account) {

          showError(
            "Selected account was not found."
          );

          return;

        }


        /* =================================================
           EDIT
           ================================================= */

        if (editingExpenseId) {

          const transaction =
            walletData.transactions.find(
              item =>
                String(item.id) ===
                String(editingExpenseId)
            );


          if (!transaction) {

            showError(
              "Expense entry not found."
            );

            return;

          }


          const oldAmount =
            Number(
              transaction.amount || 0
            );


          const oldAccount =
            getAccount(
              transaction.accountId
            );


          /*
            Reverse old expense first.
          */

          if (oldAccount) {

            oldAccount.balance =
              getBalance(
                oldAccount
              ) +
              oldAmount;

          }


          /*
            Check the new account.
          */

          const newAccount =
            getAccount(
              accountId
            );


          if (
            !newAccount
          ) {

            showError(
              "Selected account was not found."
            );

            /*
              Restore old balance
              because we already reversed it.
            */

            if (oldAccount) {

              oldAccount.balance =
                getBalance(
                  oldAccount
                ) -
                oldAmount;

            }

            return;

          }


          const newBalance =
            getBalance(
              newAccount
            );


          if (
            amount >
            newBalance
          ) {

            /*
              Put the old transaction
              back exactly as it was.
            */

            if (oldAccount) {

              oldAccount.balance =
                getBalance(
                  oldAccount
                ) -
                oldAmount;

            }


            showError(
              `Insufficient balance. Available balance is ${money(newBalance)}.`
            );

            return;

          }


          /*
            Apply new expense.
          */

          newAccount.balance =
            newBalance -
            amount;


          transaction.amount =
            amount;

          transaction.category =
            category;

          transaction.accountId =
            accountId;

          transaction.date =
            date;

          transaction.description =
            description ||
            category;

          transaction.note =
            note;


          saveData();

          closeModal();

          renderExpenses();

          return;

        }


        /* =================================================
           ADD NEW EXPENSE
           ================================================= */

        const currentBalance =
          getBalance(
            account
          );


        if (
          amount >
          currentBalance
        ) {

          showError(
            `Insufficient balance. Available balance is ${money(currentBalance)}.`
          );

          return;

        }


        let created = false;


        if (
          window.TamilandaWallet &&
          typeof window.TamilandaWallet.addTransaction ===
            "function"
        ) {

          const result =
            window.TamilandaWallet.addTransaction({

              type:
                "expense",

              amount:
                amount,

              accountId:
                accountId,

              category:
                category,

              description:
                description ||
                category,

              note:
                note,

              date:
                date

            });


          if (!result) {

            showError(
              "Expense could not be added. Please check the account balance."
            );

            return;

          }


          created = true;

        } else {

          if (
            !Array.isArray(
              walletData.transactions
            )
          ) {

            walletData.transactions = [];

          }


          account.balance =
            currentBalance -
            amount;


          walletData.transactions.unshift({

            id:
              "expense_" +
              Date.now(),

            type:
              "expense",

            amount:
              amount,

            accountId:
              accountId,

            category:
              category,

            description:
              description ||
              category,

            note:
              note,

            date:
              date,

            createdAt:
              new Date().toISOString()

          });


          saveData();

          created = true;

        }


        if (created) {

          closeModal();

          renderExpenses();

        }

      }
    );


    /* =====================================================
       EDIT / DELETE
       ===================================================== */

    expenseList.addEventListener(
      "click",
      function(event) {

        const button =
          event.target.closest(
            "[data-action]"
          );


        if (!button) {
          return;
        }


        const action =
          button.dataset.action;


        const id =
          button.dataset.id;


        walletData =
          getData();


        const transaction =
          walletData.transactions.find(
            item =>
              String(item.id) ===
              String(id)
          );


        if (!transaction) {

          alert(
            "Expense entry not found."
          );

          return;

        }


        if (
          action ===
          "edit"
        ) {

          openEditModal(
            transaction
          );

          return;

        }


        if (
          action ===
          "delete"
        ) {

          const title =
            transaction.description ||
            transaction.category ||
            "this expense";


          const confirmed =
            confirm(
              `Move "${title}" to Trash?\n\nThis expense will be removed from the active transaction list.`
            );


          if (!confirmed) {
            return;
          }


          /*
            IMPORTANT:
            Reverse account balance before
            moving transaction to Trash.

            app.js deleteRecord currently moves
            the record but does not reverse the
            ledger effect, so we handle the
            balance reversal here.
          */

          const account =
            getAccount(
              transaction.accountId
            );


          if (account) {

            account.balance =
              getBalance(account) +
              Number(
                transaction.amount || 0
              );

          }


          let deleted =
            false;


          if (
            window.TamilandaWallet &&
            typeof window.TamilandaWallet.moveToTrash ===
              "function"
          ) {

            /*
              Save the transaction to Trash
              manually because the balance has
              already been reversed.
            */

            window.TamilandaWallet.moveToTrash(
              "transactions",
              transaction
            );


            const index =
              walletData.transactions.findIndex(
                item =>
                  String(item.id) ===
                  String(id)
              );


            if (index !== -1) {

              walletData.transactions.splice(
                index,
                1
              );

              saveData();

              deleted = true;

            }

          } else {

            const index =
              walletData.transactions.findIndex(
                item =>
                  String(item.id) ===
                  String(id)
              );


            if (index !== -1) {

              const removed =
                walletData.transactions.splice(
                  index,
                  1
                )[0];


              if (
                !Array.isArray(
                  walletData.trash
                )
              ) {

                walletData.trash = [];

              }


              walletData.trash.unshift({

                id:
                  "trash_" +
                  Date.now(),

                originalId:
                  removed.id,

                type:
                  "transactions",

                data:
                  JSON.parse(
                    JSON.stringify(
                      removed
                    )
                  ),

                deletedAt:
                  new Date().toISOString()

              });


              saveData();

              deleted = true;

            }

          }


          if (deleted) {

            renderExpenses();

          }

        }

      }
    );


    /* =====================================================
       OPEN / CLOSE EVENTS
       ===================================================== */

    document
      .getElementById(
        "addExpenseBtn"
      )
      .addEventListener(
        "click",
        openAddModal
      );


    document
      .getElementById(
        "closeModalBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById(
        "cancelModalBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    expenseAccount.addEventListener(
      "change",
      updateAccountPreview
    );


    searchInput.addEventListener(
      "input",
      renderExpenses
    );


    categoryFilter.addEventListener(
      "change",
      renderExpenses
    );


    modal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          modal
        ) {

          closeModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* =====================================================
       INITIAL LOAD
       ===================================================== */

    loadCategories();

    loadAccounts();

    expenseDate.value =
      todayString();

    renderExpenses();


    /* =====================================================
       REFRESH
       ===================================================== */

    window.addEventListener(
      "pageshow",
      function() {

        walletData =
          getData();

        loadCategories();

        loadAccounts();

        renderExpenses();

      }
    );

  </script>

</body>
