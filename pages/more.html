<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>More - Tamilanda Wallet</title>

  <link
    rel="manifest"
    href="../manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="../icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="../icons/icon-192.png"
  >

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <style>

    .more-page {
      padding-bottom: 110px;
    }

    .more-header {
      margin-bottom: 22px;
    }

    .more-header h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .more-header p {
      margin: 0;
      font-size: 12px;
      opacity: 0.5;
    }

    /* =========================
       PROFILE CARD
    ========================== */

    .profile-card {
      display: flex;
      align-items: center;
      gap: 13px;

      padding: 16px;
      margin-bottom: 24px;

      border-radius: 19px;

      border: 1px solid rgba(255,255,255,0.08);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.07),
          rgba(255,255,255,0.025)
        );

      cursor: pointer;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(255,255,255,0.09);

      font-size: 23px;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-subtitle {
      margin-top: 4px;

      font-size: 11px;

      opacity: 0.45;
    }

    .profile-arrow {
      font-size: 22px;
      opacity: 0.35;
    }

    /* =========================
       SECTION
    ========================== */

    .more-section {
      margin-bottom: 23px;
    }

    .section-title {
      margin: 0 0 9px 4px;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 1px;
      text-transform: uppercase;

      opacity: 0.42;
    }

    /* =========================
       MENU
    ========================== */

    .menu-card {
      overflow: hidden;

      border-radius: 17px;

      border: 1px solid rgba(255,255,255,0.07);

      background: rgba(255,255,255,0.035);
    }

    .menu-item {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 13px;

      padding: 14px;

      border: 0;

      border-bottom:
        1px solid
        rgba(255,255,255,0.055);

      background: transparent;

      color: inherit;

      text-align: left;

      cursor: pointer;
    }

    .menu-item:last-child {
      border-bottom: 0;
    }

    .menu-item:active {
      background:
        rgba(255,255,255,0.06);
    }

    .menu-icon {
      width: 40px;
      height: 40px;
      min-width: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        rgba(255,255,255,0.055);

      font-size: 18px;
    }

    .menu-content {
      flex: 1;
      min-width: 0;
    }

    .menu-title {
      font-size: 13px;
      font-weight: 700;
    }

    .menu-description {
      margin-top: 3px;

      font-size: 10px;

      line-height: 1.4;

      opacity: 0.42;
    }

    .menu-arrow {
      font-size: 19px;
      opacity: 0.25;
    }

    /* =========================
       RIGHT SIDE
    ========================== */

    .menu-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .badge {
      min-width: 20px;

      padding: 4px 8px;

      border-radius: 20px;

      background:
        rgba(255,255,255,0.08);

      font-size: 9px;
      font-weight: 800;

      text-align: center;

      opacity: 0.65;
    }

    /* =========================
       FOOTER
    ========================== */

    .app-footer {
      margin-top: 30px;

      text-align: center;

      font-size: 10px;

      line-height: 1.7;

      opacity: 0.3;
    }

  </style>

</head>


<body>

  <!-- =========================
       APP JS
  ========================== -->

  <script src="../js/app.js"></script>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        /* =========================
           GET WALLET DATA
        ========================== */

        let walletData = null;


        if (
          window.TamilandaWallet &&
          typeof
            window.TamilandaWallet.getData ===
            "function"
        ) {

          walletData =
            window.TamilandaWallet.getData();

        }


        if (!walletData) {

          try {

            walletData =
              JSON.parse(
                localStorage.getItem(
                  "tamilanda_wallet_data"
                )
              ) || {};

          } catch (error) {

            walletData = {};

          }

        }


        /* =========================
           PROFILE NAME
        ========================== */

        const profileName =
          document.getElementById(
            "profileName"
          );


        const savedName =
          walletData.profile &&
          walletData.profile.name
            ? walletData.profile.name
            : "";


        profileName.textContent =
          savedName ||
          "My Wallet";


        /* =========================
           TRASH BADGE
        ========================== */

        const trashBadge =
          document.getElementById(
            "trashBadge"
          );


        const trashCount =
          Array.isArray(
            walletData.trash
          )
            ? walletData.trash.length
            : 0;


        trashBadge.textContent =
          trashCount;


        /* =========================
           NOTIFICATION BADGE
        ========================== */

        const notificationBadge =
          document.getElementById(
            "notificationBadge"
          );


        notificationBadge.textContent =
          "VIEW";


        /* =========================
           PROFILE
        ========================== */

        document
          .getElementById(
            "profileCard"
          )
          .addEventListener(
            "click",
            function () {

              window.location.href =
                "./profile.html";

            }
          );


        /* =========================
           MENU NAVIGATION
        ========================== */

        document
          .querySelectorAll(
            ".menu-item[data-page]"
          )
          .forEach(
            function (button) {

              button.addEventListener(
                "click",
                function () {

                  const page =
                    button.dataset.page;


                  const pageMap = {

                    income:
                      "./income.html",

                    expense:
                      "./expense.html",

                    accounts:
                      "./accounts.html",

                    transactions:
                      "./transactions.html",

                    buyers:
                      "./buyers.html",

                    "give-money":
                      "./give-money.html",

                    emi:
                      "./emi.html",

                    recurring:
                      "./recurring.html",

                    reports:
                      "./reports.html",

                    calculator:
                      "./calculator.html",

                    notifications:
                      "./notifications.html",

                    trash:
                      "./trash.html",

                    settings:
                      "./settings.html",

                    security:
                      "./security.html",

                    privacy:
                      "./privacy.html",

                    about:
                      "./about.html"

                  };


                  if (
                    pageMap[page]
                  ) {

                    window.location.href =
                      pageMap[page];

                  }

                }
              );

            }
          );


        /* =========================
           BOTTOM NAV
        ========================== */

        document
          .querySelectorAll(
            ".bottom-nav .nav-item"
          )
          .forEach(
            function (item) {

              item.addEventListener(
                "click",
                function () {

                  const page =
                    item.dataset.page;


                  const navMap = {

                    home:
                      "../index.html",

                    transactions:
                      "./transactions.html",

                    buyers:
                      "./buyers.html",

                    accounts:
                      "./accounts.html",

                    more:
                      "./more.html"

                  };


                  if (
                    navMap[page]
                  ) {

                    window.location.href =
                      navMap[page];

                  }

                }
              );

            }
          );


        /* =========================
           UPDATE BADGES
        ========================== */

        window.addEventListener(
          "walletDataUpdated",
          function () {

            const updatedData =
              window.TamilandaWallet &&
              typeof
                window.TamilandaWallet.getData ===
                "function"
                ? window.TamilandaWallet.getData()
                : walletData;


            const updatedTrash =
              Array.isArray(
                updatedData.trash
              )
                ? updatedData.trash.length
                : 0;


            trashBadge.textContent =
              updatedTrash;


            const updatedName =
              updatedData.profile &&
              updatedData.profile.name
                ? updatedData.profile.name
                : "My Wallet";


            profileName.textContent =
              updatedName;

          }
        );

      }
    );

  </script>
