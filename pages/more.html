  <style>
    .page-header {
      padding: 22px 16px 14px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .page-header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: .55;
    }

    .section {
      padding: 0 16px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      opacity: .45;
      margin: 0 0 8px 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .menu-card {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      overflow: hidden;
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.055);
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .menu-item:last-child {
      border-bottom: 0;
    }

    .menu-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.07);
      font-size: 17px;
    }

    .menu-content {
      flex: 1;
      min-width: 0;
    }

    .menu-title {
      font-size: 13px;
      font-weight: 700;
    }

    .menu-description {
      margin-top: 3px;
      font-size: 10px;
      opacity: .48;
    }

    .menu-arrow {
      font-size: 16px;
      opacity: .35;
    }

    .profile-card {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
    }

    .profile-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 700;
    }

    .profile-sub {
      margin-top: 4px;
      font-size: 10px;
      opacity: .5;
    }

    .profile-button {
      border: 0;
      background: rgba(255,255,255,.08);
      color: inherit;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 10px;
      cursor: pointer;
    }

    .app-version {
      text-align: center;
      padding: 8px 0 90px;
      font-size: 10px;
      opacity: .35;

  <script src="../js/app.js"></script>

  <script>

    function loadProfile() {

      try {

        const data =
          window.TamilandaWallet &&
          typeof window.TamilandaWallet.getData === "function"
            ? window.TamilandaWallet.getData()
            : JSON.parse(
                localStorage.getItem(
                  "tamilanda_wallet_data"
                )
              ) || {};

        const profile =
          data.profile || {};

        const name =
          String(
            profile.name || ""
          ).trim();

        const phone =
          String(
            profile.phone || ""
          ).trim();

        document.getElementById(
          "profileName"
        ).textContent =
          name || "My Profile";

        document.getElementById(
          "profileSub"
        ).textContent =
          phone ||
          (
            name
              ? "Tamilanda Wallet profile"
              : "Manage your wallet profile"
          );

      } catch (error) {

        console.error(
          "Profile load failed:",
          error
        );

      }

    }


    loadProfile();

  </script>
