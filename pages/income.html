<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#09070d">

  <title>Income - Tamilanda Wallet</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09070d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 600px;
      margin: auto;
      padding: 18px 15px 105px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title-box h1 {
      margin: 0;
      font-size: 23px;
    }

    .title-box p {
      margin: 5px 0 0;
      color: #96939d;
      font-size: 13px;
    }

    .add-btn {
      border: 0;
      border-radius: 13px;
      padding: 11px 14px;
      background: #7b4dff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .summary {
      background: linear-gradient(
        145deg,
        rgba(52, 211, 116, 0.13),
        rgba(255,255,255,0.035)
      );
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 19px;
      margin-bottom: 16px;
    }

    .summary-label {
      color: #9b98a2;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
    }

    .summary-bottom {
      display: flex;
      gap: 10px;
      margin-top: 17px;
    }

    .mini {
      flex: 1;
      padding: 11px;
      border-radius: 13px;
      background: rgba(255,255,255,0.045);
    }

    .mini span {
      display: block;
      color: #8f8c96;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .mini strong {
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 9px;
      margin-bottom: 16px;
    }

    .search {
      flex: 1;
    }

    .filter {
      width: 135px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #111017;
      color: #fff;
      outline: none;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(123,77,255,0.7);
    }

    select option {
      background: #111017;
      color: #fff;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 2px 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 16px;
    }

    .section-title span {
      color: #88858f;
      font-size: 12px;
    }

    .income-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .income-card {
      background: #111017;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 15px;
    }

    .income-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .income-info {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .income-icon {
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: rgba(52,211,116,0.1);
      border: 1px solid rgba(52,211,116,0.17);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .income-title {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    .income-category {
      color: #898690;
      font-size: 11px;
      margin-top: 4px;
    }

    .income-amount {
      color: #7ce6a4;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .income-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .tag {
      padding: 6px 9px;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      color: #96939c;
      font-size: 10px;
    }

    .income-note {
      color: #817e88;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .action-btn {
      flex: 1;
      padding: 9px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.035);
      color: #d2cfd7;
      font-size: 12px;
      cursor: pointer;
    }

    .action-btn.delete {
      color: #ff9898;
    }

    .empty {
      text-align: center;
      padding: 38px 15px;
      border-radius: 18px;
      background: #111017;
      border: 1px solid rgba(255,255,255,0.06);
      color: #8d8994;
    }

    .empty-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .empty strong {
      display: block;
      color: #d6d3da;
      margin-bottom: 6px;
    }

    .empty p {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.73);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow-y: auto;
      background: #111017;
      border-radius: 24px 24px 0 0;
      padding: 20px 17px 28px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 11px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      color: #c7c4cc;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    .error {
      display: none;
      padding: 11px;
      border-radius: 12px;
      background: rgba(255,70,70,0.08);
      border: 1px solid rgba(255,70,70,0.17);
      color: #ff9c9c;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 13px;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: #7b4dff;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .cancel-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: transparent;
      color: #aaa7b0;
      font-weight: 600;
      margin-top: 9px;
      cursor: pointer;
    }

    .account-preview {
      display: none;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 11px;
      background: rgba(255,255,255,0.035);
      color: #98959e;
      font-size: 11px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-around;
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      background: rgba(9,7,13,0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.07);
      z-index: 1000;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      color: #8f8b96;
      text-decoration: none;
      font-size: 11px;
      padding: 5px 0;
    }

    .nav-icon {
      display: block;
      font-size: 19px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #bca4ff;
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .summary-bottom {
        flex-direction: column;
      }

      .filter {
        width: 115px;
      }

      .income-amount {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- TOP BAR -->
    <div class="top-bar">

      <div class="title-box">
        <h1>Income</h1>
        <p>Track all money you receive</p>
      </div>

      <button
        type="button"
        class="add-btn"
        id="addIncomeBtn"
      >
        + Add
      </button>

    </div>


    <!-- SUMMARY -->
    <section class="summary">

      <div class="summary-label">
        Total Income
      </div>

      <div
        class="summary-value"
        id="totalIncome"
      >
        ₹0.00
      </div>

      <div class="summary-bottom">

        <div class="mini">
          <span>Today</span>
          <strong id="todayIncome">
            ₹0.00
          </strong>
        </div>

        <div class="mini">
          <span>Entries</span>
          <strong id="incomeCount">
            0
          </strong>
        </div>

      </div>

    </section>


    <!-- SEARCH / FILTER -->
    <div class="toolbar">

      <div class="search">

        <input
          type="search"
          id="searchInput"
          placeholder="Search income..."
          autocomplete="off"
        >

      </div>

      <div class="filter">

        <select id="categoryFilter">

          <option value="all">
            All Categories
          </option>

        </select>

      </div>

    </div>


    <!-- LIST TITLE -->
    <div class="section-title">

      <h2>Income History</h2>

      <span id="visibleCount">
        0 entries
      </span>

    </div>


    <!-- LIST -->
    <div
      class="income-list"
      id="incomeList"
    ></div>

  </main>


  <!-- MODAL -->
  <div
    class="modal"
    id="incomeModal"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="modalTitle">
          Add Income
        </h2>

        <button
          type="button"
          class="close-btn"
          id="closeModalBtn"
        >
          ×
        </button>

      </div>


      <div
        class="error"
        id="formError"
      ></div>


      <form id="incomeForm">

        <!-- AMOUNT -->

        <div class="field">

          <label for="incomeAmount">
            Amount
          </label>

          <input
            type="number"
            id="incomeAmount"
            min="0.01"
            step="0.01"
            inputmode="decimal"
            placeholder="Enter amount"
            required
          >

        </div>


        <!-- CATEGORY -->

        <div class="field">

          <label for="incomeCategory">
            Category
          </label>

          <select
            id="incomeCategory"
            required
          ></select>

        </div>


        <!-- ACCOUNT -->

        <div class="field">

          <label for="incomeAccount">
            Received Into
          </label>

          <select
            id="incomeAccount"
            required
          >
            <option value="">
              Select account
            </option>
          </select>

          <div
            class="account-preview"
            id="accountPreview"
          ></div>

        </div>


        <!-- DATE -->

        <div class="field">

          <label for="incomeDate">
            Date
          </label>

          <input
            type="date"
            id="incomeDate"
            required
          >

        </div>


        <!-- DESCRIPTION -->

        <div class="field">

          <label for="incomeDescription">
            Description
          </label>

          <input
            type="text"
            id="incomeDescription"
            maxlength="120"
            placeholder="Example: FF Account Sale"
          >

        </div>


        <!-- NOTE -->

        <div class="field">

          <label for="incomeNote">
            Note
          </label>

          <textarea
            id="incomeNote"
            maxlength="300"
            placeholder="Optional note"
          ></textarea>

        </div>


        <button
          type="submit"
          class="save-btn"
          id="saveIncomeBtn"
        >
          Save Income
        </button>


        <button
          type="button"
          class="cancel-btn"
          id="cancelModalBtn"
        >
          Cancel
        </button>

      </form>

    </div>

  </div>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a
      href="../index.html"
      class="nav-item"
    >
      <span class="nav-icon">⌂</span>
      Home
    </a>

    <a
      href="transactions.html"
      class="nav-item"
    >
      <span class="nav-icon">▤</span>
      Transactions
    </a>

    <a
      href="buyers.html"
      class="nav-item"
    >
      <span class="nav-icon">👥</span>
      Buyers
    </a>

    <a
      href="accounts.html"
      class="nav-item"
    >
      <span class="nav-icon">🏦</span>
      Accounts
    </a>

    <a
      href="more.html"
      class="nav-item"
    >
      <span class="nav-icon">☰</span>
      More
    </a>

  </nav>


  <script src="../js/app.js"></script>


  <script>
    "use strict";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const incomeList =
      document.getElementById(
        "incomeList"
      );

    const totalIncome =
      document.getElementById(
        "totalIncome"
      );

    const todayIncome =
      document.getElementById(
        "todayIncome"
      );

    const incomeCount =
      document.getElementById(
        "incomeCount"
      );

    const visibleCount =
      document.getElementById(
        "visibleCount"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const categoryFilter =
      document.getElementById(
        "categoryFilter"
      );

    const modal =
      document.getElementById(
        "incomeModal"
      );

    const modalTitle =
      document.getElementById(
        "modalTitle"
      );

    const incomeForm =
      document.getElementById(
        "incomeForm"
      );

    const incomeAmount =
      document.getElementById(
        "incomeAmount"
      );

    const incomeCategory =
      document.getElementById(
        "incomeCategory"
      );

    const incomeAccount =
      document.getElementById(
        "incomeAccount"
      );

    const incomeDate =
      document.getElementById(
        "incomeDate"
      );

    const incomeDescription =
      document.getElementById(
        "incomeDescription"
      );

    const incomeNote =
      document.getElementById(
        "incomeNote"
      );

    const accountPreview =
      document.getElementById(
        "accountPreview"
      );

    const formError =
      document.getElementById(
        "formError"
      );


    let walletData = null;

    let editingIncomeId = null;


    /* =====================================================
       DATA
       ===================================================== */

    function getData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.getData ===
          "function"
      ) {

        return window.TamilandaWallet.getData();

      }


      try {

        return JSON.parse(
          localStorage.getItem(
            "tamilanda_wallet_data"
          )
        ) || {
          accounts: [],
          transactions: [],
          categories: {
            income: []
          }
        };

      } catch (error) {

        return {
          accounts: [],
          transactions: [],
          categories: {
            income: []
          }
        };

      }

    }


    function saveData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.save ===
          "function"
      ) {

        return window.TamilandaWallet.save();

      }


      localStorage.setItem(
        "tamilanda_wallet_data",
        JSON.stringify(walletData)
      );

      return true;

    }


    function money(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatMoney ===
          "function"
      ) {

        return window.TamilandaWallet.formatMoney(
          Number(value || 0)
        );

      }


      return (
        "₹" +
        Number(value || 0)
          .toLocaleString(
            "en-IN",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          )
      );

    }


    function todayString() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.todayString ===
          "function"
      ) {

        return window.TamilandaWallet.todayString();

      }


      const date = new Date();

      return (
        date.getFullYear() +
        "-" +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          date.getDate()
        ).padStart(2, "0")
      );

    }


    function displayDate(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatDisplayDate ===
          "function"
      ) {

        return window.TamilandaWallet.formatDisplayDate(
          value
        );

      }


      if (!value) {
        return "—";
      }


      const date =
        new Date(
          value + "T00:00:00"
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date.toLocaleDateString(
        "en-IN",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );

    }


    function escapeHtml(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.escapeHtml ===
          "function"
      ) {

        return window.TamilandaWallet.escapeHtml(
          value
        );

      }


      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function getAccount(accountId) {

      return (
        walletData.accounts || []
      ).find(
        account =>
          String(account.id) ===
          String(accountId)
      );

    }


    function getAccountName(account) {

      if (!account) {
        return "Unknown Account";
      }

      return (
        account.name ||
        account.accountName ||
        account.title ||
        "Unnamed Account"
      );

    }


    function getBalance(account) {

      if (!account) {
        return 0;
      }

      return Number(
        account.balance ??
        account.currentBalance ??
        0
      );

    }


    /* =====================================================
       INCOME TRANSACTIONS
       ===================================================== */

    function getIncomeTransactions() {

      return (
        walletData.transactions || []
      ).filter(
        transaction =>
          transaction.type === "income" ||
          transaction.type === "buyer_payment"
      );

    }


    /* =====================================================
       CATEGORIES
       ===================================================== */

    function loadCategories() {

      walletData = getData();


      const categories =
        Array.isArray(
          walletData.categories?.income
        )
          ? walletData.categories.income
          : [
              "FF Account Sale",
              "Business",
              "Salary",
              "Other Income"
            ];


      incomeCategory.innerHTML = "";


      categories.forEach(
        category => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            category;

          option.textContent =
            category;

          incomeCategory.appendChild(
            option
          );

        }
      );


      categoryFilter.innerHTML =
        `<option value="all">
          All Categories
        </option>`;


      categories.forEach(
        category => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            category;

          option.textContent =
            category;

          categoryFilter.appendChild(
            option
          );

        }
      );

    }


    /* =====================================================
       ACCOUNTS
       ===================================================== */

    function loadAccounts(
      selectedId = ""
    ) {

      walletData = getData();


      const accounts =
        Array.isArray(
          walletData.accounts
        )
          ? walletData.accounts
          : [];


      incomeAccount.innerHTML =
        `<option value="">
          Select account
        </option>`;


      accounts.forEach(
        account => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            account.id;

          option.textContent =
            `${getAccountName(account)} — ${money(getBalance(account))}`;

          if (
            String(account.id) ===
            String(selectedId)
          ) {

            option.selected = true;

          }

          incomeAccount.appendChild(
            option
          );

        }
      );


      updateAccountPreview();

    }


    function updateAccountPreview() {

      const account =
        getAccount(
          incomeAccount.value
        );


      if (!account) {

        accountPreview.style.display =
          "none";

        accountPreview.textContent =
          "";

        return;

      }


      accountPreview.style.display =
        "block";

      accountPreview.textContent =
        `Current balance: ${money(
          getBalance(account)
        )}`;

    }


    /* =====================================================
       SUMMARY
       ===================================================== */

    function renderSummary(
      transactions
    ) {

      const allIncome =
        getIncomeTransactions();


      const total =
        allIncome.reduce(
          (sum, transaction) =>
            sum +
            Number(
              transaction.amount || 0
            ),
          0
        );


      const today =
        todayString();


      const todayTotal =
        allIncome
          .filter(
            transaction =>
              transaction.date === today
          )
          .reduce(
            (sum, transaction) =>
              sum +
              Number(
                transaction.amount || 0
              ),
            0
          );


      totalIncome.textContent =
        money(total);

      todayIncome.textContent =
        money(todayTotal);

      incomeCount.textContent =
        allIncome.length;

    }


    /* =====================================================
       FILTER
       ===================================================== */

    function getFilteredIncome() {

      walletData = getData();


      const income =
        getIncomeTransactions();


      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const category =
        categoryFilter.value;


      return income.filter(
        transaction => {

          const account =
            getAccount(
              transaction.accountId
            );


          const accountName =
            getAccountName(
              account
            ).toLowerCase();


          const title =
            String(
              transaction.description ||
              ""
            ).toLowerCase();


          const note =
            String(
              transaction.note ||
              ""
            ).toLowerCase();


          const transactionCategory =
            String(
              transaction.category ||
              ""
            );


          const matchesSearch =
            !search ||
            title.includes(search) ||
            note.includes(search) ||
            accountName.includes(search) ||
            transactionCategory
              .toLowerCase()
              .includes(search);


          const matchesCategory =
            category === "all" ||
            transactionCategory ===
              category;


          return (
            matchesSearch &&
            matchesCategory
          );

        }
      );

    }


    /* =====================================================
       RENDER LIST
       ===================================================== */

    function renderIncome() {

      walletData = getData();


      const allIncome =
        getIncomeTransactions();


      const filtered =
        getFilteredIncome();


      renderSummary(
        allIncome
      );


      visibleCount.textContent =
        `${filtered.length} ${
          filtered.length === 1
            ? "entry"
            : "entries"
        }`;


      if (
        allIncome.length === 0
      ) {

        incomeList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              💰
            </div>

            <strong>
              No income yet
            </strong>

            <p>
              Add your first income entry
              to start tracking money received.
            </p>

          </div>
        `;

        return;

      }


      if (
        filtered.length === 0
      ) {

        incomeList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              🔎
            </div>

            <strong>
              No matching income
            </strong>

            <p>
              Try another search or category.
            </p>

          </div>
        `;

        return;

      }


      incomeList.innerHTML =
        filtered
          .map(
            transaction => {

              const account =
                getAccount(
                  transaction.accountId
                );


              const accountName =
                getAccountName(
                  account
                );


              const category =
                transaction.category ||
                "Income";


              const title =
                transaction.description ||
                category ||
                "Income";


              const note =
                transaction.note ||
                "";


              const isBuyerPayment =
                transaction.type ===
                "buyer_payment";


              return `
                <div
                  class="income-card"
                  data-id="${escapeHtml(
                    transaction.id
                  )}"
                >

                  <div class="income-top">

                    <div class="income-info">

                      <div class="income-icon">
                        ${isBuyerPayment ? "👤" : "💰"}
                      </div>

                      <div>

                        <div class="income-title">
                          ${escapeHtml(title)}
                        </div>

                        <div class="income-category">
                          ${escapeHtml(category)}
                        </div>

                      </div>

                    </div>


                    <div class="income-amount">
                      +${escapeHtml(
                        money(
                          transaction.amount
                        )
                      )}
                    </div>

                  </div>


                  <div class="income-meta">

                    <span class="tag">
                      📅 ${escapeHtml(
                        displayDate(
                          transaction.date
                        )
                      )}
                    </span>

                    <span class="tag">
                      🏦 ${escapeHtml(
                        accountName
                      )}
                    </span>

                    ${
                      isBuyerPayment
                        ? `
                          <span class="tag">
                            FF Buyer Payment
                          </span>
                        `
                        : ""
                    }

                  </div>


                  ${
                    note
                      ? `
                        <div class="income-note">
                          ${escapeHtml(note)}
                        </div>
                      `
                      : ""
                  }


                  <div class="actions">

                    <button
                      type="button"
                      class="action-btn"
                      data-action="edit"
                      data-id="${escapeHtml(
                        transaction.id
                      )}"
                    >
                      ✎ Edit
                    </button>

                    <button
                      type="button"
                      class="action-btn delete"
                      data-action="delete"
                      data-id="${escapeHtml(
                        transaction.id
                      )}"
                    >
                      🗑 Delete
                    </button>

                  </div>

                </div>
              `;

            }
          )
          .join("");

    }


    /* =====================================================
       MODAL
       ===================================================== */

    function openAddModal() {

      editingIncomeId =
        null;

      modalTitle.textContent =
        "Add Income";

      incomeForm.reset();

      incomeDate.value =
        todayString();

      loadCategories();

      loadAccounts();

      formError.style.display =
        "none";

      modal.classList.add(
        "show"
      );

      setTimeout(
        () =>
          incomeAmount.focus(),
        100
      );

    }


    function openEditModal(
      transaction
    ) {

      if (!transaction) {
        return;
      }


      editingIncomeId =
        String(transaction.id);


      modalTitle.textContent =
        "Edit Income";


      incomeAmount.value =
        Number(
          transaction.amount || 0
        );


      loadCategories();

      loadAccounts(
        transaction.accountId
      );


      incomeCategory.value =
        transaction.category ||
        incomeCategory.options[0]?.value ||
        "";


      incomeDate.value =
        transaction.date ||
        todayString();


      incomeDescription.value =
        transaction.description ||
        "";


      incomeNote.value =
        transaction.note ||
        "";


      formError.style.display =
        "none";


      modal.classList.add(
        "show"
      );

    }


    function closeModal() {

      modal.classList.remove(
        "show"
      );

      editingIncomeId =
        null;

    }


    function showError(message) {

      formError.textContent =
        message;

      formError.style.display =
        "block";

    }


    /* =====================================================
       SAVE INCOME
       ===================================================== */

    incomeForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        walletData =
          getData();


        const amount =
          Number(
            incomeAmount.value
          );


        const category =
          incomeCategory.value;


        const accountId =
          incomeAccount.value;


        const date =
          incomeDate.value;


        const description =
          incomeDescription.value
            .trim();


        const note =
          incomeNote.value
            .trim();


        if (
          !Number.isFinite(amount) ||
          amount <= 0
        ) {

          showError(
            "Please enter a valid income amount."
          );

          return;

        }


        if (!category) {

          showError(
            "Please select an income category."
          );

          return;

        }


        if (!accountId) {

          showError(
            "Please select the account where the money was received."
          );

          return;

        }


        if (!date) {

          showError(
            "Please select an income date."
          );

          return;

        }


        const account =
          getAccount(
            accountId
          );


        if (!account) {

          showError(
            "Selected account was not found."
          );

          return;

        }


        /* =================================================
           EDIT
           ================================================= */

        if (editingIncomeId) {

          const transaction =
            walletData.transactions.find(
              item =>
                String(item.id) ===
                String(editingIncomeId)
            );


          if (!transaction) {

            showError(
              "Income entry not found."
            );

            return;

          }


          /*
            Editing amount/account changes
            the existing account balance.

            First reverse old income.
          */

          const oldAmount =
            Number(
              transaction.amount || 0
            );


          const oldAccount =
            getAccount(
              transaction.accountId
            );


          if (
            oldAccount
          ) {

            const oldBalance =
              getBalance(
                oldAccount
              );


            if (
              oldBalance <
              oldAmount
            ) {

              showError(
                "Account balance is inconsistent. Cannot safely edit this income."
              );

              return;

            }


            oldAccount.balance =
              oldBalance -
              oldAmount;

          }


          /*
            Add the new income.
          */

          const newAccount =
            getAccount(
              accountId
            );


          newAccount.balance =
            getBalance(
              newAccount
            ) +
            amount;


          transaction.amount =
            amount;

          transaction.category =
            category;

          transaction.accountId =
            accountId;

          transaction.date =
            date;

          transaction.description =
            description ||
            category;

          transaction.note =
            note;


          saveData();

          closeModal();

          renderIncome();

          return;

        }


        /* =================================================
           ADD NEW INCOME
           ================================================= */

        let created = false;


        if (
          window.TamilandaWallet &&
          typeof window.TamilandaWallet.addTransaction ===
            "function"
        ) {

          const result =
            window.TamilandaWallet.addTransaction({

              type:
                "income",

              amount:
                amount,

              accountId:
                accountId,

              category:
                category,

              description:
                description ||
                category,

              note:
                note,

              date:
                date

            });


          if (!result) {

            showError(
              "Income could not be added. Please check the account balance/data."
            );

            return;

          }


          created = true;

        } else {

          if (
            !Array.isArray(
              walletData.transactions
            )
          ) {

            walletData.transactions = [];

          }


          account.balance =
            getBalance(account) +
            amount;


          walletData.transactions.unshift({

            id:
              "income_" +
              Date.now(),

            type:
              "income",

            amount:
              amount,

            accountId:
              accountId,

            category:
              category,

            description:
              description ||
              category,

            note:
              note,

            date:
              date,

            createdAt:
              new Date().toISOString()

          });


          saveData();

          created = true;

        }


        if (created) {

          closeModal();

          renderIncome();

        }

      }
    );


    /* =====================================================
       EDIT / DELETE
       ===================================================== */

    incomeList.addEventListener(
      "click",
      function(event) {

        const button =
          event.target.closest(
            "[data-action]"
          );


        if (!button) {
          return;
        }


        const action =
          button.dataset.action;


        const id =
          button.dataset.id;


        walletData =
          getData();


        const transaction =
          walletData.transactions.find(
            item =>
              String(item.id) ===
              String(id)
          );


        if (!transaction) {

          alert(
            "Income entry not found."
          );

          return;

        }


        if (
          action ===
          "edit"
        ) {

          /*
            Buyer payment is managed from
            the Buyers section.
          */

          if (
            transaction.type ===
            "buyer_payment"
          ) {

            alert(
              "FF Buyer payment should be edited from the Buyers section."
            );

            return;

          }


          openEditModal(
            transaction
          );

          return;

        }


        if (
          action ===
          "delete"
        ) {

          if (
            transaction.type ===
            "buyer_payment"
          ) {

            alert(
              "FF Buyer payment should be managed from the Buyers section."
            );

            return;

          }


          const title =
            transaction.description ||
            transaction.category ||
            "this income";


          const confirmed =
            confirm(
              `Move "${title}" to Trash?\n\nThe income entry will be removed from the active transaction list.`
            );


          if (!confirmed) {
            return;
          }


          if (
            window.TamilandaWallet &&
            typeof window.TamilandaWallet.deleteRecord ===
              "function"
          ) {

            window.TamilandaWallet.deleteRecord(
              "transactions",
              id
            );

          } else {

            const index =
              walletData.transactions.findIndex(
                item =>
                  String(item.id) ===
                  String(id)
              );


            if (index !== -1) {

              const removed =
                walletData.transactions.splice(
                  index,
                  1
                )[0];


              /*
                Reverse the income balance
                before moving it to Trash.
              */

              const account =
                getAccount(
                  removed.accountId
                );


              if (account) {

                account.balance =
                  getBalance(account) -
                  Number(
                    removed.amount || 0
                  );

              }


              if (
                !Array.isArray(
                  walletData.trash
                )
              ) {

                walletData.trash = [];

              }


              walletData.trash.unshift({

                id:
                  "trash_" +
                  Date.now(),

                originalId:
                  removed.id,

                type:
                  "transactions",

                data:
                  JSON.parse(
                    JSON.stringify(
                      removed
                    )
                  ),

                deletedAt:
                  new Date().toISOString()

              });


              saveData();

            }

          }


          renderIncome();

        }

      }
    );


    /* =====================================================
       EVENTS
       ===================================================== */

    document
      .getElementById(
        "addIncomeBtn"
      )
      .addEventListener(
        "click",
        openAddModal
      );


    document
      .getElementById(
        "closeModalBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById(
        "cancelModalBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    incomeAccount.addEventListener(
      "change",
      updateAccountPreview
    );


    searchInput.addEventListener(
      "input",
      renderIncome
    );


    categoryFilter.addEventListener(
      "change",
      renderIncome
    );


    modal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          modal
        ) {

          closeModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* =====================================================
       INITIAL LOAD
       ===================================================== */

    loadCategories();

    loadAccounts();

    incomeDate.value =
      todayString();

    renderIncome();


    /* =====================================================
       REFRESH ON RETURN
       ===================================================== */

    window.addEventListener(
      "pageshow",
      function() {

        walletData =
          getData();

        loadCategories();

        loadAccounts();

        renderIncome();

      }
    );

  </script>

</body>
