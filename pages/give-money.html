<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Money To Give - Tamilanda Wallet</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/style.css">

  <meta name="theme-color" content="#09070d">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="app-header">

    <div>
      <h1>Money To Give</h1>
      <p>Track money you have to pay others</p>
    </div>

    <button
      class="icon-button"
      onclick="goBack()"
    >
      ←
    </button>

  </header>


  <!-- =========================
       SUMMARY
  ========================== -->

  <section class="summary-grid">

    <div class="summary-card">
      <span>Total People</span>
      <strong id="totalPeople">0</strong>
    </div>

    <div class="summary-card">
      <span>Total To Give</span>
      <strong id="totalToGive">₹0.00</strong>
    </div>

    <div class="summary-card">
      <span>Pending</span>
      <strong id="pendingPeople">0</strong>
    </div>

    <div class="summary-card">
      <span>Completed</span>
      <strong id="completedPeople">0</strong>
    </div>

  </section>


  <!-- =========================
       ADD BUTTON
  ========================== -->

  <section class="page-actions">

    <button
      class="primary-button"
      onclick="openGiveForm()"
    >
      + Add Money To Give
    </button>

  </section>


  <!-- =========================
       SEARCH / FILTER
  ========================== -->

  <section class="card">

    <input
      type="search"
      id="searchInput"
      class="input"
      placeholder="🔎 Search person or reason..."
      oninput="renderGiveList()"
    >

    <select
      id="statusFilter"
      class="input"
      onchange="renderGiveList()"
    >

      <option value="all">All</option>
      <option value="pending">Pending</option>
      <option value="completed">Completed</option>
      <option value="overdue">Overdue</option>

    </select>

  </section>


  <!-- =========================
       FORM
  ========================== -->

  <section
    class="card"
    id="giveFormCard"
    style="display:none;"
  >

    <div class="section-title">

      <h2 id="formTitle">
        Add Money To Give
      </h2>

      <button
        class="secondary-button"
        onclick="closeGiveForm()"
      >
        Cancel
      </button>

    </div>


    <input
      type="hidden"
      id="editingGiveId"
    >


    <label>Person Name</label>

    <input
      type="text"
      id="personName"
      class="input"
      placeholder="Enter person name"
    >


    <label>Phone Number</label>

    <input
      type="tel"
      id="personPhone"
      class="input"
      placeholder="Optional phone number"
    >


    <label>Total Amount Owed</label>

    <input
      type="number"
      id="giveTotalAmount"
      class="input"
      placeholder="₹ Total amount"
      min="0"
      step="0.01"
      oninput="updateGivePreview()"
    >


    <label>Already Paid</label>

    <input
      type="number"
      id="giveAlreadyPaid"
      class="input"
      placeholder="₹ Already paid"
      min="0"
      step="0.01"
      oninput="updateGivePreview()"
    >


    <div
      class="info-box"
      id="alreadyPaidInfo"
      style="display:none;"
    >

      <span>
        Remaining Amount
      </span>

      <strong id="giveRemainingPreview">
        ₹0.00
      </strong>

    </div>


    <label>Reason</label>

    <input
      type="text"
      id="giveReason"
      class="input"
      placeholder="Example: Friend loan, shop payment..."
    >


    <label>Due Date</label>

    <input
      type="date"
      id="giveDueDate"
      class="input"
    >


    <label>Notes</label>

    <textarea
      id="giveNotes"
      class="input"
      rows="3"
      placeholder="Optional notes..."
    ></textarea>


    <button
      class="primary-button"
      onclick="saveGiveMoney()"
    >
      Save
    </button>

  </section>


  <!-- =========================
       LIST
  ========================== -->

  <section>

    <div class="section-heading">
      <h2>Payment List</h2>
    </div>

    <div id="giveList"></div>

  </section>


  <!-- =========================
       PAYMENT MODAL
  ========================== -->

  <div
    id="givePaymentModal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-content">

      <div class="section-title">

        <div>

          <h2>Record Payment</h2>

          <p id="givePaymentPerson">
            Person
          </p>

        </div>

        <button
          class="icon-button"
          onclick="closeGivePaymentModal()"
        >
          ×
        </button>

      </div>


      <div class="info-box">

        <span>
          Remaining To Pay
        </span>

        <strong id="givePaymentRemaining">
          ₹0.00
        </strong>

      </div>


      <input
        type="hidden"
        id="givePaymentId"
      >


      <label>Amount Paid</label>

      <input
        type="number"
        id="givePaymentAmount"
        class="input"
        placeholder="₹ Amount"
        min="0"
        step="0.01"
      >


      <label>Paid From</label>

      <select
        id="givePaymentAccount"
        class="input"
      >

        <option value="">
          Select account
        </option>

      </select>


      <label>Payment Date</label>

      <input
        type="date"
        id="givePaymentDate"
        class="input"
      >


      <label>Note</label>

      <textarea
        id="givePaymentNote"
        class="input"
        rows="3"
        placeholder="Optional payment note..."
      ></textarea>


      <button
        class="primary-button"
        onclick="saveGivePayment()"
      >
        + Record Payment
      </button>

    </div>

  </div>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button onclick="goToPage('home')">
      🏠
      <span>Home</span>
    </button>

    <button onclick="goToPage('transactions')">
      📋
      <span>Transactions</span>
    </button>

    <button onclick="goToPage('buyers')">
      👤
      <span>Buyers</span>
    </button>

    <button onclick="goToPage('accounts')">
      🏦
      <span>Accounts</span>
    </button>

    <button onclick="goToPage('more')">
      ☰
      <span>More</span>
    </button>

  </nav>


  <!-- =========================
       APP JS
  ========================== -->

  <script src="../js/app.js"></script>


  <script>

    let walletData;
    let editingGiveId = null;


    /* =========================
       HELPERS
    ========================== */

    function money(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatMoney ===
        "function"
      ) {

        return window.TamilandaWallet.formatMoney(
          Number(value) || 0
        );

      }

      return "₹" +
        (Number(value) || 0).toLocaleString(
          "en-IN",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

    }


    function today() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.todayString ===
        "function"
      ) {

        return window.TamilandaWallet.todayString();

      }

      const d = new Date();

      return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
      );

    }


    function generateId() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.generateId ===
        "function"
      ) {

        return window.TamilandaWallet.generateId();

      }

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .substring(2, 8)
      );

    }


    function saveData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.save ===
        "function"
      ) {

        window.TamilandaWallet.save();

      }

    }


    function escapeHtml(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.escapeHtml ===
        "function"
      ) {

        return window.TamilandaWallet.escapeHtml(
          value
        );

      }

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(dateString) {

      if (!dateString) {
        return "-";
      }

      const parts =
        dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
      );

    }


    function getRemaining(item) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.getGiveRemaining ===
        "function"
      ) {

        return Number(
          window.TamilandaWallet.getGiveRemaining(
            item.id
          )
        ) || 0;

      }


      const payments =
        (walletData.givePayments || [])
          .filter(
            payment =>
              payment.giveId === item.id
          )
          .reduce(
            (sum, payment) =>
              sum +
              Number(payment.amount || 0),
            0
          );


      return Math.max(
        0,
        Number(
          item.totalAmount ||
          item.amount ||
          0
        ) -
        Number(
          item.alreadyPaid ||
          0
        ) -
        payments
      );

    }


    function getPaidAmount(item) {

      const total =
        Number(
          item.totalAmount ||
          item.amount ||
          0
        );

      const remaining =
        getRemaining(item);

      return Math.max(
        0,
        total - remaining
      );

    }


    function isOverdue(item) {

      const remaining =
        getRemaining(item);

      if (
        remaining <= 0 ||
        !item.dueDate
      ) {
        return false;
      }

      return (
        item.dueDate < today()
      );

    }


    function getAccountName(accountId) {

      const account =
        (walletData.accounts || [])
          .find(
            account =>
              account.id === accountId
          );

      return account
        ? account.name
        : "Unknown Account";

    }


    /* =========================
       INIT
    ========================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        walletData =
          window.TamilandaWallet.getData();

        document.getElementById(
          "givePaymentDate"
        ).value = today();

        renderSummary();
        renderGiveList();
        populateAccounts();

      }
    );


    /* =========================
       ACCOUNT SELECT
    ========================== */

    function populateAccounts() {

      const select =
        document.getElementById(
          "givePaymentAccount"
        );


      select.innerHTML =
        `<option value="">
          Select account
        </option>`;


      (walletData.accounts || [])
        .forEach(account => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            account.id;

          option.textContent =
            account.name +
            " — " +
            money(account.balance);

          select.appendChild(option);

        });

    }


    /* =========================
       SUMMARY
    ========================== */

    function renderSummary() {

      const list =
        walletData.moneyToGive || [];

      let total =
        0;

      let pending =
        0;

      let completed =
        0;


      list.forEach(item => {

        const remaining =
          getRemaining(item);

        total += remaining;

        if (remaining <= 0) {
          completed++;
        } else {
          pending++;
        }

      });


      document.getElementById(
        "totalPeople"
      ).textContent =
        list.length;


      document.getElementById(
        "totalToGive"
      ).textContent =
        money(total);


      document.getElementById(
        "pendingPeople"
      ).textContent =
        pending;


      document.getElementById(
        "completedPeople"
      ).textContent =
        completed;

    }


    /* =========================
       FORM
    ========================== */

    function openGiveForm() {

      editingGiveId =
        null;

      document.getElementById(
        "formTitle"
      ).textContent =
        "Add Money To Give";


      document.getElementById(
        "giveFormCard"
      ).style.display =
        "block";


      clearGiveForm();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function closeGiveForm() {

      document.getElementById(
        "giveFormCard"
      ).style.display =
        "none";

      editingGiveId =
        null;

      clearGiveForm();

    }


    function clearGiveForm() {

      document.getElementById(
        "editingGiveId"
      ).value = "";


      document.getElementById(
        "personName"
      ).value = "";


      document.getElementById(
        "personPhone"
      ).value = "";


      document.getElementById(
        "giveTotalAmount"
      ).value = "";


      document.getElementById(
        "giveAlreadyPaid"
      ).value = "";


      document.getElementById(
        "giveReason"
      ).value = "";


      document.getElementById(
        "giveDueDate"
      ).value = "";


      document.getElementById(
        "giveNotes"
      ).value = "";


      document.getElementById(
        "alreadyPaidInfo"
      ).style.display =
        "none";


      document.getElementById(
        "giveRemainingPreview"
      ).textContent =
        money(0);

    }


    function updateGivePreview() {

      const total =
        Number(
          document.getElementById(
            "giveTotalAmount"
          ).value
        ) || 0;


      const paid =
        Number(
          document.getElementById(
            "giveAlreadyPaid"
          ).value
        ) || 0;


      const remaining =
        Math.max(
          0,
          total - paid
        );


      document.getElementById(
        "alreadyPaidInfo"
      ).style.display =
        "block";


      document.getElementById(
        "giveRemainingPreview"
      ).textContent =
        money(remaining);

    }


    /* =========================
       SAVE GIVE MONEY
    ========================== */

    function saveGiveMoney() {

      const name =
        document.getElementById(
          "personName"
        ).value.trim();


      const phone =
        document.getElementById(
          "personPhone"
        ).value.trim();


      const total =
        Number(
          document.getElementById(
            "giveTotalAmount"
          ).value
        ) || 0;


      const alreadyPaid =
        Number(
          document.getElementById(
            "giveAlreadyPaid"
          ).value
        ) || 0;


      const reason =
        document.getElementById(
          "giveReason"
        ).value.trim();


      const dueDate =
        document.getElementById(
          "giveDueDate"
        ).value;


      const notes =
        document.getElementById(
          "giveNotes"
        ).value.trim();


      if (!name) {

        alert(
          "Please enter person name."
        );

        return;

      }


      if (total <= 0) {

        alert(
          "Please enter a valid total amount."
        );

        return;

      }


      if (alreadyPaid < 0) {

        alert(
          "Already paid cannot be negative."
        );

        return;

      }


      if (alreadyPaid > total) {

        alert(
          "Already paid cannot be greater than total amount."
        );

        return;

      }


      /* =========================
         EDIT
      ========================== */

      if (editingGiveId) {

        const item =
          walletData.moneyToGive
            .find(
              x =>
                x.id ===
                editingGiveId
            );


        if (!item) {

          alert(
            "Record not found."
          );

          return;

        }


        const hasPayments =
          (walletData.givePayments || [])
            .some(
              payment =>
                payment.giveId ===
                item.id
            );


        item.name =
          name;

        item.personName =
          name;

        item.phone =
          phone;

        item.reason =
          reason;

        item.dueDate =
          dueDate;

        item.notes =
          notes;


        /*
          If payment history exists,
          don't alter financial base values.
        */

        if (!hasPayments) {

          item.totalAmount =
            total;

          item.amount =
            total;

          item.alreadyPaid =
            alreadyPaid;

        }


        saveData();

        walletData =
          window.TamilandaWallet.getData();


        closeGiveForm();

        renderSummary();
        renderGiveList();

        alert(
          "Money To Give updated successfully. ✅"
        );

        return;

      }


      /* =========================
         NEW RECORD
      ========================== */

      const item = {

        id:
          generateId(),

        name:
          name,

        personName:
          name,

        phone:
          phone,

        totalAmount:
          total,

        amount:
          total,

        alreadyPaid:
          alreadyPaid,

        reason:
          reason,

        dueDate:
          dueDate,

        notes:
          notes,

        createdAt:
          new Date().toISOString()

      };


      if (!walletData.moneyToGive) {

        walletData.moneyToGive =
          [];

      }


      walletData.moneyToGive.push(
        item
      );


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      closeGiveForm();

      renderSummary();
      renderGiveList();

      alert(
        "Money To Give added successfully. ✅"
      );

    }


    /* =========================
       EDIT
    ========================== */

    function editGiveMoney(id) {

      const item =
        walletData.moneyToGive
          .find(
            x => x.id === id
          );


      if (!item) {
        return;
      }


      editingGiveId =
        id;


      document.getElementById(
        "formTitle"
      ).textContent =
        "Edit Money To Give";


      document.getElementById(
        "personName"
      ).value =
        item.name ||
        item.personName ||
        "";


      document.getElementById(
        "personPhone"
      ).value =
        item.phone ||
        "";


      document.getElementById(
        "giveTotalAmount"
      ).value =
        item.totalAmount ||
        item.amount ||
        "";


      document.getElementById(
        "giveAlreadyPaid"
      ).value =
        item.alreadyPaid ||
        "";


      document.getElementById(
        "giveReason"
      ).value =
        item.reason ||
        "";


      document.getElementById(
        "giveDueDate"
      ).value =
        item.dueDate ||
        "";


      document.getElementById(
        "giveNotes"
      ).value =
        item.notes ||
        "";


      updateGivePreview();


      document.getElementById(
        "giveFormCard"
      ).style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       PAYMENT MODAL
    ========================== */

    function openGivePaymentModal(id) {

      const item =
        walletData.moneyToGive
          .find(
            x => x.id === id
          );


      if (!item) {
        return;
      }


      const remaining =
        getRemaining(item);


      if (remaining <= 0) {

        alert(
          "This payment is already completed. ✅"
        );

        return;

      }


      document.getElementById(
        "givePaymentId"
      ).value =
        id;


      document.getElementById(
        "givePaymentPerson"
      ).textContent =
        item.name ||
        item.personName ||
        "Person";


      document.getElementById(
        "givePaymentRemaining"
      ).textContent =
        money(remaining);


      document.getElementById(
        "givePaymentAmount"
      ).value =
        "";


      document.getElementById(
        "givePaymentAccount"
      ).value =
        "";


      document.getElementById(
        "givePaymentDate"
      ).value =
        today();


      document.getElementById(
        "givePaymentNote"
      ).value =
        "";


      document.getElementById(
        "givePaymentModal"
      ).style.display =
        "flex";

    }


    function closeGivePaymentModal() {

      document.getElementById(
        "givePaymentModal"
      ).style.display =
        "none";

    }


    /* =========================
       SAVE PAYMENT
    ========================== */

    function saveGivePayment() {

      const giveId =
        document.getElementById(
          "givePaymentId"
        ).value;


      const amount =
        Number(
          document.getElementById(
            "givePaymentAmount"
          ).value
        ) || 0;


      const accountId =
        document.getElementById(
          "givePaymentAccount"
        ).value;


      const date =
        document.getElementById(
          "givePaymentDate"
        ).value ||
        today();


      const note =
        document.getElementById(
          "givePaymentNote"
        ).value.trim();


      const item =
        walletData.moneyToGive
          .find(
            x => x.id === giveId
          );


      if (!item) {

        alert(
          "Record not found."
        );

        return;

      }


      if (amount <= 0) {

        alert(
          "Please enter a valid payment amount."
        );

        return;

      }


      const remaining =
        getRemaining(item);


      if (amount > remaining) {

        alert(
          "Maximum payment allowed is " +
          money(remaining) +
          "."
        );

        return;

      }


      if (!accountId) {

        alert(
          "Please select the account used for payment."
        );

        return;

      }


      const account =
        walletData.accounts
          .find(
            a =>
              a.id === accountId
          );


      if (!account) {

        alert(
          "Selected account not found."
        );

        return;

      }


      /*
        Payment reduces the selected
        account balance.
      */

      if (
        Number(account.balance || 0) <
        amount
      ) {

        alert(
          "Insufficient balance in selected account."
        );

        return;

      }


      account.balance =
        Number(
          account.balance || 0
        ) -
        amount;


      if (!walletData.givePayments) {

        walletData.givePayments =
          [];

      }


      walletData.givePayments.push({

        id:
          generateId(),

        giveId:
          giveId,

        amount:
          amount,

        accountId:
          accountId,

        date:
          date,

        note:
          note,

        createdAt:
          new Date().toISOString()

      });


      /*
        This is an expense from the wallet
        because money is actually leaving.
      */

      walletData.transactions.push({

        id:
          generateId(),

        type:
          "expense",

        category:
          "Money To Give",

        amount:
          amount,

        accountId:
          accountId,

        date:
          date,

        description:
          `Payment To ${item.name || item.personName}`,

        note:
          note,

        source:
          "money_to_give_payment",

        giveId:
          giveId,

        createdAt:
          new Date().toISOString()

      });


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      const newRemaining =
        getRemaining(item);


      closeGivePaymentModal();

      populateAccounts();

      renderSummary();
      renderGiveList();


      if (newRemaining <= 0) {

        alert(
          "Payment completed successfully! 🎉"
        );

      } else {

        alert(
          "Payment recorded. Remaining: " +
          money(newRemaining)
        );

      }

    }


    /* =========================
       PAYMENT HISTORY
    ========================== */

    function getGivePayments(id) {

      return (
        walletData.givePayments || []
      )
        .filter(
          payment =>
            payment.giveId === id
        )
        .sort(
          (a, b) =>
            new Date(
              b.date ||
              b.createdAt
            ) -
            new Date(
              a.date ||
              a.createdAt
            )
        );

    }


    function toggleHistory(id) {

      const element =
        document.getElementById(
          "give-history-" + id
        );


      if (!element) {
        return;
      }


      element.style.display =
        element.style.display === "none"
          ? "block"
          : "none";

    }


    /* =========================
       DELETE
    ========================== */

    function deleteGiveMoney(id) {

      const item =
        walletData.moneyToGive
          .find(
            x => x.id === id
          );


      if (!item) {
        return;
      }


      const payments =
        getGivePayments(id);


      if (payments.length > 0) {

        alert(
          "This record has payment history. Please keep it for accounting history. You can edit the record instead."
        );

        return;

      }


      const remaining =
        getRemaining(item);


      const person =
        item.name ||
        item.personName ||
        "this record";


      let message =
        `Move ${person} to Trash?`;


      if (remaining > 0) {

        message +=
          `\n\nPending amount: ${money(remaining)}`;

      }


      if (!confirm(message)) {
        return;
      }


      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.moveToTrash ===
        "function"
      ) {

        window.TamilandaWallet.moveToTrash(
          "moneyToGive",
          item
        );

      } else {

        walletData.trash =
          walletData.trash ||
          [];

        walletData.trash.push({

          id:
            generateId(),

          type:
            "moneyToGive",

          originalCollection:
            "moneyToGive",

          data:
            item,

          deletedAt:
            new Date().toISOString()

        });

      }


      const index =
        walletData.moneyToGive
          .findIndex(
            x => x.id === id
          );


      if (index !== -1) {

        walletData.moneyToGive
          .splice(
            index,
            1
          );

      }


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      renderSummary();
      renderGiveList();

      alert(
        "Record moved to Trash. 🗑️"
      );

    }


    /* =========================
       RENDER
    ========================== */

    function renderGiveList() {

      const container =
        document.getElementById(
          "giveList"
        );


      const search =
        document.getElementById(
          "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


      const filter =
        document.getElementById(
          "statusFilter"
        ).value;


      let list =
        [
          ...(walletData.moneyToGive || [])
        ];


      list =
        list.filter(item => {

          const remaining =
            getRemaining(item);

          const completed =
            remaining <= 0;

          const overdue =
            isOverdue(item);


          if (
            filter === "completed" &&
            !completed
          ) {
            return false;
          }


          if (
            filter === "pending" &&
            (
              completed ||
              overdue
            )
          ) {
            return false;
          }


          if (
            filter === "overdue" &&
            !overdue
          ) {
            return false;
          }


          if (!search) {
            return true;
          }


          const searchable =
            [
              item.name,
              item.personName,
              item.phone,
              item.reason,
              item.notes
            ]
            .join(" ")
            .toLowerCase();


          return searchable.includes(
            search
          );

        });


      /*
        Pending first,
        overdue first,
        completed last.
      */

      list.sort(
        (a, b) => {

          const aRemaining =
            getRemaining(a);

          const bRemaining =
            getRemaining(b);


          if (
            aRemaining <= 0 &&
            bRemaining > 0
          ) {
            return 1;
          }


          if (
            aRemaining > 0 &&
            bRemaining <= 0
          ) {
            return -1;
          }


          if (
            a.dueDate &&
            b.dueDate
          ) {

            return (
              new Date(a.dueDate) -
              new Date(b.dueDate)
            );

          }


          return (
            new Date(
              b.createdAt || 0
            ) -
            new Date(
              a.createdAt || 0
            )
          );

        }
      );


      if (list.length === 0) {

        container.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              💸
            </div>

            <h3>
              No Records Found
            </h3>

            <p>
              Add money that you need to pay later.
            </p>

            <button
              class="primary-button"
              onclick="openGiveForm()"
            >
              + Add Money To Give
            </button>

          </div>

        `;

        return;

      }


      container.innerHTML =
        list
          .map(
            renderGiveCard
          )
          .join("");

    }


    /* =========================
       CARD
    ========================== */

    function renderGiveCard(item) {

      const total =
        Number(
          item.totalAmount ||
          item.amount ||
          0
        );


      const remaining =
        getRemaining(item);


      const paid =
        getPaidAmount(item);


      const progress =
        total > 0
          ? Math.min(
              100,
              Math.round(
                (paid / total) * 100
              )
            )
          : 0;


      const completed =
        remaining <= 0;


      const overdue =
        isOverdue(item);


      let statusClass =
        "status-warning";


      let statusText =
        "PENDING";


      if (completed) {

        statusClass =
          "status-success";

        statusText =
          "PAID";

      } else if (overdue) {

        statusClass =
          "status-danger";

        statusText =
          "OVERDUE";

      }


      const payments =
        getGivePayments(item.id);


      let historyHtml = "";


      if (payments.length === 0) {

        historyHtml = `

          <div class="muted-text">
            No payment history yet.
          </div>

        `;

      } else {

        historyHtml =
          payments
            .map(
              payment => `

                <div class="payment-history-item">

                  <div>

                    <strong>
                      ${money(
                        payment.amount
                      )}
                    </strong>

                    <small>
                      ${formatDate(
                        payment.date
                      )}
                    </small>

                  </div>

                  <div>

                    <small>
                      Paid from:
                      ${escapeHtml(
                        getAccountName(
                          payment.accountId
                        )
                      )}
                    </small>

                    ${
                      payment.note
                        ? `
                          <small>
                            ${escapeHtml(
                              payment.note
                            )}
                          </small>
                        `
                        : ""
                    }

                  </div>

                </div>

              `
            )
            .join("");

      }


      return `

        <article class="card give-card">

          <!-- HEADER -->

          <div class="give-header">

            <div>

              <div class="person-title">

                <h3>
                  ${escapeHtml(
                    item.name ||
                    item.personName ||
                    "Unnamed"
                  )}
                </h3>

                <span class="${statusClass}">
                  ${statusText}
                </span>

              </div>


              ${
                item.phone
                  ? `
                    <p>
                      📞
                      ${escapeHtml(
                        item.phone
                      )}
                    </p>
                  `
                  : ""
              }


              ${
                item.reason
                  ? `
                    <p>
                      📝
                      ${escapeHtml(
                        item.reason
                      )}
                    </p>
                  `
                  : ""
              }

            </div>


            <div class="give-menu">

              <button
                class="icon-button"
                onclick="editGiveMoney('${item.id}')"
                title="Edit"
              >
                ✏️
              </button>

              <button
                class="icon-button"
                onclick="deleteGiveMoney('${item.id}')"
                title="Delete"
              >
                🗑️
              </button>

            </div>

          </div>


          <!-- PROGRESS -->

          <div class="progress-section">

            <div class="progress-label">

              <span>
                Payment Progress
              </span>

              <strong>
                ${progress}%
              </strong>

            </div>


            <div class="progress-bar">

              <div
                class="progress-fill"
                style="width:${progress}%"
              ></div>

            </div>

          </div>


          <!-- MONEY -->

          <div class="money-grid">

            <div>

              <span>
                Total
              </span>

              <strong>
                ${money(total)}
              </strong>

            </div>


            <div>

              <span>
                Paid
              </span>

              <strong>
                ${money(paid)}
              </strong>

            </div>


            <div>

              <span>
                Remaining
              </span>

              <strong>
                ${money(remaining)}
              </strong>

            </div>

          </div>


          <!-- DUE DATE -->

          ${
            item.dueDate
              ? `
                <div class="info-box">

                  <span>
                    Due Date
                  </span>

                  <strong>
                    ${formatDate(
                      item.dueDate
                    )}
                  </strong>

                </div>
              `
              : ""
          }


          ${
            item.notes
              ? `
                <div class="note-box">
                  🗒️
                  ${escapeHtml(
                    item.notes
                  )}
                </div>
              `
              : ""
          }


          <!-- ACTIONS -->

          <div class="give-actions">

            ${
              !completed
                ? `
                  <button
                    class="primary-button"
                    onclick="openGivePaymentModal('${item.id}')"
                  >
                    💸 Pay Amount
                  </button>
                `
                : `
                  <button
                    class="secondary-button"
                    disabled
                  >
                    ✓ Payment Completed
                  </button>
                `
            }


            <button
              class="secondary-button"
              onclick="toggleHistory('${item.id}')"
            >
              🧾 History (${payments.length})
            </button>

          </div>


          <!-- HISTORY -->

          <div
            id="give-history-${item.id}"
            class="payment-history"
            style="display:none;"
          >

            <h4>
              Payment History
            </h4>

            ${historyHtml}

          </div>

        </article>

      `;

    }


    /* =========================
       NAVIGATION
    ========================== */

    function goBack() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        goToPage("home");

      }

    }


    function goToPage(page) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.goToPage ===
        "function"
      ) {

        window.TamilandaWallet.goToPage(
          page
        );

        return;

      }


      const pages = {

        home:
          "../index.html",

        transactions:
          "transactions.html",

        buyers:
          "buyers.html",

        accounts:
          "accounts.html",

        more:
          "more.html"

      };


      if (pages[page]) {

        window.location.href =
          pages[page];

      }

    }


    /* =========================
       OUTSIDE MODAL CLICK
    ========================== */

    document.addEventListener(
      "click",
      function(event) {

        const modal =
          document.getElementById(
            "givePaymentModal"
          );


        if (
          event.target === modal
        ) {

          closeGivePaymentModal();

        }

      }
    );

  </script>
