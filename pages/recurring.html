<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recurring Payments - Tamilanda Wallet</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/style.css">

  <meta name="theme-color" content="#09070d">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="app-header">

    <div>
      <h1>Recurring Payments</h1>
      <p>Track bills and payments that repeat</p>
    </div>

    <button
      class="icon-button"
      onclick="goBack()"
    >
      ←
    </button>

  </header>


  <!-- =========================
       SUMMARY
  ========================== -->

  <section class="summary-grid">

    <div class="summary-card">
      <span>Total Bills</span>
      <strong id="totalBills">0</strong>
    </div>

    <div class="summary-card">
      <span>Monthly Estimate</span>
      <strong id="monthlyTotal">₹0.00</strong>
    </div>

    <div class="summary-card">
      <span>Due Soon</span>
      <strong id="dueSoon">0</strong>
    </div>

    <div class="summary-card">
      <span>Overdue</span>
      <strong id="overdueCount">0</strong>
    </div>

  </section>


  <!-- =========================
       ADD BUTTON
  ========================== -->

  <section class="page-actions">

    <button
      class="primary-button"
      onclick="openRecurringForm()"
    >
      + Add Recurring Payment
    </button>

  </section>


  <!-- =========================
       SEARCH / FILTER
  ========================== -->

  <section class="card">

    <input
      type="search"
      id="searchInput"
      class="input"
      placeholder="🔎 Search bill, category..."
      oninput="renderRecurring()"
    >

    <div class="filter-row">

      <select
        id="statusFilter"
        class="input"
        onchange="renderRecurring()"
      >
        <option value="all">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="overdue">Overdue</option>
        <option value="dueSoon">Due Soon</option>
      </select>


      <select
        id="frequencyFilter"
        class="input"
        onchange="renderRecurring()"
      >
        <option value="all">All Frequency</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="yearly">Yearly</option>
      </select>

    </div>

  </section>


  <!-- =========================
       FORM
  ========================== -->

  <section
    class="card"
    id="recurringFormCard"
    style="display:none;"
  >

    <div class="section-title">

      <h2 id="formTitle">
        Add Recurring Payment
      </h2>

      <button
        class="secondary-button"
        onclick="closeRecurringForm()"
      >
        Cancel
      </button>

    </div>


    <input
      type="hidden"
      id="editingRecurringId"
    >


    <label>Payment / Bill Name</label>

    <input
      type="text"
      id="recurringName"
      class="input"
      placeholder="Example: Internet, Rent, Netflix, EB Bill"
    >


    <label>Amount</label>

    <input
      type="number"
      id="recurringAmount"
      class="input"
      placeholder="₹ Amount"
      min="0"
      step="0.01"
    >


    <label>Frequency</label>

    <select
      id="recurringFrequency"
      class="input"
    >

      <option value="daily">
        Daily
      </option>

      <option value="weekly">
        Weekly
      </option>

      <option
        value="monthly"
        selected
      >
        Monthly
      </option>

      <option value="yearly">
        Yearly
      </option>

    </select>


    <label>Category</label>

    <input
      type="text"
      id="recurringCategory"
      class="input"
      placeholder="Example: Bills, Subscription, Rent"
    >


    <label>Next Due Date</label>

    <input
      type="date"
      id="recurringDueDate"
      class="input"
    >


    <label>Pay From Account</label>

    <select
      id="recurringAccount"
      class="input"
    >

      <option value="">
        Select account
      </option>

    </select>


    <label>Notes</label>

    <textarea
      id="recurringNotes"
      class="input"
      rows="3"
      placeholder="Optional notes..."
    ></textarea>


    <label class="toggle-row">

      <span>
        Active
      </span>

      <input
        type="checkbox"
        id="recurringActive"
        checked
      >

    </label>


    <button
      class="primary-button"
      onclick="saveRecurring()"
    >
      Save Recurring Payment
    </button>

  </section>


  <!-- =========================
       LIST
  ========================== -->

  <section>

    <div class="section-heading">
      <h2>Recurring List</h2>
    </div>

    <div id="recurringList"></div>

  </section>


  <!-- =========================
       PAYMENT HISTORY MODAL
  ========================== -->

  <div
    id="historyModal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-content">

      <div class="section-title">

        <div>

          <h2>Payment History</h2>

          <p id="historyBillName">
            Bill
          </p>

        </div>

        <button
          class="icon-button"
          onclick="closeHistoryModal()"
        >
          ×
        </button>

      </div>


      <div id="historyList"></div>

    </div>

  </div>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button onclick="goToPage('home')">
      🏠
      <span>Home</span>
    </button>

    <button onclick="goToPage('transactions')">
      📋
      <span>Transactions</span>
    </button>

    <button onclick="goToPage('buyers')">
      👤
      <span>Buyers</span>
    </button>

    <button onclick="goToPage('accounts')">
      🏦
      <span>Accounts</span>
    </button>

    <button onclick="goToPage('more')">
      ☰
      <span>More</span>
    </button>

  </nav>


  <!-- =========================
       APP JS
  ========================== -->

  <script src="../js/app.js"></script>


  <script>

    let walletData;
    let editingRecurringId = null;


    /* =========================
       HELPERS
    ========================== */

    function money(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatMoney ===
        "function"
      ) {

        return window.TamilandaWallet.formatMoney(
          Number(value) || 0
        );

      }

      return "₹" +
        (Number(value) || 0).toLocaleString(
          "en-IN",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

    }


    function today() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.todayString ===
        "function"
      ) {

        return window.TamilandaWallet.todayString();

      }

      const d = new Date();

      return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
      );

    }


    function generateId() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.generateId ===
        "function"
      ) {

        return window.TamilandaWallet.generateId();

      }

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .substring(2, 8)
      );

    }


    function saveData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.save ===
        "function"
      ) {

        window.TamilandaWallet.save();

      }

    }


    function escapeHtml(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.escapeHtml ===
        "function"
      ) {

        return window.TamilandaWallet.escapeHtml(
          value
        );

      }

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(dateString) {

      if (!dateString) {
        return "-";
      }

      const parts =
        dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
      );

    }


    function getAccountName(accountId) {

      const account =
        (walletData.accounts || [])
          .find(
            account =>
              account.id === accountId
          );

      return account
        ? account.name
        : "Unknown Account";

    }


    function daysUntil(dateString) {

      if (!dateString) {
        return null;
      }

      const todayDate =
        new Date(
          today() +
          "T00:00:00"
        );

      const dueDate =
        new Date(
          dateString +
          "T00:00:00"
        );

      return Math.ceil(
        (
          dueDate -
          todayDate
        ) /
        (1000 * 60 * 60 * 24)
      );

    }


    function isOverdue(item) {

      if (
        !item.active ||
        !item.nextDueDate
      ) {
        return false;
      }

      return (
        item.nextDueDate < today()
      );

    }


    function isDueSoon(item) {

      if (
        !item.active ||
        !item.nextDueDate
      ) {
        return false;
      }

      const days =
        daysUntil(
          item.nextDueDate
        );

      return (
        days !== null &&
        days >= 0 &&
        days <= 7
      );

    }


    function frequencyText(value) {

      const map = {

        daily: "Daily",

        weekly: "Weekly",

        monthly: "Monthly",

        yearly: "Yearly"

      };

      return (
        map[value] ||
        value ||
        "-"
      );

    }


    /* =========================
       INIT
    ========================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        walletData =
          window.TamilandaWallet.getData();


        document.getElementById(
          "recurringDueDate"
        ).value =
          today();


        renderSummary();

        populateAccounts();

        renderRecurring();

      }
    );


    /* =========================
       ACCOUNTS
    ========================== */

    function populateAccounts() {

      const select =
        document.getElementById(
          "recurringAccount"
        );


      select.innerHTML =
        `<option value="">
          Select account
        </option>`;


      (walletData.accounts || [])
        .forEach(account => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            account.id;

          option.textContent =
            account.name +
            " — " +
            money(account.balance);

          select.appendChild(
            option
          );

        });

    }


    /* =========================
       SUMMARY
    ========================== */

    function renderSummary() {

      const list =
        walletData.recurringBills || [];


      let monthly =
        0;

      let dueSoon =
        0;

      let overdue =
        0;


      list.forEach(item => {

        if (!item.active) {
          return;
        }


        const amount =
          Number(
            item.amount || 0
          );


        if (
          item.frequency ===
          "daily"
        ) {

          monthly +=
            amount * 30;

        } else if (
          item.frequency ===
          "weekly"
        ) {

          monthly +=
            amount * 4.33;

        } else if (
          item.frequency ===
          "yearly"
        ) {

          monthly +=
            amount / 12;

        } else {

          monthly +=
            amount;

        }


        if (
          isOverdue(item)
        ) {

          overdue++;

        } else if (
          isDueSoon(item)
        ) {

          dueSoon++;

        }

      });


      document.getElementById(
        "totalBills"
      ).textContent =
        list.length;


      document.getElementById(
        "monthlyTotal"
      ).textContent =
        money(monthly);


      document.getElementById(
        "dueSoon"
      ).textContent =
        dueSoon;


      document.getElementById(
        "overdueCount"
      ).textContent =
        overdue;

    }


    /* =========================
       FORM
    ========================== */

    function openRecurringForm() {

      editingRecurringId =
        null;


      document.getElementById(
        "formTitle"
      ).textContent =
        "Add Recurring Payment";


      document.getElementById(
        "recurringFormCard"
      ).style.display =
        "block";


      clearForm();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function closeRecurringForm() {

      document.getElementById(
        "recurringFormCard"
      ).style.display =
        "none";


      editingRecurringId =
        null;


      clearForm();

    }


    function clearForm() {

      document.getElementById(
        "editingRecurringId"
      ).value = "";


      document.getElementById(
        "recurringName"
      ).value = "";


      document.getElementById(
        "recurringAmount"
      ).value = "";


      document.getElementById(
        "recurringFrequency"
      ).value =
        "monthly";


      document.getElementById(
        "recurringCategory"
      ).value = "";


      document.getElementById(
        "recurringDueDate"
      ).value =
        today();


      document.getElementById(
        "recurringAccount"
      ).value = "";


      document.getElementById(
        "recurringNotes"
      ).value = "";


      document.getElementById(
        "recurringActive"
      ).checked =
        true;

    }


    /* =========================
       SAVE
    ========================== */

    function saveRecurring() {

      const name =
        document.getElementById(
          "recurringName"
        ).value.trim();


      const amount =
        Number(
          document.getElementById(
            "recurringAmount"
          ).value
        ) || 0;


      const frequency =
        document.getElementById(
          "recurringFrequency"
        ).value;


      const category =
        document.getElementById(
          "recurringCategory"
        ).value.trim();


      const nextDueDate =
        document.getElementById(
          "recurringDueDate"
        ).value;


      const accountId =
        document.getElementById(
          "recurringAccount"
        ).value;


      const notes =
        document.getElementById(
          "recurringNotes"
        ).value.trim();


      const active =
        document.getElementById(
          "recurringActive"
        ).checked;


      if (!name) {

        alert(
          "Please enter payment / bill name."
        );

        return;

      }


      if (amount <= 0) {

        alert(
          "Please enter a valid amount."
        );

        return;

      }


      if (!nextDueDate) {

        alert(
          "Please select next due date."
        );

        return;

      }


      if (!walletData.recurringBills) {

        walletData.recurringBills =
          [];

      }


      /* =========================
         EDIT
      ========================== */

      if (editingRecurringId) {

        const item =
          walletData.recurringBills
            .find(
              x =>
                x.id ===
                editingRecurringId
            );


        if (!item) {

          alert(
            "Recurring payment not found."
          );

          return;

        }


        item.name =
          name;

        item.amount =
          amount;

        item.frequency =
          frequency;

        item.category =
          category;

        item.nextDueDate =
          nextDueDate;

        item.accountId =
          accountId;

        item.notes =
          notes;

        item.active =
          active;


        saveData();

        walletData =
          window.TamilandaWallet.getData();


        closeRecurringForm();

        renderSummary();

        renderRecurring();

        alert(
          "Recurring payment updated successfully. ✅"
        );

        return;

      }


      /* =========================
         NEW
      ========================== */

      walletData.recurringBills.push({

        id:
          generateId(),

        name:
          name,

        amount:
          amount,

        frequency:
          frequency,

        category:
          category,

        nextDueDate:
          nextDueDate,

        accountId:
          accountId,

        notes:
          notes,

        active:
          active,

        createdAt:
          new Date().toISOString()

      });


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      closeRecurringForm();

      renderSummary();

      renderRecurring();


      alert(
        "Recurring payment added successfully. 🎉"
      );

    }


    /* =========================
       EDIT
    ========================== */

    function editRecurring(id) {

      const item =
        walletData.recurringBills
          .find(
            x =>
              x.id === id
          );


      if (!item) {
        return;
      }


      editingRecurringId =
        id;


      document.getElementById(
        "formTitle"
      ).textContent =
        "Edit Recurring Payment";


      document.getElementById(
        "recurringName"
      ).value =
        item.name ||
        "";


      document.getElementById(
        "recurringAmount"
      ).value =
        item.amount ||
        "";


      document.getElementById(
        "recurringFrequency"
      ).value =
        item.frequency ||
        "monthly";


      document.getElementById(
        "recurringCategory"
      ).value =
        item.category ||
        "";


      document.getElementById(
        "recurringDueDate"
      ).value =
        item.nextDueDate ||
        today();


      document.getElementById(
        "recurringAccount"
      ).value =
        item.accountId ||
        "";


      document.getElementById(
        "recurringNotes"
      ).value =
        item.notes ||
        "";


      document.getElementById(
        "recurringActive"
      ).checked =
        item.active !== false;


      document.getElementById(
        "recurringFormCard"
      ).style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       MARK PAID
    ========================== */

    function markAsPaid(id) {

      const item =
        walletData.recurringBills
          .find(
            x =>
              x.id === id
          );


      if (!item) {
        return;
      }


      if (!item.active) {

        alert(
          "This recurring payment is inactive."
        );

        return;

      }


      const amount =
        Number(
          item.amount || 0
        );


      if (amount <= 0) {

        alert(
          "Invalid recurring payment amount."
        );

        return;

      }


      let accountId =
        item.accountId ||
        "";


      /*
        If default account is missing,
        ask user to choose one.
      */

      if (!accountId) {

        const accounts =
          walletData.accounts || [];


        if (accounts.length === 1) {

          accountId =
            accounts[0].id;

        } else {

          const select =
            prompt(
              "Enter Account ID for payment:\n\n" +
              accounts
                .map(
                  account =>
                    account.name +
                    " = " +
                    account.id
                )
                .join("\n")
            );


          if (!select) {
            return;
          }


          accountId =
            select.trim();

        }

      }


      const account =
        walletData.accounts
          .find(
            a =>
              a.id === accountId
          );


      if (!account) {

        alert(
          "Payment account not found. Please edit this recurring payment and select an account."
        );

        return;

      }


      if (
        Number(account.balance || 0) <
        amount
      ) {

        alert(
          "Insufficient balance in selected account."
        );

        return;

      }


      const confirmPayment =
        confirm(
          `Pay ${item.name} — ${money(amount)}?`
        );


      if (!confirmPayment) {
        return;
      }


      /*
        Reduce account balance.
      */

      account.balance =
        Number(
          account.balance || 0
        ) -
        amount;


      if (!walletData.recurringPayments) {

        walletData.recurringPayments =
          [];

      }


      walletData.recurringPayments.push({

        id:
          generateId(),

        recurringId:
          item.id,

        amount:
          amount,

        accountId:
          accountId,

        date:
          today(),

        createdAt:
          new Date().toISOString()

      });


      /*
        Create expense transaction.
      */

      walletData.transactions.push({

        id:
          generateId(),

        type:
          "expense",

        category:
          item.category ||
          "Bills",

        amount:
          amount,

        accountId:
          accountId,

        date:
          today(),

        description:
          `Recurring Payment - ${item.name}`,

        note:
          item.notes ||
          "",

        source:
          "recurring_payment",

        recurringId:
          item.id,

        createdAt:
          new Date().toISOString()

      });


      /*
        Move next due date forward.
      */

      item.nextDueDate =
        getNextDueDate(
          item.nextDueDate,
          item.frequency
        );


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      populateAccounts();

      renderSummary();

      renderRecurring();


      alert(
        `${item.name} payment recorded successfully. 💳`
      );

    }


    /* =========================
       NEXT DUE DATE
    ========================== */

    function getNextDueDate(
      currentDate,
      frequency
    ) {

      const date =
        new Date(
          (
            currentDate ||
            today()
          ) +
          "T00:00:00"
        );


      if (
        frequency ===
        "daily"
      ) {

        date.setDate(
          date.getDate() + 1
        );

      } else if (
        frequency ===
        "weekly"
      ) {

        date.setDate(
          date.getDate() + 7
        );

      } else if (
        frequency ===
        "yearly"
      ) {

        date.setFullYear(
          date.getFullYear() + 1
        );

      } else {

        date.setMonth(
          date.getMonth() + 1
        );

      }


      return (
        date.getFullYear() +
        "-" +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          date.getDate()
        ).padStart(2, "0")
      );

    }


    /* =========================
       TOGGLE ACTIVE
    ========================== */

    function toggleActive(id) {

      const item =
        walletData.recurringBills
          .find(
            x =>
              x.id === id
          );


      if (!item) {
        return;
      }


      item.active =
        item.active === false;


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      renderSummary();

      renderRecurring();

    }


    /* =========================
       HISTORY
    ========================== */

    function getPayments(id) {

      return (
        walletData.recurringPayments ||
        []
      )
        .filter(
          payment =>
            payment.recurringId === id
        )
        .sort(
          (a, b) =>
            new Date(
              b.date ||
              b.createdAt
            ) -
            new Date(
              a.date ||
              a.createdAt
            )
        );

    }


    function openHistory(id) {

      const item =
        walletData.recurringBills
          .find(
            x =>
              x.id === id
          );


      if (!item) {
        return;
      }


      const payments =
        getPayments(id);


      document.getElementById(
        "historyBillName"
      ).textContent =
        item.name;


      const container =
        document.getElementById(
          "historyList"
        );


      if (payments.length === 0) {

        container.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🧾
            </div>

            <h3>
              No Payments Yet
            </h3>

            <p>
              Payment history will appear here.
            </p>

          </div>

        `;

      } else {

        container.innerHTML =
          payments
            .map(
              payment => `

                <div class="history-item">

                  <div>

                    <strong>
                      ${money(
                        payment.amount
                      )}
                    </strong>

                    <small>
                      ${formatDate(
                        payment.date
                      )}
                    </small>

                  </div>

                  <div>

                    <small>
                      Paid from:
                      ${escapeHtml(
                        getAccountName(
                          payment.accountId
                        )
                      )}
                    </small>

                  </div>

                </div>

              `
            )
            .join("");

      }


      document.getElementById(
        "historyModal"
      ).style.display =
        "flex";

    }


    function closeHistoryModal() {

      document.getElementById(
        "historyModal"
      ).style.display =
        "none";

    }


    /* =========================
       DELETE
    ========================== */

    function deleteRecurring(id) {

      const item =
        walletData.recurringBills
          .find(
            x =>
              x.id === id
          );


      if (!item) {
        return;
      }


      const payments =
        getPayments(id);


      if (payments.length > 0) {

        alert(
          "This recurring payment has payment history. Please keep it for accounting history. You can deactivate it instead."
        );

        return;

      }


      if (
        !confirm(
          `Move "${item.name}" to Trash?`
        )
      ) {

        return;

      }


      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.moveToTrash ===
        "function"
      ) {

        window.TamilandaWallet.moveToTrash(
          "recurringBills",
          item
        );

      } else {

        walletData.trash =
          walletData.trash ||
          [];

        walletData.trash.push({

          id:
            generateId(),

          type:
            "recurringBills",

          originalCollection:
            "recurringBills",

          data:
            item,

          deletedAt:
            new Date().toISOString()

        });

      }


      const index =
        walletData.recurringBills
          .findIndex(
            x =>
              x.id === id
          );


      if (index !== -1) {

        walletData.recurringBills
          .splice(
            index,
            1
          );

      }


      saveData();

      walletData =
        window.TamilandaWallet.getData();


      renderSummary();

      renderRecurring();


      alert(
        "Recurring payment moved to Trash. 🗑️"
      );

    }


    /* =========================
       RENDER
    ========================== */

    function renderRecurring() {

      const container =
        document.getElementById(
          "recurringList"
        );


      const search =
        document.getElementById(
          "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


      const statusFilter =
        document.getElementById(
          "statusFilter"
        ).value;


      const frequencyFilter =
        document.getElementById(
          "frequencyFilter"
        ).value;


      let list =
        [
          ...(walletData.recurringBills || [])
        ];


      list =
        list.filter(item => {

          const overdue =
            isOverdue(item);


          const dueSoon =
            isDueSoon(item);


          if (
            statusFilter ===
            "active" &&
            (
              item.active === false ||
              overdue
            )
          ) {

            return false;

          }


          if (
            statusFilter ===
            "inactive" &&
            item.active !== false
          ) {

            return false;

          }


          if (
            statusFilter ===
            "overdue" &&
            !overdue
          ) {

            return false;

          }


          if (
            statusFilter ===
            "dueSoon" &&
            !dueSoon
          ) {

            return false;

          }


          if (
            frequencyFilter !==
            "all" &&
            item.frequency !==
            frequencyFilter
          ) {

            return false;

          }


          if (!search) {
            return true;
          }


          const searchable =
            [
              item.name,
              item.category,
              item.notes,
              item.frequency
            ]
            .join(" ")
            .toLowerCase();


          return searchable.includes(
            search
          );

        });


      /*
        Sort:
        overdue → due soon → upcoming → inactive
      */

      list.sort(
        (a, b) => {

          const aOverdue =
            isOverdue(a);

          const bOverdue =
            isOverdue(b);


          if (
            aOverdue &&
            !bOverdue
          ) {
            return -1;
          }


          if (
            !aOverdue &&
            bOverdue
          ) {
            return 1;
          }


          if (
            a.active !== false &&
            b.active === false
          ) {
            return -1;
          }


          if (
            a.active === false &&
            b.active !== false
          ) {
            return 1;
          }


          return (
            new Date(
              a.nextDueDate || "9999-12-31"
            ) -
            new Date(
              b.nextDueDate || "9999-12-31"
            )
          );

        }
      );


      if (list.length === 0) {

        container.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🔁
            </div>

            <h3>
              No Recurring Payments
            </h3>

            <p>
              Add rent, bills, subscriptions or other repeated payments.
            </p>

            <button
              class="primary-button"
              onclick="openRecurringForm()"
            >
              + Add Recurring Payment
            </button>

          </div>

        `;

        return;

      }


      container.innerHTML =
        list
          .map(
            renderRecurringCard
          )
          .join("");

    }


    /* =========================
       CARD
    ========================== */

    function renderRecurringCard(item) {

      const amount =
        Number(
          item.amount || 0
        );


      const overdue =
        isOverdue(item);


      const dueSoon =
        isDueSoon(item);


      const active =
        item.active !== false;


      const payments =
        getPayments(
          item.id
        );


      let statusClass =
        "status-success";


      let statusText =
        "ACTIVE";


      if (!active) {

        statusClass =
          "status-muted";

        statusText =
          "INACTIVE";

      } else if (overdue) {

        statusClass =
          "status-danger";

        statusText =
          "OVERDUE";

      } else if (dueSoon) {

        statusClass =
          "status-warning";

        statusText =
          "DUE SOON";

      }


      let dueText =
        "";


      if (
        item.nextDueDate
      ) {

        const days =
          daysUntil(
            item.nextDueDate
          );


        if (overdue) {

          dueText =
            "Overdue";

        } else if (
          days === 0
        ) {

          dueText =
            "Due Today";

        } else if (
          days === 1
        ) {

          dueText =
            "Due Tomorrow";

        } else {

          dueText =
            `Due in ${days} days`;

        }

      }


      return `

        <article class="card recurring-card">

          <!-- HEADER -->

          <div class="recurring-header">

            <div>

              <div class="recurring-title">

                <h3>
                  ${escapeHtml(
                    item.name ||
                    "Unnamed Payment"
                  )}
                </h3>

                <span class="${statusClass}">
                  ${statusText}
                </span>

              </div>


              ${
                item.category
                  ? `
                    <p>
                      🏷️
                      ${escapeHtml(
                        item.category
                      )}
                    </p>
                  `
                  : ""
              }

            </div>


            <div class="recurring-menu">

              <button
                class="icon-button"
                onclick="editRecurring('${item.id}')"
                title="Edit"
              >
                ✏️
              </button>

              <button
                class="icon-button"
                onclick="deleteRecurring('${item.id}')"
                title="Delete"
              >
                🗑️
              </button>

            </div>

          </div>


          <!-- AMOUNT -->

          <div class="amount-display">

            <span>
              Amount
            </span>

            <strong>
              ${money(amount)}
            </strong>

          </div>


          <!-- DETAILS -->

          <div class="details-grid">

            <div>

              <span>
                Frequency
              </span>

              <strong>
                ${frequencyText(
                  item.frequency
                )}
              </strong>

            </div>


            <div>

              <span>
                Next Due
              </span>

              <strong>
                ${formatDate(
                  item.nextDueDate
                )}
              </strong>

            </div>


            <div>

              <span>
                Status
              </span>

              <strong>
                ${dueText || statusText}
              </strong>

            </div>


            <div>

              <span>
                Account
              </span>

              <strong>
                ${escapeHtml(
                  getAccountName(
                    item.accountId
                  )
                )}
              </strong>

            </div>

          </div>


          ${
            item.notes
              ? `
                <div class="note-box">
                  📝
                  ${escapeHtml(
                    item.notes
                  )}
                </div>
              `
              : ""
          }


          <!-- ACTIONS -->

          <div class="recurring-actions">

            ${
              active
                ? `
                  <button
                    class="primary-button"
                    onclick="markAsPaid('${item.id}')"
                  >
                    💳 Mark Paid
                  </button>
                `
                : ""
            }


            <button
              class="secondary-button"
              onclick="openHistory('${item.id}')"
            >
              🧾 History (${payments.length})
            </button>


            <button
              class="secondary-button"
              onclick="toggleActive('${item.id}')"
            >
              ${
                active
                  ? "⏸️ Pause"
                  : "▶️ Activate"
              }
            </button>

          </div>

        </article>

      `;

    }


    /* =========================
       NAVIGATION
    ========================== */

    function goBack() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        goToPage("home");

      }

    }


    function goToPage(page) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.goToPage ===
        "function"
      ) {

        window.TamilandaWallet.goToPage(
          page
        );

        return;

      }


      const pages = {

        home:
          "../index.html",

        transactions:
          "transactions.html",

        buyers:
          "buyers.html",

        accounts:
          "accounts.html",

        more:
          "more.html"

      };


      if (pages[page]) {

        window.location.href =
          pages[page];

      }

    }


    /* =========================
       OUTSIDE MODAL
    ========================== */

    document.addEventListener(
      "click",
      function(event) {

        const modal =
          document.getElementById(
            "historyModal"
          );


        if (
          event.target === modal
        ) {

          closeHistoryModal();

        }

      }
    );

  </script>
