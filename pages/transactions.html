<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transactions - Tamilanda Wallet</title>

  <link
    rel="manifest"
    href="../manifest.json"
  >

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <meta
    name="theme-color"
    content="#09070d"
  >

  <style>

    /* =========================================================
       TRANSACTIONS PAGE
       CLEAN LOCAL UI
       ========================================================= */

    .transactions-page {
      padding-bottom: 90px;
    }


    /* =========================================================
       ADD TRANSACTION BUTTON
       ========================================================= */

    .transaction-page-actions {
      display: flex;
      justify-content: flex-end;
      margin: 14px 0 16px;
    }

    .transaction-add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 44px;

      padding: 10px 17px;

      border-radius: 13px;

      background: linear-gradient(
        135deg,
        #9b6dff,
        #7b4dff
      );

      color: #ffffff;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;

      border: 1px solid rgba(
        255,
        255,
        255,
        0.08
      );

      box-shadow:
        0 10px 25px
        rgba(
          123,
          77,
          255,
          0.18
        );

      white-space: nowrap;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .transaction-add-button:hover {
      filter: brightness(1.06);
    }

    .transaction-add-button:active {
      transform: scale(0.98);
    }


    /* =========================================================
       SEARCH / FILTER AREA
       ========================================================= */

    .transaction-filters {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        150px
        150px;

      gap: 10px;

      padding: 14px;

      margin-bottom: 14px;
    }

    .transaction-filters input,
    .transaction-filters select {
      width: 100% !important;
      min-width: 0 !important;
      margin: 0 !important;
    }


    /* =========================================================
       TRANSACTION LIST
       ========================================================= */

    .transactions-list {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .transaction-card {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 14px 15px;

      border-radius: 15px;

      background: rgba(
        20,
        16,
        28,
        0.95
      );

      border: 1px solid rgba(
        255,
        255,
        255,
        0.07
      );
    }

    .transaction-card-icon {
      width: 42px;
      height: 42px;

      min-width: 42px;

      border-radius: 12px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 19px;

      background:
        rgba(
          123,
          77,
          255,
          0.12
        );
    }

    .transaction-card-main {
      flex: 1;

      min-width: 0;
    }

    .transaction-card-title {
      font-size: 14px;

      font-weight: 800;

      color: #ffffff;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .transaction-card-meta {
      margin-top: 4px;

      font-size: 11px;

      color: rgba(
        255,
        255,
        255,
        0.55
      );

      line-height: 1.45;
    }

    .transaction-card-amount {
      font-size: 14px;

      font-weight: 900;

      white-space: nowrap;
    }

    .transaction-income {
      color: #70e6a4;
    }

    .transaction-expense {
      color: #ff7588;
    }

    .transaction-transfer {
      color: #b79cff;
    }

    .transaction-card-actions {
      display: flex;

      gap: 6px;

      margin-left: 4px;
    }

    .transaction-action-button {
      width: 34px;
      height: 34px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      border: 1px solid rgba(
        255,
        255,
        255,
        0.07
      );

      background:
        rgba(
          255,
          255,
          255,
          0.035
        );

      color: #ffffff;

      cursor: pointer;

      font-size: 14px;
    }

    .transaction-action-button:hover {
      background:
        rgba(
          255,
          255,
          255,
          0.08
        );
    }


    /* =========================================================
       EMPTY STATE
       ========================================================= */

    .transactions-empty {
      padding: 42px 20px;

      text-align: center;

      border-radius: 16px;

      border: 1px dashed rgba(
        255,
        255,
        255,
        0.10
      );

      background:
        rgba(
          18,
          14,
          25,
          0.75
        );
    }

    .transactions-empty-icon {
      font-size: 34px;

      margin-bottom: 8px;
    }

    .transactions-empty-title {
      font-size: 15px;

      font-weight: 800;

      color: #ffffff;
    }

    .transactions-empty-text {
      margin-top: 5px;

      font-size: 12px;

      color: rgba(
        255,
        255,
        255,
        0.55
      );
    }


    /* =========================================================
       MODAL
       ========================================================= */

    .transaction-modal {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 18px;

      background:
        rgba(
          0,
          0,
          0,
          0.68
        );

      backdrop-filter: blur(8px);
    }

    .transaction-modal.show {
      display: flex;
    }

    .transaction-modal-card {
      width: 100%;

      max-width: 470px;

      max-height: 90vh;

      overflow-y: auto;

      padding: 18px;

      border-radius: 18px;

      background:
        #15121d;

      border: 1px solid rgba(
        255,
        255,
        255,
        0.08
      );

      box-shadow:
        0 25px 70px
        rgba(
          0,
          0,
          0,
          0.42
        );
    }

    .transaction-modal-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 16px;
    }

    .transaction-modal-header h2 {
      margin: 0;

      color: #ffffff;

      font-size: 18px;
    }

    .transaction-close {
      width: 36px;
      height: 36px;

      border-radius: 10px;

      border: 1px solid rgba(
        255,
        255,
        255,
        0.08
      );

      background:
        rgba(
          255,
          255,
          255,
          0.04
        );

      color: #ffffff;

      cursor: pointer;

      font-size: 16px;
    }

    .transaction-form-group {
      margin-bottom: 12px;
    }

    .transaction-form-group label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;

      font-weight: 700;

      color: rgba(
        255,
        255,
        255,
        0.75
      );
    }

    .transaction-form-group input,
    .transaction-form-group select,
    .transaction-form-group textarea {
      width: 100%;

      box-sizing: border-box;
    }

    .transaction-form-group textarea {
      min-height: 85px;

      resize: vertical;
    }

    .transaction-transfer-fields {
      display: none;
    }

    .transaction-transfer-fields.show {
      display: block;
    }

    .transaction-form-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 10px;

      margin-top: 16px;
    }

    .transaction-save-button,
    .transaction-cancel-button {
      min-height: 44px;

      border-radius: 12px;

      cursor: pointer;

      font-size: 13px;

      font-weight: 800;
    }

    .transaction-save-button {
      border: 0;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #9b6dff,
          #7b4dff
        );
    }

    .transaction-cancel-button {
      border: 1px solid rgba(
        255,
        255,
        255,
        0.08
      );

      background:
        rgba(
          255,
          255,
          255,
          0.04
        );

      color: #ffffff;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .transaction-page-actions {
        justify-content: stretch;
      }

      .transaction-add-button {
        width: 100%;
      }

      .transaction-filters {
        grid-template-columns: 1fr;

        gap: 10px;
      }

      .transaction-card {
        align-items: flex-start;
      }

      .transaction-card-actions {
        margin-top: 2px;
      }

      .transaction-card-amount {
        font-size: 13px;
      }

    }

    @media (max-width: 480px) {

      .transaction-card {
        gap: 9px;

        padding: 12px;
      }

      .transaction-card-icon {
        width: 38px;
        height: 38px;
        min-width: 38px;

        font-size: 17px;
      }

      .transaction-card-title {
        font-size: 13px;
      }

      .transaction-card-meta {
        font-size: 10px;
      }

      .transaction-action-button {
        width: 31px;
        height: 31px;
      }

    }

  </style>
</head>

<body>

  <div class="transactions-page">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="app-header">

      <div>
        <h1>📒 Transactions</h1>

        <p>
          All your income, expenses, transfers & payments
        </p>
      </div>

    </header>


    <!-- =====================================================
         SUMMARY
         ===================================================== -->

    <section class="summary-grid">

      <div class="summary-card">
        <span>Total Income</span>
        <strong id="totalIncome">₹0.00</strong>
      </div>

      <div class="summary-card">
        <span>Total Expense</span>
        <strong id="totalExpense">₹0.00</strong>
      </div>

      <div class="summary-card">
        <span>Net</span>
        <strong id="netAmount">₹0.00</strong>
      </div>

    </section>


    <!-- =====================================================
         ADD TRANSACTION
         ===================================================== -->

    <section class="transaction-page-actions">

      <button
        type="button"
        class="transaction-add-button"
        onclick="openTransactionModal()"
      >
        ＋ Add Transaction
      </button>

    </section>


    <!-- =====================================================
         SEARCH / FILTER
         ===================================================== -->

    <section class="card transaction-filters">

      <input
        type="search"
        id="transactionSearch"
        class="input"
        placeholder="🔎 Search transactions..."
      >


      <select
        id="transactionTypeFilter"
        class="input"
      >
        <option value="all">
          All Types
        </option>

        <option value="income">
          Income
        </option>

        <option value="expense">
          Expense
        </option>

        <option value="transfer">
          Transfer
        </option>
      </select>


      <select
        id="transactionDateFilter"
        class="input"
      >
        <option value="all">
          All Dates
        </option>

        <option value="today">
          Today
        </option>

        <option value="7days">
          Last 7 Days
        </option>

        <option value="30days">
          Last 30 Days
        </option>
      </select>

    </section>


    <!-- =====================================================
         SECOND FILTER ROW
         ===================================================== -->

    <section class="card transaction-filters">

      <select
        id="transactionAccountFilter"
        class="input"
      >
        <option value="all">
          All Accounts
        </option>
      </select>


      <select
        id="transactionCategoryFilter"
        class="input"
      >
        <option value="all">
          All Categories
        </option>
      </select>

    </section>


    <!-- =====================================================
         COUNT
         ===================================================== -->

    <div
      class="section-title"
      style="
        margin-top:14px;
        margin-bottom:10px;
      "
    >
      <span id="transactionCount">
        0 transactions
      </span>
    </div>


    <!-- =====================================================
         LIST
         ===================================================== -->

    <section
      id="transactionsList"
      class="transactions-list"
    ></section>


    <!-- =====================================================
         ADD TRANSACTION MODAL
         ===================================================== -->

    <div
      id="transactionModal"
      class="transaction-modal"
      onclick="handleModalBackdrop(event)"
    >

      <div class="transaction-modal-card">

        <div class="transaction-modal-header">

          <h2>
            Add Transaction
          </h2>

          <button
            type="button"
            class="transaction-close"
            onclick="closeTransactionModal()"
          >
            ✕
          </button>

        </div>


        <form
          id="transactionForm"
          onsubmit="saveTransaction(event)"
        >

          <!-- TYPE -->

          <div class="transaction-form-group">

            <label>
              Transaction Type
            </label>

            <select
              id="transactionType"
              class="input"
              required
            >

              <option value="income">
                Income
              </option>

              <option value="expense">
                Expense
              </option>

              <option value="transfer">
                Transfer
              </option>

            </select>

          </div>


          <!-- AMOUNT -->

          <div class="transaction-form-group">

            <label>
              Amount
            </label>

            <input
              type="number"
              id="transactionAmount"
              class="input"
              min="0.01"
              step="0.01"
              placeholder="₹ Amount"
              required
            >

          </div>


          <!-- ACCOUNT -->

          <div
            class="transaction-form-group"
            id="singleAccountGroup"
          >

            <label>
              Account
            </label>

            <select
              id="transactionAccount"
              class="input"
              required
            ></select>

          </div>


          <!-- TRANSFER -->

          <div
            id="transferFields"
            class="transaction-transfer-fields"
          >

            <div class="transaction-form-group">

              <label>
                From Account
              </label>

              <select
                id="transferFromAccount"
                class="input"
              ></select>

            </div>


            <div class="transaction-form-group">

              <label>
                To Account
              </label>

              <select
                id="transferToAccount"
                class="input"
              ></select>

            </div>

          </div>


          <!-- CATEGORY -->

          <div
            class="transaction-form-group"
            id="categoryGroup"
          >

            <label>
              Category
            </label>

            <select
              id="transactionCategory"
              class="input"
            ></select>

          </div>


          <!-- DESCRIPTION -->

          <div class="transaction-form-group">

            <label>
              Description
            </label>

            <input
              type="text"
              id="transactionDescription"
              class="input"
              maxlength="150"
              placeholder="Example: Salary, Grocery..."
            >

          </div>


          <!-- DATE -->

          <div class="transaction-form-group">

            <label>
              Date
            </label>

            <input
              type="date"
              id="transactionDate"
              class="input"
              required
            >

          </div>


          <!-- NOTE -->

          <div class="transaction-form-group">

            <label>
              Note
            </label>

            <textarea
              id="transactionNote"
              class="input"
              maxlength="300"
              placeholder="Optional note"
            ></textarea>

          </div>


          <!-- ACTIONS -->

          <div class="transaction-form-actions">

            <button
              type="button"
              class="transaction-cancel-button"
              onclick="closeTransactionModal()"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="transaction-save-button"
            >
              Save Transaction
            </button>

          </div>

        </form>

      </div>

    </div>


    <!-- =====================================================
         BOTTOM NAV
         ===================================================== -->

    <nav class="bottom-nav">

      <button
        class="nav-item"
        data-page="home"
      >
        <span class="nav-icon">
          🏠
        </span>

        <span class="nav-label">
          Home
        </span>
      </button>


      <button
        class="nav-item active"
        data-page="transactions"
      >
        <span class="nav-icon">
          📋
        </span>

        <span class="nav-label">
          Transactions
        </span>
      </button>


      <button
        class="nav-item"
        data-page="buyers"
      >
        <span class="nav-icon">
          👤
        </span>

        <span class="nav-label">
          Buyers
        </span>
      </button>


      <button
        class="nav-item"
        data-page="accounts"
      >
        <span class="nav-icon">
          🏦
        </span>

        <span class="nav-label">
          Accounts
        </span>
      </button>


      <button
        class="nav-item"
        data-page="more"
      >
        <span class="nav-icon">
          ☰
        </span>

        <span class="nav-label">
          More
        </span>
      </button>

    </nav>

  </div>


  <!-- =====================================================
       SHARED APP JS
       ===================================================== -->

  <script src="../js/app.js"></script>


  <script>
    "use strict";


    /* =======================================================
       GLOBAL DATA
       ======================================================= */

    let walletData = null;


    /* =======================================================
       HELPERS
       ======================================================= */

    function getData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.getData ===
          "function"
      ) {

        return window.TamilandaWallet.getData();

      }

      try {

        return JSON.parse(
          localStorage.getItem(
            "tamilanda_wallet_data"
          )
        ) || {};

      } catch (error) {

        return {};

      }

    }


    function saveData() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.save ===
          "function"
      ) {

        return window.TamilandaWallet.save();

      }

      localStorage.setItem(
        "tamilanda_wallet_data",
        JSON.stringify(walletData)
      );

      return true;

    }


    function money(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.formatMoney ===
          "function"
      ) {

        return window.TamilandaWallet.formatMoney(
          Number(value || 0)
        );

      }

      return (
        "₹" +
        Number(value || 0).toLocaleString(
          "en-IN",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
      );

    }


    function today() {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.todayString ===
          "function"
      ) {

        return window.TamilandaWallet.todayString();

      }

      const date = new Date();

      return (
        date.getFullYear() +
        "-" +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          date.getDate()
        ).padStart(2, "0")
      );

    }


    function formatDate(dateString) {

      if (!dateString) {
        return "—";
      }

      const date =
        new Date(
          dateString + "T00:00:00"
        );

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return dateString;

      }

      return date.toLocaleDateString(
        "en-IN",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );

    }


    function escapeHtml(value) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.escapeHtml ===
          "function"
      ) {

        return window.TamilandaWallet.escapeHtml(
          String(value ?? "")
        );

      }

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getAccount(accountId) {

      return (
        walletData.accounts || []
      ).find(
        account =>
          String(account.id) ===
          String(accountId)
      );

    }


    function getAccountName(accountId) {

      const account =
        getAccount(accountId);

      return account
        ? (
            account.name ||
            account.accountName ||
            "Account"
          )
        : "Unknown Account";

    }


    function transactionTypeName(type) {

      const names = {

        income: "Income",

        expense: "Expense",

        transfer: "Transfer",

        buyer_initial_payment:
          "Buyer Initial Payment",

        buyer_payment:
          "Buyer Payment",

        emi_payment:
          "EMI Payment",

        recurring_payment:
          "Recurring Payment",

        money_to_give_payment:
          "Money To Give Payment"

      };

      return names[type] || "Transaction";

    }


    function isIncome(transaction) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.isIncomeTransaction ===
          "function"
      ) {

        return window.TamilandaWallet.isIncomeTransaction(
          transaction
        );

      }

      return (
        transaction.type === "income" ||
        transaction.type === "buyer_payment"
      );

    }


    function isExpense(transaction) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.isExpenseTransaction ===
          "function"
      ) {

        return window.TamilandaWallet.isExpenseTransaction(
          transaction
        );

      }

      return (
        transaction.type === "expense" ||
        transaction.type === "emi_payment" ||
        transaction.type === "recurring_payment" ||
        transaction.type === "money_to_give_payment"
      );

    }


    function isTransfer(transaction) {

      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.isTransferTransaction ===
          "function"
      ) {

        return window.TamilandaWallet.isTransferTransaction(
          transaction
        );

      }

      return (
        transaction.type === "transfer"
      );

    }


    function iconForTransaction(transaction) {

      if (
        isIncome(transaction)
      ) {

        return "💰";

      }

      if (
        isExpense(transaction)
      ) {

        return "💸";

      }

      if (
        isTransfer(transaction)
      ) {

        return "🔄";

      }

      return "📒";

    }


    function amountClass(transaction) {

      if (
        isIncome(transaction)
      ) {

        return "transaction-income";

      }

      if (
        isExpense(transaction)
      ) {

        return "transaction-expense";

      }

      return "transaction-transfer";

    }


    function amountSign(transaction) {

      if (
        isIncome(transaction)
      ) {

        return "+";

      }

      if (
        isExpense(transaction)
      ) {

        return "-";

      }

      return "";

    }


    /* =======================================================
       FILTER OPTIONS
       ======================================================= */

    function populateFilters() {

      const accountFilter =
        document.getElementById(
          "transactionAccountFilter"
        );

      const categoryFilter =
        document.getElementById(
          "transactionCategoryFilter"
        );


      accountFilter.innerHTML =
        `
          <option value="all">
            All Accounts
          </option>
        `;


      (
        walletData.accounts || []
      ).forEach(
        account => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            account.id;

          option.textContent =
            (
              account.name ||
              account.accountName ||
              "Account"
            );

          accountFilter.appendChild(
            option
          );

        }
      );


      const categorySet =
        new Set();


      (
        walletData.transactions || []
      ).forEach(
        transaction => {

          if (
            transaction.category
          ) {

            categorySet.add(
              String(
                transaction.category
              )
            );

          }

        }
      );


      categoryFilter.innerHTML =
        `
          <option value="all">
            All Categories
          </option>
        `;


      Array.from(
        categorySet
      )
        .sort(
          (a, b) =>
            a.localeCompare(b)
        )
        .forEach(
          category => {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              category;

            option.textContent =
              category;

            categoryFilter.appendChild(
              option
            );

          }
        );

    }


    function populateFormAccounts() {

      const singleAccount =
        document.getElementById(
          "transactionAccount"
        );

      const fromAccount =
        document.getElementById(
          "transferFromAccount"
        );

      const toAccount =
        document.getElementById(
          "transferToAccount"
        );


      const accounts =
        walletData.accounts || [];


      const defaultOption =
        `
          <option value="">
            Select account
          </option>
        `;


      singleAccount.innerHTML =
        defaultOption;

      fromAccount.innerHTML =
        defaultOption;

      toAccount.innerHTML =
        defaultOption;


      accounts.forEach(
        account => {

          const label =
            (
              account.name ||
              account.accountName ||
              "Account"
            ) +
            " — " +
            money(
              account.balance || 0
            );


          const option1 =
            document.createElement(
              "option"
            );

          option1.value =
            account.id;

          option1.textContent =
            label;

          singleAccount.appendChild(
            option1
          );


          const option2 =
            document.createElement(
              "option"
            );

          option2.value =
            account.id;

          option2.textContent =
            label;

          fromAccount.appendChild(
            option2
          );


          const option3 =
            document.createElement(
              "option"
            );

          option3.value =
            account.id;

          option3.textContent =
            label;

          toAccount.appendChild(
            option3
          );

        }
      );

    }


    function populateCategories() {

      const categorySelect =
        document.getElementById(
          "transactionCategory"
        );


      const categories = [];


      const incomeCategories =
        walletData.categories &&
        Array.isArray(
          walletData.categories.income
        )
          ? walletData.categories.income
          : [];


      const expenseCategories =
        walletData.categories &&
        Array.isArray(
          walletData.categories.expense
        )
          ? walletData.categories.expense
          : [];


      [
        ...incomeCategories,
        ...expenseCategories
      ].forEach(
        category => {

          const value =
            String(category || "")
              .trim();

          if (
            value &&
            !categories.includes(value)
          ) {

            categories.push(
              value
            );

          }

        }
      );


      categorySelect.innerHTML =
        `
          <option value="">
            Select category
          </option>
        `;


      categories
        .sort(
          (a, b) =>
            a.localeCompare(b)
        )
        .forEach(
          category => {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              category;

            option.textContent =
              category;

            categorySelect.appendChild(
              option
            );

          }
        );

    }


    /* =======================================================
       FILTERING
       ======================================================= */

    function getDateLimit(filter) {

      const now =
        new Date();

      const current =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );


      if (
        filter === "today"
      ) {

        return current;

      }


      if (
        filter === "7days"
      ) {

        const date =
          new Date(current);

        date.setDate(
          date.getDate() - 6
        );

        return date;

      }


      if (
        filter === "30days"
      ) {

        const date =
          new Date(current);

        date.setDate(
          date.getDate() - 29
        );

        return date;

      }


      return null;

    }


    function getFilteredTransactions() {

      const transactions =
        [
          ...(walletData.transactions || [])
        ];


      const search =
        document
          .getElementById(
            "transactionSearch"
          )
          .value
          .trim()
          .toLowerCase();


      const type =
        document
          .getElementById(
            "transactionTypeFilter"
          )
          .value;


      const dateFilter =
        document
          .getElementById(
            "transactionDateFilter"
          )
          .value;


      const accountId =
        document
          .getElementById(
            "transactionAccountFilter"
          )
          .value;


      const category =
        document
          .getElementById(
            "transactionCategoryFilter"
          )
          .value;


      const dateLimit =
        getDateLimit(
          dateFilter
        );


      return transactions.filter(
        transaction => {

          if (
            type !== "all"
          ) {

            if (
              type === "income" &&
              !isIncome(transaction)
            ) {

              return false;

            }

            if (
              type === "expense" &&
              !isExpense(transaction)
            ) {

              return false;

            }

            if (
              type === "transfer" &&
              !isTransfer(transaction)
            ) {

              return false;

            }

          }


          if (
            accountId !== "all"
          ) {

            if (
              String(
                transaction.accountId
              ) !==
              String(accountId)
            ) {

              return false;

            }

          }


          if (
            category !== "all"
          ) {

            if (
              String(
                transaction.category || ""
              ) !==
              String(category)
            ) {

              return false;

            }

          }


          if (
            dateLimit &&
            transaction.date
          ) {

            const transactionDate =
              new Date(
                transaction.date +
                "T00:00:00"
              );

            if (
              transactionDate <
              dateLimit
            ) {

              return false;

            }

          }


          if (
            search
          ) {

            const searchable =
              [
                transaction.description,
                transaction.category,
                transaction.note,
                transactionTypeName(
                  transaction.type
                ),
                getAccountName(
                  transaction.accountId
                )
              ]
                .join(" ")
                .toLowerCase();


            if (
              !searchable.includes(
                search
              )
            ) {

              return false;

            }

          }


          return true;

        }
      )
      .sort(
        (a, b) => {

          const dateDifference =
            new Date(
              b.date ||
              b.createdAt ||
              0
            ) -
            new Date(
              a.date ||
              a.createdAt ||
              0
            );


          if (
            dateDifference !== 0
          ) {

            return dateDifference;

          }


          return (
            new Date(
              b.createdAt ||
              0
            ) -
            new Date(
              a.createdAt ||
              0
            )
          );

        }
      );

    }


    /* =======================================================
       SUMMARY
       ======================================================= */

    function renderSummary() {

      const transactions =
        walletData.transactions ||
        [];


      let income = 0;

      let expense = 0;


      transactions.forEach(
        transaction => {

          if (
            isIncome(transaction)
          ) {

            income +=
              Number(
                transaction.amount || 0
              );

          }


          if (
            isExpense(transaction)
          ) {

            expense +=
              Number(
                transaction.amount || 0
              );

          }

        }
      );


      const net =
        income - expense;


      document.getElementById(
        "totalIncome"
      ).textContent =
        money(income);


      document.getElementById(
        "totalExpense"
      ).textContent =
        money(expense);


      document.getElementById(
        "netAmount"
      ).textContent =
        money(net);

    }


    /* =======================================================
       RENDER LIST
       ======================================================= */

    function renderTransactions() {

      walletData =
        getData();


      const list =
        document.getElementById(
          "transactionsList"
        );


      const transactions =
        getFilteredTransactions();


      document.getElementById(
        "transactionCount"
      ).textContent =
        `${transactions.length} ${
          transactions.length === 1
            ? "transaction"
            : "transactions"
        }`;


      if (
        transactions.length === 0
      ) {

        list.innerHTML =
          `
            <div class="transactions-empty">

              <div class="transactions-empty-icon">
                📒
              </div>

              <div class="transactions-empty-title">
                No transactions found
              </div>

              <div class="transactions-empty-text">
                Try changing your search or filters.
              </div>

            </div>
          `;

        return;

      }


      list.innerHTML =
        transactions
          .map(
            transaction => {

              const title =
                transaction.description ||
                transaction.category ||
                transactionTypeName(
                  transaction.type
                );


              const accountName =
                getAccountName(
                  transaction.accountId
                );


              const typeLabel =
                transactionTypeName(
                  transaction.type
                );


              const sign =
                amountSign(
                  transaction
                );


              const amount =
                money(
                  transaction.amount
                );


              return `
                <article
                  class="transaction-card"
                >

                  <div
                    class="transaction-card-icon"
                  >
                    ${iconForTransaction(
                      transaction
                    )}
                  </div>


                  <div
                    class="transaction-card-main"
                  >

                    <div
                      class="transaction-card-title"
                      title="${escapeHtml(title)}"
                    >
                      ${escapeHtml(title)}
                    </div>


                    <div
                      class="transaction-card-meta"
                    >
                      ${escapeHtml(
                        typeLabel
                      )}

                      •
                      ${escapeHtml(
                        accountName
                      )}

                      •
                      ${escapeHtml(
                        formatDate(
                          transaction.date
                        )
                      )}
                    </div>

                  </div>


                  <div
                    class="
                      transaction-card-amount
                      ${amountClass(
                        transaction
                      )}
                    "
                  >
                    ${sign}${escapeHtml(
                      amount
                    )}
                  </div>


                  <div
                    class="
                      transaction-card-actions
                    "
                  >

                    <button
                      type="button"
                      class="transaction-action-button"
                      title="Delete"
                      onclick="deleteTransaction('${escapeHtml(
                        transaction.id
                      )}')"
                    >
                      🗑️
                    </button>

                  </div>

                </article>
              `;

            }
          )
          .join("");

    }


    /* =======================================================
       DELETE
       ======================================================= */

    function deleteTransaction(id) {

      walletData =
        getData();


      const transaction =
        (
          walletData.transactions ||
          []
        ).find(
          item =>
            String(item.id) ===
            String(id)
        );


      if (!transaction) {

        alert(
          "Transaction not found."
        );

        return;

      }


      const title =
        transaction.description ||
        transaction.category ||
        "this transaction";


      if (
        !confirm(
          `Move "${title}" to Trash?`
        )
      ) {

        return;

      }


      /*
        Special linked payments should stay
        protected and be managed from their
        source page.
      */

      const protectedTypes = [
        "buyer_initial_payment",
        "buyer_payment",
        "emi_payment",
        "recurring_payment",
        "money_to_give_payment"
      ];


      if (
        protectedTypes.includes(
          transaction.type
        )
      ) {

        alert(
          "This linked payment should be managed from its original section."
        );

        return;

      }


      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.deleteRecord ===
          "function"
      ) {

        window.TamilandaWallet.deleteRecord(
          "transactions",
          id
        );

      } else {

        walletData.transactions =
          (
            walletData.transactions ||
            []
          ).filter(
            item =>
              String(item.id) !==
              String(id)
          );

        saveData();

      }


      walletData =
        getData();


      renderSummary();

      populateFilters();

      renderTransactions();

    }


    /* =======================================================
       MODAL
       ======================================================= */

    function openTransactionModal() {

      walletData =
        getData();


      document.getElementById(
        "transactionModal"
      ).classList.add("show");


      document.getElementById(
        "transactionForm"
      ).reset();


      document.getElementById(
        "transactionDate"
      ).value =
        today();


      populateFormAccounts();

      populateCategories();

      updateTransactionTypeUI();


      setTimeout(
        () => {

          document.getElementById(
            "transactionAmount"
          ).focus();

        },
        50
      );

    }


    function closeTransactionModal() {

      document.getElementById(
        "transactionModal"
      ).classList.remove("show");

    }


    function handleModalBackdrop(
      event
    ) {

      if (
        event.target.id ===
        "transactionModal"
      ) {

        closeTransactionModal();

      }

    }


    /* =======================================================
       TYPE SWITCH
       ======================================================= */

    function updateTransactionTypeUI() {

      const type =
        document.getElementById(
          "transactionType"
        ).value;


      const singleAccountGroup =
        document.getElementById(
          "singleAccountGroup"
        );


      const transferFields =
        document.getElementById(
          "transferFields"
        );


      const categoryGroup =
        document.getElementById(
          "categoryGroup"
        );


      const singleAccount =
        document.getElementById(
          "transactionAccount"
        );


      const fromAccount =
        document.getElementById(
          "transferFromAccount"
        );


      const toAccount =
        document.getElementById(
          "transferToAccount"
        );


      if (
        type === "transfer"
      ) {

        singleAccountGroup.style.display =
          "none";

        transferFields.classList.add(
          "show"
        );

        categoryGroup.style.display =
          "none";

        singleAccount.required =
          false;

        fromAccount.required =
          true;

        toAccount.required =
          true;

      } else {

        singleAccountGroup.style.display =
          "block";

        transferFields.classList.remove(
          "show"
        );

        categoryGroup.style.display =
          "block";

        singleAccount.required =
          true;

        fromAccount.required =
          false;

        toAccount.required =
          false;

      }

    }


    /* =======================================================
       SAVE TRANSACTION
       ======================================================= */

    function saveTransaction(
      event
    ) {

      event.preventDefault();


      walletData =
        getData();


      const type =
        document.getElementById(
          "transactionType"
        ).value;


      const amount =
        Number(
          document.getElementById(
            "transactionAmount"
          ).value
        );


      const description =
        document.getElementById(
          "transactionDescription"
        ).value.trim();


      const date =
        document.getElementById(
          "transactionDate"
        ).value ||
        today();


      const note =
        document.getElementById(
          "transactionNote"
        ).value.trim();


      if (
        !Number.isFinite(amount) ||
        amount <= 0
      ) {

        alert(
          "Please enter a valid amount."
        );

        return;

      }


      /* =====================================================
         TRANSFER
         ===================================================== */

      if (
        type === "transfer"
      ) {

        const fromAccountId =
          document.getElementById(
            "transferFromAccount"
          ).value;


        const toAccountId =
          document.getElementById(
            "transferToAccount"
          ).value;


        if (
          !fromAccountId ||
          !toAccountId
        ) {

          alert(
            "Please select both accounts."
          );

          return;

        }


        if (
          String(fromAccountId) ===
          String(toAccountId)
        ) {

          alert(
            "From Account and To Account cannot be the same."
          );

          return;

        }


        const fromAccount =
          getAccount(
            fromAccountId
          );


        if (!fromAccount) {

          alert(
            "From account not found."
          );

          return;

        }


        const currentBalance =
          Number(
            fromAccount.balance || 0
          );


        if (
          amount >
          currentBalance
        ) {

          alert(
            "Insufficient balance in the selected account."
          );

          return;

        }


        if (
          window.TamilandaWallet &&
          typeof window.TamilandaWallet.transferBetweenAccounts ===
            "function"
        ) {

          const result =
            window.TamilandaWallet.transferBetweenAccounts(
              fromAccountId,
              toAccountId,
              amount,
              note || description,
              date
            );


          if (!result) {

            alert(
              "Transfer could not be completed."
            );

            return;

          }

        } else {

          alert(
            "Transfer function is unavailable."
          );

          return;

        }


        closeTransactionModal();


        walletData =
          getData();


        renderSummary();

        populateFilters();

        renderTransactions();


        alert(
          "Transfer completed successfully. ✅"
        );


        return;

      }


      /* =====================================================
         NORMAL INCOME / EXPENSE
         ===================================================== */

      const accountId =
        document.getElementById(
          "transactionAccount"
        ).value;


      const category =
        document.getElementById(
          "transactionCategory"
        ).value;


      if (!accountId) {

        alert(
          "Please select an account."
        );

        return;

      }


      const transaction = {

        type,

        amount,

        accountId,

        category,

        description:
          description ||
          category ||
          (
            type === "income"
              ? "Income"
              : "Expense"
          ),

        note,

        date

      };


      if (
        window.TamilandaWallet &&
        typeof window.TamilandaWallet.addTransaction ===
          "function"
      ) {

        const result =
          window.TamilandaWallet.addTransaction(
            transaction
          );


        if (!result) {

          alert(
            type === "expense"
              ? "Expense could not be added. Please check the selected account balance."
              : "Income could not be added."
          );

          return;

        }

      } else {

        alert(
          "Transaction function is unavailable."
        );

        return;

      }


      closeTransactionModal();


      walletData =
        getData();


      renderSummary();

      populateFilters();

      renderTransactions();


      alert(
        type === "income"
          ? "Income added successfully. ✅"
          : "Expense added successfully. ✅"
      );

    }


    /* =======================================================
       FILTER EVENTS
       ======================================================= */

    [
      "transactionSearch",
      "transactionTypeFilter",
      "transactionDateFilter",
      "transactionAccountFilter",
      "transactionCategoryFilter"
    ]
      .forEach(
        id => {

          const element =
            document.getElementById(
              id
            );


          if (!element) {
            return;
          }


          element.addEventListener(
            "input",
            renderTransactions
          );


          element.addEventListener(
            "change",
            renderTransactions
          );

        }
      );


    document.getElementById(
      "transactionType"
    ).addEventListener(
      "change",
      updateTransactionTypeUI
    );


    /* =======================================================
       ESCAPE TO CLOSE MODAL
       ======================================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeTransactionModal();

        }

      }
    );


    /* =======================================================
       BOTTOM NAV
       ======================================================= */

    document
      .querySelectorAll(
        ".bottom-nav .nav-item"
      )
      .forEach(
        item => {

          item.addEventListener(
            "click",
            () => {

              const page =
                item.dataset.page;


              if (
                window.TamilandaWallet &&
                typeof window.TamilandaWallet.goToPage ===
                  "function"
              ) {

                window.TamilandaWallet.goToPage(
                  page
                );

                return;

              }


              if (
                page === "home"
              ) {

                window.location.href =
                  "../index.html";

                return;

              }


              if (
                page === "transactions"
              ) {

                window.location.href =
                  "./transactions.html";

                return;

              }


              if (
                page === "buyers"
              ) {

                window.location.href =
                  "./buyers.html";

                return;

              }


              if (
                page === "accounts"
              ) {

                window.location.href =
                  "./accounts.html";

                return;

              }


              if (
                page === "more"
              ) {

                window.location.href =
                  "./more.html";

              }

            }
          );

        }
      );


    /* =======================================================
       STORAGE UPDATE
       ======================================================= */

    window.addEventListener(
      "storage",
      event => {

        if (
          event.key ===
          "tamilanda_wallet_data"
        ) {

          walletData =
            getData();

          renderSummary();

          populateFilters();

          renderTransactions();

        }

      }
    );


    /* =======================================================
       INITIALIZE
       ======================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        walletData =
          getData();


        populateFilters();

        populateFormAccounts();

        populateCategories();

        renderSummary();

        renderTransactions();

        updateTransactionTypeUI();

      }
    );

  </script>

</body>
</html>
