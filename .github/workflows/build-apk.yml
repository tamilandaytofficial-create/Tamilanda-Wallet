name: Build Tamilanda Wallet APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      PWA_MANIFEST_URL: https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/manifest.json
      PWA_HOST: tamilandaytofficial-create.github.io

      APP_NAME: Tamilanda Wallet
      LAUNCHER_NAME: Tamilanda
      PACKAGE_ID: com.tamilanda.wallet
      KEY_ALIAS: tamilanda

    steps:

      # =======================================================
      # 1) CHECKOUT
      # =======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================================
      # 2) JAVA 17
      # =======================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =======================================================
      # 3) NODE 20
      # =======================================================

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =======================================================
      # 4) ANDROID SDK
      # =======================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo "===== NODE ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== PATHS ====="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$JAVA_HOME/bin/keytool"


      # =======================================================
      # 5) INSTALL BUBBLEWRAP
      # =======================================================

      - name: Install Bubblewrap 1.24.1
        shell: bash
        run: |
          set -e

          npm install --global @bubblewrap/cli@1.24.1

          bubblewrap --version


      # =======================================================
      # 6) CONFIGURE BUBBLEWRAP BEFORE FIRST COMMAND
      #
      # IMPORTANT:
      # This prevents Bubblewrap from asking:
      #
      # "Do you want Bubblewrap to install the JDK?"
      #
      # which caused the previous GitHub Actions failure.
      # =======================================================

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "jdkPath": os.environ["JAVA_HOME"],
              "androidSdkPath": os.environ["ANDROID_HOME"]
          }

          path = Path.home() / ".bubblewrap" / "config.json"

          path.write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Bubblewrap config created:")
          print(path.read_text())
          PY

          bubblewrap doctor


      # =======================================================
      # 7) CREATE TEMPORARY SIGNING PASSWORDS
      #
      # These are generated during the build and are not stored
      # in the repository.
      # =======================================================

      - name: Create temporary signing credentials
        shell: bash
        run: |
          set -e

          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"

          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"


      # =======================================================
      # 8) INITIALIZE BUBBLEWRAP PROJECT
      #
      # Bubblewrap init is interactive, so Expect answers the
      # documented prompts automatically.
      # =======================================================

      - name: Initialize Android TWA project
        shell: bash
        run: |
          set -e

          rm -rf android-build

          mkdir -p android-build

          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

          cat > /tmp/tamilanda-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1800

          set manifest_url $env(PWA_MANIFEST_URL)
          set output_dir "$env(GITHUB_WORKSPACE)/android-build"

          spawn bubblewrap init \
            --manifest="$manifest_url" \
            --directory="$output_dir"

          expect {

            # =================================================
            # STEP 1 — WEB APP
            # =================================================

            -re "(?i)host.*:" {
              send -- "$env(PWA_HOST)\r"
              exp_continue
            }

            -re "(?i)start.?url.*:" {
              send -- "./index.html\r"
              exp_continue
            }


            # =================================================
            # STEP 2 — ANDROID APP
            # =================================================

            -re "(?i)launcher name.*:" {
              send -- "$env(LAUNCHER_NAME)\r"
              exp_continue
            }

            -re "(?i)name.*:" {
              send -- "$env(APP_NAME)\r"
              exp_continue
            }

            -re "(?i)package id.*:" {
              send -- "$env(PACKAGE_ID)\r"
              exp_continue
            }

            -re "(?i)version code.*:" {
              send -- "1\r"
              exp_continue
            }

            -re "(?i)display mode" {
              # Keep manifest default: standalone
              send -- "\r"
              exp_continue
            }

            -re "(?i)orientation" {
              # Keep manifest default: portrait
              send -- "\r"
              exp_continue
            }

            -re "(?i)theme color.*:" {
              send -- "#09070d\r"
              exp_continue
            }


            # =================================================
            # STEP 3 — ICON / SPLASH
            # =================================================

            -re "(?i)background color.*:" {
              send -- "#09070d\r"
              exp_continue
            }

            -re "(?i)icon url.*:" {
              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)maskable icon url.*:" {
              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)monochrome icon url.*:" {
              send -- "\r"
              exp_continue
            }


            # =================================================
            # STEP 4 — OPTIONAL FEATURES
            # =================================================

            -re "(?i)play billing.*" {
              send -- "n\r"
              exp_continue
            }

            -re "(?i)location delegation.*" {
              send -- "n\r"
              exp_continue
            }


            # =================================================
            # STEP 5 — SIGNING KEY
            # =================================================

            -re "(?i)key path.*:" {
              send -- "./android-keystore\r"
              exp_continue
            }

            -re "(?i)key alias.*:" {
              send -- "$env(KEY_ALIAS)\r"
              exp_continue
            }

            -re "(?i)full name.*:" {
              send -- "Tamilanda Wallet\r"
              exp_continue
            }

            -re "(?i)organizational unit.*:" {
              send -- "Personal\r"
              exp_continue
            }

            -re "(?i)organization.*:" {
              send -- "Tamilanda\r"
              exp_continue
            }

            -re "(?i)country.*:" {
              send -- "IN\r"
              exp_continue
            }

            -re "(?i)keystore password.*:" {
              send -- "$env(KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -re "(?i)key password.*:" {
              send -- "$env(KEY_PASSWORD)\r"
              exp_continue
            }


            # =================================================
            # FINISH
            # =================================================

            eof {
              catch wait result

              exit [lindex $result 3]
            }

            timeout {
              puts stderr "Bubblewrap initialization timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/tamilanda-init.exp

          /tmp/tamilanda-init.exp

          echo ""
          echo "===== VERIFY GENERATED PROJECT ====="

          test -f android-build/twa-manifest.json
          test -f android-build/manifest-checksum.txt
          test -f android-build/gradlew
          test -f android-build/android-keystore

          echo "TWA project generated successfully."


      # =======================================================
      # 9) BUILD APK + AAB
      # =======================================================

      - name: Build signed APK and AAB
        working-directory: android-build
        shell: bash
        run: |
          set -e

          bubblewrap build \
            --manifest="./twa-manifest.json" \
            --skipPwaValidation \
            --signingKeyPath="./android-keystore" \
            --signingKeyAlias="$KEY_ALIAS"

          echo ""
          echo "============================================"
          echo "        TAMILANDA WALLET APK BUILT"
          echo "============================================"

          test -f app-release-signed.apk
          test -f app-release-bundle.aab

          ls -lh \
            app-release-signed.apk \
            app-release-bundle.aab


      # =======================================================
      # 10) DIGITAL ASSET LINKS
      # =======================================================

      - name: Create assetlinks.json
        working-directory: android-build
        shell: bash
        run: |
          set -e

          SHA256=$(
            keytool \
              -list \
              -v \
              -keystore "./android-keystore" \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" |
            awk -F': ' '/SHA256:/ {print $2; exit}' |
            tr -d ':'
          )

          test -n "$SHA256"

          mkdir -p assetlinks

          cat > assetlinks/assetlinks.json <<EOF
          [
            {
              "relation": [
                "delegate_permission/common.handle_all_urls"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "$PACKAGE_ID",
                "sha256_cert_fingerprints": [
                  "$SHA256"
                ]
              }
            }
          ]
          EOF

          cat assetlinks/assetlinks.json


      # =======================================================
      # 11) APK ARTIFACT
      # =======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-apk
          path: android-build/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30


      # =======================================================
      # 12) AAB ARTIFACT
      # =======================================================

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-aab
          path: android-build/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30


      # =======================================================
      # 13) ASSET LINKS ARTIFACT
      # =======================================================

      - name: Upload assetlinks
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-assetlinks
          path: android-build/assetlinks/assetlinks.json
          if-no-files-found: error
          retention-days: 30  
