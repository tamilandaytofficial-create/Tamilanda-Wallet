name: Build Tamilanda Wallet APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  build-apk:

    name: Build Tamilanda Wallet APK

    runs-on: ubuntu-latest


    env:

      APP_NAME: Tamilanda Wallet
      LAUNCHER_NAME: Tamilanda
      PACKAGE_ID: com.tamilanda.wallet
      KEY_ALIAS: tamilanda

      PWA_MANIFEST_URL: https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/manifest.json
      PWA_HOST: tamilandaytofficial-create.github.io
      PWA_START_URL: ./index.html


    steps:


      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # 2. JAVA 17
      # ======================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # 3. NODE 20
      # ======================================================

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"


      # ======================================================
      # 4. ANDROID SDK
      # ======================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |

          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"


      # ======================================================
      # 5. VERIFY ENVIRONMENT
      # ======================================================

      - name: Verify environment
        shell: bash
        run: |

          set -e

          echo "================================"
          echo "JAVA"
          echo "================================"

          java -version


          echo "================================"
          echo "NODE"
          echo "================================"

          node --version


          echo "================================"
          echo "NPM"
          echo "================================"

          npm --version


          echo "================================"
          echo "JAVA HOME"
          echo "================================"

          echo "$JAVA_HOME"


          echo "================================"
          echo "ANDROID HOME"
          echo "================================"

          echo "$ANDROID_HOME"


          test -x "$JAVA_HOME/bin/java"

          test -x "$JAVA_HOME/bin/keytool"

          test -d "$ANDROID_HOME/platforms/android-35"

          test -d "$ANDROID_HOME/platforms/android-36"

          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -d "$ANDROID_HOME/build-tools/36.0.0"


      # ======================================================
      # 6. INSTALL BUBBLEWRAP
      #
      # --ignore-scripts prevents Bubblewrap's npm install
      # lifecycle from starting its first-run JDK installer.
      # ======================================================

      - name: Install Bubblewrap 1.25.0
        shell: bash
        run: |

          set -e

          npm install \
            --global \
            --ignore-scripts \
            @bubblewrap/cli@1.25.0

          which bubblewrap

          bubblewrap --version


      # ======================================================
      # 7. CREATE BUBBLEWRAP CONFIG
      #
      # This must exist before bubblewrap init/doctor/build.
      # ======================================================

      - name: Configure Bubblewrap
        shell: bash
        run: |

          set -e

          mkdir -p "$HOME/.bubblewrap"


          python3 - <<'PY'

          import json
          import os
          from pathlib import Path


          config = {
              "jdkPath": os.environ["JAVA_HOME"],
              "androidSdkPath": os.environ["ANDROID_HOME"]
          }


          path = (
              Path.home()
              / ".bubblewrap"
              / "config.json"
          )


          path.write_text(
              json.dumps(
                  config,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          print(
              "Bubblewrap configuration:"
          )

          print(
              path.read_text(
                  encoding="utf-8"
              )
          )

          PY


      # ======================================================
      # 8. VERIFY BUBBLEWRAP
      # ======================================================

      - name: Verify Bubblewrap
        shell: bash
        run: |

          set -e

          bubblewrap doctor


      # ======================================================
      # 9. CREATE TEMPORARY SIGNING KEY
      #
      # This is for APK testing.
      #
      # Do NOT use an ephemeral key for a Play Store release.
      # A permanent release keystore must be preserved later.
      # ======================================================

      - name: Create signing key
        shell: bash
        run: |

          set -e

          mkdir -p "$GITHUB_WORKSPACE/android"


          KEYSTORE_PASSWORD="$(
            openssl rand -hex 24
          )"


          KEY_PASSWORD="$(
            openssl rand -hex 24
          )"


          echo "::add-mask::$KEYSTORE_PASSWORD"

          echo "::add-mask::$KEY_PASSWORD"


          echo \
            "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" \
            >> "$GITHUB_ENV"


          echo \
            "KEY_PASSWORD=$KEY_PASSWORD" \
            >> "$GITHUB_ENV"


          keytool \
            -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/android/android-keystore" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tamilanda Wallet, OU=Personal, O=Tamilanda, C=IN"


          test \
            -f "$GITHUB_WORKSPACE/android/android-keystore"


      # ======================================================
      # 10. INSTALL EXPECT
      # ======================================================

      - name: Install Expect
        shell: bash
        run: |

          set -e

          sudo apt-get update -qq

          sudo apt-get install \
            -y \
            -qq \
            expect


      # ======================================================
      # 11. INITIALIZE TWA PROJECT
      #
      # Bubblewrap init is interactive.
      # Expect answers the prompts automatically.
      # ======================================================

      - name: Initialize Bubblewrap Android project
        shell: bash
        run: |

          set -e


          rm -rf \
            "$GITHUB_WORKSPACE/android/twa"


          mkdir -p \
            "$GITHUB_WORKSPACE/android/twa"


          cat > /tmp/tamilanda-bubblewrap-init.exp <<'EXPECT'

          #!/usr/bin/expect -f

          set timeout 1800


          set manifest_url \
            $env(PWA_MANIFEST_URL)


          set output_dir \
            "$env(GITHUB_WORKSPACE)/android/twa"


          spawn bubblewrap init \
            --manifest="$manifest_url" \
            --directory="$output_dir"


          expect {

            # ==============================================
            # WEB APP
            # ==============================================

            -re "(?i)host.*:" {

              send -- "$env(PWA_HOST)\r"

              exp_continue
            }


            -re "(?i)start.?url.*:" {

              send -- "$env(PWA_START_URL)\r"

              exp_continue
            }


            # ==============================================
            # APP IDENTITY
            # ==============================================

            -re "(?i)launcher name.*:" {

              send -- "$env(LAUNCHER_NAME)\r"

              exp_continue
            }


            -re "(?i)package id.*:" {

              send -- "$env(PACKAGE_ID)\r"

              exp_continue
            }


            -re "(?i)version code.*:" {

              send -- "1\r"

              exp_continue
            }


            -re "(?i)(app )?name.*:" {

              send -- "$env(APP_NAME)\r"

              exp_continue
            }


            # ==============================================
            # DISPLAY
            # ==============================================

            -re "(?i)display mode.*" {

              send -- "\r"

              exp_continue
            }


            -re "(?i)orientation.*" {

              send -- "\r"

              exp_continue
            }


            # ==============================================
            # COLORS
            # ==============================================

            -re "(?i)theme color.*:" {

              send -- "#09070d\r"

              exp_continue
            }


            -re "(?i)background color.*:" {

              send -- "#09070d\r"

              exp_continue
            }


            # ==============================================
            # ICONS
            # ==============================================

            -re "(?i)maskable icon url.*:" {

              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"

              exp_continue
            }


            -re "(?i)icon url.*:" {

              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"

              exp_continue
            }


            -re "(?i)monochrome icon url.*:" {

              send -- "\r"

              exp_continue
            }


            # ==============================================
            # OPTIONAL FEATURES
            # ==============================================

            -re "(?i)shortcuts.*" {

              send -- "\r"

              exp_continue
            }


            -re "(?i)play billing.*" {

              send -- "n\r"

              exp_continue
            }


            -re "(?i)location delegation.*" {

              send -- "n\r"

              exp_continue
            }


            # ==============================================
            # SIGNING
            # ==============================================

            -re "(?i)key path.*:" {

              send -- "../android-keystore\r"

              exp_continue
            }


            -re "(?i)key alias.*:" {

              send -- "$env(KEY_ALIAS)\r"

              exp_continue
            }


            -re "(?i)full name.*:" {

              send -- "Tamilanda Wallet\r"

              exp_continue
            }


            -re "(?i)organizational unit.*:" {

              send -- "Personal\r"

              exp_continue
            }


            -re "(?i)organization.*:" {

              send -- "Tamilanda\r"

              exp_continue
            }


            -re "(?i)country.*:" {

              send -- "IN\r"

              exp_continue
            }


            -re "(?i)keystore password.*:" {

              send -- "$env(KEYSTORE_PASSWORD)\r"

              exp_continue
            }


            -re "(?i)key password.*:" {

              send -- "$env(KEY_PASSWORD)\r"

              exp_continue
            }


            # ==============================================
            # FINISH
            # ==============================================

            eof {

              catch wait result

              exit [lindex $result 3]
            }


            timeout {

              puts stderr \
                "Bubblewrap initialization timed out."

              exit 1
            }


            default {

              send -- "\r"

              exp_continue
            }

          }

          EXPECT


          chmod +x \
            /tmp/tamilanda-bubblewrap-init.exp


          /tmp/tamilanda-bubblewrap-init.exp


          echo ""
          echo "========================================="
          echo "TWA PROJECT CREATED"
          echo "========================================="


          test \
            -f \
            "$GITHUB_WORKSPACE/android/twa/twa-manifest.json"


          test \
            -f \
            "$GITHUB_WORKSPACE/android/twa/gradlew"


          test \
            -f \
            "$GITHUB_WORKSPACE/android/android-keystore"


      # ======================================================
      # 12. FORCE WALLET SETTINGS
      # ======================================================

      - name: Configure TWA manifest
        working-directory: android/twa
        shell: bash
        run: |

          set -e


          python3 - <<'PY'

          import json
          from pathlib import Path


          path = Path(
              "twa-manifest.json"
          )


          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )


          data["host"] = \
              "tamilandaytofficial-create.github.io"


          data["startUrl"] = \
              "./index.html"


          data["name"] = \
              "Tamilanda Wallet"


          data["launcherName"] = \
              "Tamilanda"


          data["packageId"] = \
              "com.tamilanda.wallet"


          data["appVersionCode"] = 1


          data["appVersionName"] = \
              "1.0.0"


          data["display"] = \
              "standalone"


          data["orientation"] = \
              "portrait"


          data["themeColor"] = \
              "#09070d"


          data["backgroundColor"] = \
              "#09070d"


          data["signingKey"]["path"] = \
              "../android-keystore"


          data["signingKey"]["alias"] = \
              "tamilanda"


          path.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          print(
              path.read_text(
                  encoding="utf-8"
              )
          )

          PY


      # ======================================================
      # 13. BUILD APK + AAB
      # ======================================================

      - name: Build signed APK and AAB
        working-directory: android/twa
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |

          set -e


          bubblewrap build \
            --manifest="./twa-manifest.json" \
            --skipPwaValidation \
            --signingKeyPath="../android-keystore" \
            --signingKeyAlias="$KEY_ALIAS"


          echo ""
          echo "============================================"
          echo "       TAMILANDA WALLET APK BUILT"
          echo "============================================"


          test \
            -f \
            "app-release-signed.apk"


          test \
            -f \
            "app-release-bundle.aab"


          echo ""

          echo "APK:"
          ls -lh \
            app-release-signed.apk


          echo ""

          echo "AAB:"
          ls -lh \
            app-release-bundle.aab


      # ======================================================
      # 14. DIGITAL ASSET LINKS
      # ======================================================

      - name: Generate assetlinks.json
        working-directory: android/twa
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
        run: |

          set -e


          SHA256=$(
            keytool \
              -list \
              -v \
              -keystore "../android-keystore" \
              -alias "$KEY_ALIAS" \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" |
            awk -F': ' \
              '/SHA256:/ {print $2; exit}' |
            tr -d ':'
          )


          test \
            -n "$SHA256"


          mkdir -p \
            assetlinks


          cat > assetlinks/assetlinks.json <<EOF

          [
            {
              "relation": [
                "delegate_permission/common.handle_all_urls"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "$PACKAGE_ID",
                "sha256_cert_fingerprints": [
                  "$SHA256"
                ]
              }
            }
          ]

          EOF


          cat \
            assetlinks/assetlinks.json


      # ======================================================
      # 15. APK ARTIFACT
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-apk
          path: android/twa/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30


      # ======================================================
      # 16. AAB ARTIFACT
      # ======================================================

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-aab
          path: android/twa/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30


      # ======================================================
      # 17. ASSETLINKS ARTIFACT
      # ======================================================

      - name: Upload assetlinks
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-assetlinks
          path: android/twa/assetlinks/assetlinks.json
          if-no-files-found: error
          retention-days: 30
