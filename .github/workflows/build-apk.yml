name: Build Tamilanda Wallet APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      PWA_MANIFEST_URL: https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/manifest.json
      PWA_HOST: tamilandaytofficial-create.github.io
      PWA_START_URL: ./index.html

      PACKAGE_ID: com.tamilanda.wallet
      APP_NAME: Tamilanda Wallet
      LAUNCHER_NAME: Tamilanda
      KEY_ALIAS: tamilanda

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # Java 17
      # -------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # -------------------------------------------------------
      # Android SDK
      # -------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Java and Android SDK
        shell: bash
        run: |
          set -e

          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || true
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      # -------------------------------------------------------
      # Bubblewrap
      #
      # IMPORTANT:
      # Bubblewrap asks interactively for JDK/SDK on its first
      # run. The previous workflow failed there because the
      # config was created AFTER "bubblewrap --version".
      #
      # We create ~/.bubblewrap/config.json BEFORE calling any
      # Bubblewrap command.
      # -------------------------------------------------------
      - name: Install Bubblewrap
        run: |
          npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap before first command
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "jdkPath": os.environ["JAVA_HOME"],
              "androidSdkPath": os.environ["ANDROID_HOME"],
          }

          path = Path.home() / ".bubblewrap" / "config.json"
          path.write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8"
          )

          print(path)
          print(path.read_text())
          PY

          bubblewrap --version

      # -------------------------------------------------------
      # Temporary CI signing key
      #
      # This key is for this test build only.
      # For permanent releases, use a persistent keystore via
      # GitHub Secrets / protected storage.
      # -------------------------------------------------------
      - name: Create CI signing key
        shell: bash
        run: |
          set -e

          mkdir -p android

          if [ -n "${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}" ]; then
            KEYSTORE_PASSWORD="${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          fi

          if [ -n "${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}" ]; then
            KEY_PASSWORD="${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}"
          else
            KEY_PASSWORD="$(openssl rand -hex 24)"
          fi

          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          keytool \
            -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/android/android-keystore" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tamilanda Wallet, OU=Personal, O=Tamilanda, C=IN"

          test -f "$GITHUB_WORKSPACE/android/android-keystore"

      # -------------------------------------------------------
      # Initialize TWA project.
      #
      # Bubblewrap's init command is interactive. We answer the
      # prompts explicitly so the GitHub runner never waits for
      # input.
      # -------------------------------------------------------
      - name: Initialize Bubblewrap project
        shell: bash
        run: |
          set -e

          rm -rf android/twa-project
          mkdir -p android/twa-project

          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

          cat > /tmp/init-bubblewrap.expect <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1200

          set manifest $env(PWA_MANIFEST_URL)
          set output_dir "$env(GITHUB_WORKSPACE)/android/twa-project"

          spawn bubblewrap init --manifest=$manifest --directory=$output_dir

          expect {
            -re "(?i)host.*:" {
              send -- "$env(PWA_HOST)\r"
              exp_continue
            }

            -re "(?i)start.?url.*:" {
              send -- "$env(PWA_START_URL)\r"
              exp_continue
            }

            -re "(?i)name.*:" {
              send -- "$env(APP_NAME)\r"
              exp_continue
            }

            -re "(?i)launcher name.*:" {
              send -- "$env(LAUNCHER_NAME)\r"
              exp_continue
            }

            -re "(?i)package id.*:" {
              send -- "$env(PACKAGE_ID)\r"
              exp_continue
            }

            -re "(?i)version code.*:" {
              send -- "1\r"
              exp_continue
            }

            -re "(?i)display mode" {
              send -- "\r"
              exp_continue
            }

            -re "(?i)orientation" {
              send -- "\r"
              exp_continue
            }

            -re "(?i)theme color.*:" {
              send -- "#09070d\r"
              exp_continue
            }

            -re "(?i)background color.*:" {
              send -- "#09070d\r"
              exp_continue
            }

            -re "(?i)icon.*url.*:" {
              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)maskable icon.*url.*:" {
              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)monochrome icon.*url.*:" {
              send -- "\r"
              exp_continue
            }

            -re "(?i)shortcuts.*" {
              send -- "\r"
              exp_continue
            }

            -re "(?i)play billing.*" {
              send -- "n\r"
              exp_continue
            }

            -re "(?i)location delegation.*" {
              send -- "n\r"
              exp_continue
            }

            -re "(?i)key path.*:" {
              send -- "./android-keystore\r"
              exp_continue
            }

            -re "(?i)key alias.*:" {
              send -- "$env(KEY_ALIAS)\r"
              exp_continue
            }

            -re "(?i)do you want.*create.*key" {
              # The keystore already exists, so this prompt normally
              # does not appear. Refuse if it does.
              send -- "n\r"
              exp_continue
            }

            -re "(?i)full name.*:" {
              send -- "Tamilanda Wallet\r"
              exp_continue
            }

            -re "(?i)organizational unit.*:" {
              send -- "Personal\r"
              exp_continue
            }

            -re "(?i)organization.*:" {
              send -- "Tamilanda\r"
              exp_continue
            }

            -re "(?i)country.*:" {
              send -- "IN\r"
              exp_continue
            }

            -re "(?i)keystore password.*:" {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -re "(?i)key password.*:" {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            eof {
              catch wait result
              exit [lindex $result 3]
            }

            timeout {
              puts stderr "Bubblewrap init timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/init-bubblewrap.expect
          /tmp/init-bubblewrap.expect

          test -f android/twa-project/twa-manifest.json
          test -f android/twa-project/gradlew

      # -------------------------------------------------------
      # Force exact app settings after init.
      # -------------------------------------------------------
      - name: Normalize TWA manifest
        shell: bash
        working-directory: android/twa-project
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("twa-manifest.json")
          data = json.loads(path.read_text())

          data["host"] = "tamilandaytofficial-create.github.io"
          data["startUrl"] = "./index.html"
          data["name"] = "Tamilanda Wallet"
          data["launcherName"] = "Tamilanda"
          data["packageId"] = "com.tamilanda.wallet"
          data["appVersionCode"] = 1
          data["appVersionName"] = "1.0.0"
          data["display"] = "standalone"
          data["orientation"] = "portrait"
          data["themeColor"] = "#09070d"
          data["backgroundColor"] = "#09070d"

          data["signingKey"]["path"] = str(
              Path(path.parent / "../android-keystore").resolve()
          )
          data["signingKey"]["alias"] = "tamilanda"

          path.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          cat twa-manifest.json

      # -------------------------------------------------------
      # Doctor before build.
      # -------------------------------------------------------
      - name: Verify Bubblewrap toolchain
        working-directory: android/twa-project
        run: |
          bubblewrap doctor

      # -------------------------------------------------------
      # Build
      # -------------------------------------------------------
      - name: Build signed APK and AAB
        working-directory: android/twa-project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          bubblewrap build \
            --manifest="./twa-manifest.json" \
            --skipPwaValidation \
            --signingKeyPath="../android-keystore" \
            --signingKeyAlias="tamilanda"

          test -f app-release-signed.apk
          test -f app-release-bundle.aab

          ls -lh \
            app-release-signed.apk \
            app-release-bundle.aab

      # -------------------------------------------------------
      # Upload APK
      # -------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-apk
          path: android/twa-project/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------
      # Upload AAB
      # -------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-aab
          path: android/twa-project/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------
      # Upload non-secret build metadata only.
      # DO NOT upload the keystore.
      # -------------------------------------------------------
      - name: Upload TWA metadata
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-twa-metadata
          path: |
            android/twa-project/twa-manifest.json
            android/twa-project/assetlinks.json
          if-no-files-found: warn
          retention-days: 30
