name: Build Tamilanda Wallet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      PWA_MANIFEST_URL: https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/manifest.json
      PWA_HOST: tamilandaytofficial-create.github.io
      PWA_START_URL: /Tamilanda-Wallet/
      PACKAGE_ID: com.tamilanda.wallet
      APP_NAME: Tamilanda Wallet
      LAUNCHER_NAME: Tamilanda
      KEY_ALIAS: tamilanda

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Show build environment
        run: |
          node --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      - name: Prepare Android SDK licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if [ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${ANDROID_HOME:-$HOME}" "${ANDROID_SDK_ROOT:-$HOME}" \
              -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          else
            echo "sdkmanager not found; Bubblewrap will use its own Android SDK setup."
          fi

      - name: Install Bubblewrap
        run: |
          npm install --global @bubblewrap/cli

          bubblewrap --version

      - name: Configure Bubblewrap paths
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          JDK_PATH="${JAVA_HOME}"

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            SDK_PATH="$(dirname "$(dirname "$(find "$HOME" -type f -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -n 1)")")"
          fi

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JDK_PATH",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate Android signing credentials
        shell: bash
        run: |
          set -e

          # For a first test build, an ephemeral key is generated automatically.
          # For a permanent/release build, add these GitHub Secrets later:
          # BUBBLEWRAP_KEYSTORE_PASSWORD
          # BUBBLEWRAP_KEY_PASSWORD

          if [ -n "${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}" ]; then
            KEYSTORE_PASSWORD="${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          fi

          if [ -n "${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}" ]; then
            KEY_PASSWORD="${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}"
          else
            KEY_PASSWORD="$(openssl rand -hex 24)"
          fi

          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Initialize Bubblewrap Android project
        shell: bash
        run: |
          set -e

          rm -rf android
          mkdir -p android

          cat > /tmp/bubblewrap-init.expect <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 600

          set manifest $env(PWA_MANIFEST_URL)
          set output_dir $env(GITHUB_WORKSPACE)/android
          set keystore_path $output_dir/android-keystore
          set key_alias $env(KEY_ALIAS)
          set keystore_password $env(KEYSTORE_PASSWORD)
          set key_password $env(KEY_PASSWORD)

          spawn bubblewrap init --manifest $manifest --directory $output_dir

          expect {
            -re "(?i)host.*:" {
              send -- "$env(PWA_HOST)\r"
              exp_continue
            }

            -re "(?i)start.?url.*:" {
              send -- "$env(PWA_START_URL)\r"
              exp_continue
            }

            -re "(?i)launcher name.*:" {
              send -- "$env(LAUNCHER_NAME)\r"
              exp_continue
            }

            -re "(?i)(app )?name.*:" {
              send -- "$env(APP_NAME)\r"
              exp_continue
            }

            -re "(?i)package id.*:" {
              send -- "$env(PACKAGE_ID)\r"
              exp_continue
            }

            -re "(?i)version code.*:" {
              send -- "1\r"
              exp_continue
            }

            -re "(?i)display mode" {
              send -- "\r"
              exp_continue
            }

            -re "(?i)orientation" {
              send -- "\r"
              exp_continue
            }

            -re "(?i)theme color.*:" {
              send -- "#09070d\r"
              exp_continue
            }

            -re "(?i)background color.*:" {
              send -- "#09070d\r"
              exp_continue
            }

            -re "(?i)(launcher )?icon url.*:" {
              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)maskable icon url.*:" {
              send -- "https://tamilandaytofficial-create.github.io/Tamilanda-Wallet/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)monochrome icon url.*:" {
              send -- "\r"
              exp_continue
            }

            -re "(?i)play billing" {
              send -- "n\r"
              exp_continue
            }

            -re "(?i)location delegation" {
              send -- "n\r"
              exp_continue
            }

            -re "(?i)key path.*:" {
              send -- "$keystore_path\r"
              exp_continue
            }

            -re "(?i)key alias.*:" {
              send -- "$key_alias\r"
              exp_continue
            }

            -re "(?i)(create|generate).*signing key" {
              send -- "y\r"
              exp_continue
            }

            -re "(?i)full name.*:" {
              send -- "$env(APP_NAME)\r"
              exp_continue
            }

            -re "(?i)organizational unit.*:" {
              send -- "Personal\r"
              exp_continue
            }

            -re "(?i)organization.*:" {
              send -- "Tamilanda\r"
              exp_continue
            }

            -re "(?i)country.*:" {
              send -- "IN\r"
              exp_continue
            }

            -re "(?i)keystore password.*:" {
              send -- "$keystore_password\r"
              exp_continue
            }

            -re "(?i)key password.*:" {
              send -- "$key_password\r"
              exp_continue
            }

            eof {
              catch wait result
              exit [lindex $result 3]
            }

            timeout {
              puts stderr "Timed out while answering Bubblewrap init."
              exit 1
            }

            default {
              send -- "\r"
              exp_continue
            }
          }
          EXPECT

          chmod +x /tmp/bubblewrap-init.expect

          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

          /tmp/bubblewrap-init.expect

      - name: Patch generated TWA manifest
        shell: bash
        run: |
          set -e

          test -f android/twa-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/twa-manifest.json")
          data = json.loads(path.read_text())

          data["host"] = "tamilandaytofficial-create.github.io"
          data["startUrl"] = "/Tamilanda-Wallet/"
          data["name"] = "Tamilanda Wallet"
          data["launcherName"] = "Tamilanda"
          data["packageId"] = "com.tamilanda.wallet"
          data["appVersionCode"] = 1
          data["appVersionName"] = "1.0.0"
          data["display"] = "standalone"
          data["orientation"] = "portrait"
          data["themeColor"] = "#09070d"
          data["backgroundColor"] = "#09070d"
          data["signingKey"]["alias"] = "tamilanda"

          path.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Build signed APK and AAB
        shell: bash
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -e

          bubblewrap build \
            --manifest="./twa-manifest.json" \
            --skipPwaValidation

          test -f app-release-signed.apk
          test -f app-release-bundle.aab

          ls -lh \
            app-release-signed.apk \
            app-release-bundle.aab

      - name: Generate Digital Asset Links
        shell: bash
        working-directory: android
        run: |
          bubblewrap fingerprint generateAssetLinks \
            --output="./assetlinks.json" \
            --manifest="./twa-manifest.json" || true

          if [ -f assetlinks.json ]; then
            echo "Generated assetlinks.json"
            cat assetlinks.json
          else
            echo "assetlinks.json was not generated."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-aab
          path: android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android project/debug files
        uses: actions/upload-artifact@v4
        with:
          name: tamilanda-wallet-android-files
          path: |
            android/twa-manifest.json
            android/assetlinks.json
          if-no-files-found: warn
          retention-days: 30
